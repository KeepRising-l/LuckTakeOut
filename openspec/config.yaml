schema: spec-driven

# 项目上下文：给 OpenSpec 产物施加约束的事实与约定。
# 不要把本段内容抄进任何产物文件里。
context: |
  项目：本科毕业设计《基于 Python 的外卖平台的管理与实现》。系统为多商户外卖平台，
  并在顾客端内置一个「AI 点餐助手」（基于大语言模型函数调用），用于对话式辅助下单、催单、评价。

  代码布局：
  - takeout/    后端 Django（Python 3.x）。app：user / merchant / product / cart / order /
                payment / delivery / review / platform_ops / ai_service / common / config。
  - web/        前端 npm workspaces monorepo：apps/customer、apps/merchant、apps/rider、
                packages/shared（Vue 3 + Vite + TypeScript + Pinia + Vue Router）。
  - thesis-docs/ 论文文档：02-需求分析.md、03-系统设计.md。

  需求权威源：thesis-docs/02-需求分析.md 是需求的唯一权威（第 5 稿）。
  openspec/specs 是它的可验证投影，用于驱动实现与验收；需求变更时先改 02，再同步 specs。
  openspec/specs 不进入论文交付物。

  角色：共四类——顾客、商户、骑手、平台运营（运营端由 Django Admin 承载）。
  AI 点餐助手属于顾客端内部的一个功能，不构成独立角色，也不单独成端。

  约定：
  - 后端统一响应格式 ResultAPI {code, info, data}，成功 code 为 '00000'。
  - 四类角色各自使用独立盐值的签名 token（见 common/auth.py）。
  - 数据库默认 SQLite；设置 DB_ENGINE=mysql 可切换 MySQL 8。
  - 支付为模拟支付；演示环境登录验证码可直接返回。
  - 退款口径：顾客对本人「已支付/待接单」订单发起全额退款申请 → 商户审核；同意则订单「已退款」
    且支付记录标记已退款，拒绝则按退款记录退回申请前状态；退款同意不回补库存。
  - 未配置大模型凭据时，AI 走内置规则化兜底实现。

  本期不包含：菜品规格与 SKU（菜品可交易属性为价格与可售数量）；
  真实支付对接；短信/邮件/APP 推送；优惠券与积分；复杂配送调度（地图导航、路径规划、
  智能派单、实时定位、拼单）；独立的运营端前端界面。

  库存口径：下单时行锁校验并自动扣减库存，取消订单按明细回补；库存基线由商户在商户端维护。

# 按产物类型的规则（仅在写该产物时生效）。
rules:
  proposal:
    - 用中文书写。
    - 明确列出本期范围与不包含项。
    - 涉及功能时引用 thesis-docs/02-需求分析.md 的编号（F-A-xx / F-B-xx / F-C-xx / F-D-xx / F-E-xx、UC-xx、R1–R5）。
  specs:
    - 用中文书写，需求语句使用「系统应当……」的陈述形式。
    - 场景只使用 WHEN / THEN 两个关键字；需要表达附加结果时并入 THEN，不引入第三个并列关键字。
    - openspec validate 会对缺少英文 SHALL/MUST 的规格给出提示；该提示针对英文规格，本项目接受该提示，以 validate 通过为准，不使用 --strict。
    - 每个 requirement 至少配一个 WHEN/THEN 形式的场景。
    - main specs 只描述已生效的能力；已承诺但代码未达标的能力不得写入基线，应留给后续 change 的增量。
    - capability 路径按端划分，例如 customer-ordering、merchant-console、rider-delivery、platform-ops、ai-ordering-assistant。
  design:
    - 用中文书写。
    - 说明技术决策、被否决的替代方案及理由；涉及状态、数据结构与接口契约时给出明确口径。
  tasks:
    - 用中文书写。
    - 每条任务可独立验证，并指明涉及的具体文件路径。
