<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家登录 - 外卖管理后台</title>
    <style>
        :root {
            --primary-color: #FFD100;
            --primary-dark: #E6BC00;
            --success-color: #06C755;
            --danger-color: #FF1744;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #E0E0E0;
            --bg-color: #F5F5F5;
            --white: #FFFFFF;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-lg: 0 4px 20px rgba(0,0,0,0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .login-header {
            background: var(--primary-color);
            padding: 40px 30px 30px;
            text-align: center;
            position: relative;
        }

        .login-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="%23ffffff" opacity="0.1"/><circle cx="80" cy="30" r="1.5" fill="%23ffffff" opacity="0.1"/><circle cx="40" cy="70" r="1" fill="%23ffffff" opacity="0.1"/><circle cx="90" cy="80" r="2.5" fill="%23ffffff" opacity="0.1"/><circle cx="10" cy="60" r="1.5" fill="%23ffffff" opacity="0.1"/></svg>') repeat;
        }

        .logo {
            font-size: 48px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .login-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .login-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .login-form {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(255, 209, 0, 0.1);
        }

        .form-input.error {
            border-color: var(--danger-color);
        }

        .error-message {
            color: var(--danger-color);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-input.error + .error-message {
            display: block;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .remember-me input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary-color);
        }

        .forgot-password {
            color: var(--primary-color);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: var(--primary-dark);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: var(--text-primary);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 209, 0, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .login-btn .loading {
            display: none;
        }

        .login-btn.loading .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .login-footer {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .register-link {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .register-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            color: var(--primary-dark);
        }

        .test-account {
            text-align: center;
            margin-bottom: 16px;
        }

        .test-btn {
            background: #f8f9fa;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .test-btn:hover {
            background: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--text-primary);
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.success {
            background: #e8f5e8;
            color: var(--success-color);
            border: 1px solid #c3e6c3;
        }

        .alert.error {
            background: #ffeaea;
            color: var(--danger-color);
            border: 1px solid #ffcdd2;
        }

        .alert.show {
            display: block;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .login-container {
                margin: 10px;
            }

            .login-header {
                padding: 30px 20px 20px;
            }

            .login-form {
                padding: 20px;
            }

            .login-footer {
                padding: 15px 20px;
            }
        }

        /* 动画效果 */
        .login-container {
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            animation: fadeIn 0.6s ease-out;
            animation-fill-mode: both;
        }

        .form-group:nth-child(1) { animation-delay: 0.1s; }
        .form-group:nth-child(2) { animation-delay: 0.2s; }
        .form-group:nth-child(3) { animation-delay: 0.3s; }
        .form-group:nth-child(4) { animation-delay: 0.4s; }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🍔</div>
            <h1 class="login-title">商家登录</h1>
            <p class="login-subtitle">登录您的商家管理后台</p>
        </div>

        <form class="login-form" id="loginForm">
            <div class="alert" id="alertMessage"></div>

            <div class="form-group">
                <label class="form-label" for="username">用户名/手机号</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    placeholder="请输入用户名或手机号"
                    required
                >
                <div class="error-message">请输入有效的用户名或手机号</div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    placeholder="请输入密码"
                    required
                >
                <div class="error-message">密码不能为空</div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <span>记住我</span>
                </label>
                <a href="#" class="forgot-password">忘记密码？</a>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                <span class="loading"></span>
                <span class="btn-text">登录</span>
            </button>
        </form>

        <div class="login-footer">
            <div class="test-account">
                <p style="color: var(--text-secondary); font-size: 14px; margin-bottom: 8px;">测试账号</p>
                <button type="button" class="test-btn" onclick="fillTestAccount()">
                    账号: admin / 密码: 123456
                </button>
            </div>
            <p class="register-link" style="margin-top: 16px;">
                还没有账号？<a href="register.html">立即注册</a>
            </p>
        </div>
    </div>

    <script>
        class LoginManager {
            constructor() {
                this.form = document.getElementById('loginForm');
                this.usernameInput = document.getElementById('username');
                this.passwordInput = document.getElementById('password');
                this.rememberMeInput = document.getElementById('rememberMe');
                this.loginBtn = document.getElementById('loginBtn');
                this.alertMessage = document.getElementById('alertMessage');
                
                this.init();
            }

            init() {
                this.bindEvents();
                this.loadRememberedCredentials();
            }

            bindEvents() {
                this.form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                // 输入验证
                this.usernameInput.addEventListener('blur', () => {
                    this.validateUsername();
                });

                this.passwordInput.addEventListener('blur', () => {
                    this.validatePassword();
                });

                // 清除错误状态
                this.usernameInput.addEventListener('input', () => {
                    this.clearError(this.usernameInput);
                });

                this.passwordInput.addEventListener('input', () => {
                    this.clearError(this.passwordInput);
                });

                // 回车登录
                this.form.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.handleLogin();
                    }
                });
            }

            validateUsername() {
                const username = this.usernameInput.value.trim();
                if (!username) {
                    this.showFieldError(this.usernameInput, '请输入用户名或手机号');
                    return false;
                }

                // 简单的手机号验证
                const phoneRegex = /^1[3-9]\d{9}$/;
                const isPhone = phoneRegex.test(username);
                const isUsername = username.length >= 3;

                if (!isPhone && !isUsername) {
                    this.showFieldError(this.usernameInput, '请输入有效的用户名或手机号');
                    return false;
                }

                this.clearError(this.usernameInput);
                return true;
            }

            validatePassword() {
                const password = this.passwordInput.value;
                if (!password) {
                    this.showFieldError(this.passwordInput, '请输入密码');
                    return false;
                }

                if (password.length < 6) {
                    this.showFieldError(this.passwordInput, '密码至少6位');
                    return false;
                }

                this.clearError(this.passwordInput);
                return true;
            }

            showFieldError(input, message) {
                input.classList.add('error');
                const errorEl = input.nextElementSibling;
                if (errorEl && errorEl.classList.contains('error-message')) {
                    errorEl.textContent = message;
                }
            }

            clearError(input) {
                input.classList.remove('error');
            }

            showAlert(message, type = 'error') {
                this.alertMessage.textContent = message;
                this.alertMessage.className = `alert ${type} show`;
                
                // 3秒后自动隐藏
                setTimeout(() => {
                    this.alertMessage.classList.remove('show');
                }, 3000);
            }

            setLoading(loading) {
                if (loading) {
                    this.loginBtn.classList.add('loading');
                    this.loginBtn.disabled = true;
                    this.loginBtn.querySelector('.btn-text').textContent = '登录中...';
                } else {
                    this.loginBtn.classList.remove('loading');
                    this.loginBtn.disabled = false;
                    this.loginBtn.querySelector('.btn-text').textContent = '登录';
                }
            }

            async handleLogin() {
                // 验证表单
                const isUsernameValid = this.validateUsername();
                const isPasswordValid = this.validatePassword();

                if (!isUsernameValid || !isPasswordValid) {
                    return;
                }

                const formData = {
                    username: this.usernameInput.value.trim(),
                    password: this.passwordInput.value,
                    rememberMe: this.rememberMeInput.checked
                };

                this.setLoading(true);

                try {
                    const response = await this.login(formData);
                    
                    if (response.success) {
                        this.showAlert('登录成功，正在跳转...', 'success');
                        
                        // 保存登录状态
                        this.saveLoginState(response.data);
                        
                        // 记住用户名
                        if (formData.rememberMe) {
                            localStorage.setItem('rememberedUsername', formData.username);
                        } else {
                            localStorage.removeItem('rememberedUsername');
                        }
                        
                        // 跳转到主页
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        this.showAlert(response.message || '登录失败，请检查用户名和密码');
                    }
                } catch (error) {
                    console.error('登录错误:', error);
                    this.showAlert('网络错误，请稍后重试');
                } finally {
                    this.setLoading(false);
                }
            }

            async login(credentials) {
                // 模拟API调用
                return new Promise((resolve) => {
                    setTimeout(() => {
                        // 这里应该调用实际的登录API
                        // const response = await fetch('/api/merchant/login', {
                        //     method: 'POST',
                        //     headers: {
                        //         'Content-Type': 'application/json'
                        //     },
                        //     body: JSON.stringify(credentials)
                        // });
                        // return response.json();
                        
                        // 调用后端真实登录接口
                        fetch('/api/merchant/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(credentials)
                        })
                            .then(r => r.json())
                            .then(data => resolve(data))
                            .catch(() => resolve({ success: false, message: '网络错误，请稍后重试' }));
                    }, 0);
                });
            }

            saveLoginState(userData) {
                // 保存到localStorage
                localStorage.setItem('merchantToken', userData.token);
                localStorage.setItem('merchantInfo', JSON.stringify({
                    id: userData.merchantId,
                    name: userData.merchantName,
                    avatar: userData.avatar
                }));
            }

            loadRememberedCredentials() {
                const rememberedUsername = localStorage.getItem('rememberedUsername');
                if (rememberedUsername) {
                    this.usernameInput.value = rememberedUsername;
                    this.rememberMeInput.checked = true;
                }
            }
        }

        // 检查是否已登录
        function checkLoginStatus() {
            const token = localStorage.getItem('merchantToken');
            if (token) {
                // 如果已登录，直接跳转到主页
                window.location.href = 'index.html';
            }
        }

        // 填入测试账号
        function fillTestAccount() {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = '123456';
            
            // 清除可能存在的错误状态
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            usernameInput.classList.remove('error');
            passwordInput.classList.remove('error');
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkLoginStatus();
            new LoginManager();
        });
    </script>
</body>
</html>
