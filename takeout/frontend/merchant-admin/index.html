<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家管理后台</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/layout.css">
    <script src="js/utils.js"></script>
    <style>
        :root {
            --primary-color: #FFD100;
            --primary-dark: #E6BC00;
            --success-color: #06C755;
            --warning-color: #FF6600;
            --danger-color: #FF1744;
            --info-color: #1976D2;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #E0E0E0;
            --bg-color: #F5F5F5;
            --white: #FFFFFF;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .admin-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 侧边栏 */
        .sidebar {
            width: 250px;
            background: var(--white);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: width 0.3s ease;
        }

        .sidebar.collapsed {
            width: 60px;
        }

        .sidebar-header {
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            background: var(--primary-color);
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar-menu {
            flex: 1;
            overflow-y: auto;
            padding: 10px 0;
        }

        .menu-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background-color: #f8f9fa;
            color: var(--primary-color);
        }

        .menu-item.active {
            background-color: #fff3e0;
            color: var(--primary-color);
            border-left-color: var(--primary-color);
        }

        .menu-icon {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            font-size: 18px;
            text-align: center;
            flex-shrink: 0;
        }

        .menu-text {
            white-space: nowrap;
            overflow: hidden;
            transition: opacity 0.3s ease;
        }

        .sidebar.collapsed .menu-text {
            opacity: 0;
        }

        /* 主内容区 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部导航 */
        .top-nav {
            height: 60px;
            background: var(--white);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: var(--shadow);
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .toggle-btn {
            background: none;
            border: none;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 8px;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }

        .toggle-btn:hover {
            background-color: var(--bg-color);
        }

        .breadcrumb {
            margin-left: 20px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .breadcrumb-item {
            color: var(--text-muted);
        }

        .breadcrumb-item.active {
            color: var(--text-primary);
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-indicator.online {
            background: #e8f5e8;
            color: var(--success-color);
        }

        .status-indicator.offline {
            background: #ffeaea;
            color: var(--danger-color);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: background-color 0.3s ease;
        }

        .user-info:hover {
            background-color: var(--bg-color);
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: bold;
        }

        .user-name {
            font-size: 14px;
            color: var(--text-primary);
        }

        /* 内容区域 */
        .content-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .page-header {
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .page-description {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* 卡片样式 */
        .card {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .card-body {
            padding: 20px;
        }

        /* 按钮样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--text-primary);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success-color);
            color: var(--white);
        }

        .btn-warning {
            background: var(--warning-color);
            color: var(--white);
        }

        .btn-danger {
            background: var(--danger-color);
            color: var(--white);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: -250px;
                z-index: 1000;
                transition: left 0.3s ease;
            }

            .sidebar.show {
                left: 0;
            }

            .main-content {
                margin-left: 0;
            }

            .breadcrumb {
                display: none;
            }
        }

        /* 加载状态 */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .loading-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top: 2px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">🍔 商家后台</div>
            </div>
            <nav class="sidebar-menu">
                <a href="#" class="menu-item active" data-page="statistics">
                    <span class="menu-icon">📊</span>
                    <span class="menu-text">数据统计</span>
                </a>
                <a href="#" class="menu-item" data-page="orders">
                    <span class="menu-icon">📋</span>
                    <span class="menu-text">订单管理</span>
                </a>
                <a href="#" class="menu-item" data-page="products">
                    <span class="menu-icon">🍔</span>
                    <span class="menu-text">菜品管理</span>
                </a>
                <a href="#" class="menu-item" data-page="categories">
                    <span class="menu-icon">📂</span>
                    <span class="menu-text">分类管理</span>
                </a>
                <a href="#" class="menu-item" data-page="shop-info">
                    <span class="menu-icon">🏪</span>
                    <span class="menu-text">店铺设置</span>
                </a>
            </nav>
        </div>

        <!-- 主内容区 -->
        <div class="main-content">
            <!-- 顶部导航 -->
            <header class="top-nav">
                <div class="nav-left">
                    <button class="toggle-btn" id="toggleSidebar">
                        ☰
                    </button>
                    <div class="breadcrumb">
                        <span class="breadcrumb-item">首页</span>
                        <span> / </span>
                        <span class="breadcrumb-item active" id="currentPage">数据概览</span>
                    </div>
                </div>
                <div class="nav-right">
                    <div class="status-indicator online" id="shopStatus">
                        <span class="status-dot"></span>
                        <span>营业中</span>
                    </div>
                    <div class="user-info" id="userInfo">
                        <div class="user-avatar">商</div>
                        <span class="user-name" id="userName">商家名称</span>
                    </div>
                </div>
            </header>

            <!-- 内容区域 -->
            <main class="content-area" id="contentArea">
                <div class="page-header">
                    <h1 class="page-title" id="pageTitle">数据概览</h1>
                    <p class="page-description" id="pageDescription">查看店铺运营数据和关键指标</p>
                </div>
                
                <!-- 页面内容将通过JavaScript动态加载 -->
                <div id="pageContent">
                    <div class="loading">
                        <div class="loading-spinner"></div>
                        <span>加载中...</span>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script>
        // 页面管理器
        class PageManager {
            constructor() {
                this.currentPage = 'statistics';
                this.pages = {
                    statistics: {
                        title: '数据统计',
                        description: '查看店铺运营数据和关键指标',
                        url: 'pages/statistics.html'
                    },
                    orders: {
                        title: '订单管理',
                        description: '处理订单、查看订单详情',
                        url: 'pages/orders.html'
                    },
                    products: {
                        title: '菜品管理',
                        description: '管理菜品信息、价格和库存',
                        url: 'pages/products.html'
                    },
                    categories: {
                        title: '分类管理',
                        description: '管理菜品分类信息',
                        url: 'pages/categories.html'
                    },
                    'shop-info': {
                        title: '店铺设置',
                        description: '管理店铺基本信息和营业状态',
                        url: 'pages/shop-info.html'
                    }
                };
                this.init();
            }

            init() {
                this.bindEvents();
                this.loadPage(this.currentPage);
                this.loadUserInfo();
                this.loadShopStatus();
            }

            bindEvents() {
                // 侧边栏切换
                document.getElementById('toggleSidebar').addEventListener('click', () => {
                    document.getElementById('sidebar').classList.toggle('collapsed');
                });

                // 菜单点击
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.addEventListener('click', (e) => {
                        e.preventDefault();
                        const page = item.getAttribute('data-page');
                        this.switchPage(page);
                    });
                });

                // 用户信息点击
                document.getElementById('userInfo').addEventListener('click', () => {
                    this.showUserMenu();
                });

                // 店铺状态点击
                document.getElementById('shopStatus').addEventListener('click', () => {
                    this.toggleShopStatus();
                });
            }

            switchPage(page) {
                if (page === this.currentPage) return;

                // 更新菜单状态
                document.querySelectorAll('.menu-item').forEach(item => {
                    item.classList.remove('active');
                });
                document.querySelector(`[data-page="${page}"]`).classList.add('active');

                // 更新页面信息
                this.currentPage = page;
                const pageInfo = this.pages[page];
                document.getElementById('currentPage').textContent = pageInfo.title;
                document.getElementById('pageTitle').textContent = pageInfo.title;
                document.getElementById('pageDescription').textContent = pageInfo.description;

                // 加载页面内容
                this.loadPage(page);
            }

            async loadPage(page) {
                const contentArea = document.getElementById('pageContent');
                contentArea.innerHTML = '<div class="loading"><div class="loading-spinner"></div><span>加载中...</span></div>';

                try {
                    const pageInfo = this.pages[page];
                    if (pageInfo && pageInfo.url) {
                        // 尝试加载外部页面文件
                        const response = await fetch(pageInfo.url);
                        if (response.ok) {
                            const html = await response.text();
                            contentArea.innerHTML = html;
                        } else {
                            // 如果外部文件不存在，使用内置内容
                            contentArea.innerHTML = this.getPageContent(page);
                        }
                    } else {
                        // 使用内置内容
                        contentArea.innerHTML = this.getPageContent(page);
                    }
                } catch (error) {
                    console.error('加载页面失败:', error);
                    // 降级到内置内容
                    contentArea.innerHTML = this.getPageContent(page);
                }
            }

            getPageContent(page) {
                switch (page) {
                    case 'statistics':
                        return this.getStatisticsContent();
                    case 'orders':
                        return this.getOrdersContent();
                    case 'products':
                        return this.getProductsContent();
                    case 'categories':
                        return this.getCategoriesContent();
                    case 'shop-info':
                        return this.getShopInfoContent();
                    default:
                        return '<div class="card"><div class="card-body">页面内容开发中...</div></div>';
                }
            }

            getStatisticsContent() {
                return `
                    <div class="dashboard-stats">
                        <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 20px;">
                            <div class="stat-card card">
                                <div class="card-body" style="text-align: center;">
                                    <div style="font-size: 32px; color: var(--success-color); margin-bottom: 8px;">¥2,580</div>
                                    <div style="color: var(--text-secondary);">今日营业额</div>
                                </div>
                            </div>
                            <div class="stat-card card">
                                <div class="card-body" style="text-align: center;">
                                    <div style="font-size: 32px; color: var(--info-color); margin-bottom: 8px;">45</div>
                                    <div style="color: var(--text-secondary);">今日订单</div>
                                </div>
                            </div>
                            <div class="stat-card card">
                                <div class="card-body" style="text-align: center;">
                                    <div style="font-size: 32px; color: var(--warning-color); margin-bottom: 8px;">8</div>
                                    <div style="color: var(--text-secondary);">待处理订单</div>
                                </div>
                            </div>
                            <div class="stat-card card">
                                <div class="card-body" style="text-align: center;">
                                    <div style="font-size: 32px; color: var(--primary-color); margin-bottom: 8px;">4.8</div>
                                    <div style="color: var(--text-secondary);">店铺评分</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">最近订单</div>
                            <a href="#" class="btn btn-outline">查看全部</a>
                        </div>
                        <div class="card-body">
                            <div style="color: var(--text-muted); text-align: center; padding: 40px;">暂无订单数据</div>
                        </div>
                    </div>
                `;
            }

            getOrdersContent() {
                return '<div class="card"><div class="card-body">订单管理页面开发中...</div></div>';
            }

            getProductsContent() {
                return '<div class="card"><div class="card-body">菜品管理页面开发中...</div></div>';
            }

            getCategoriesContent() {
                return '<div class="card"><div class="card-body">分类管理页面开发中...</div></div>';
            }

            getShopInfoContent() {
                return '<div class="card"><div class="card-body">店铺设置页面开发中...</div></div>';
            }

            async loadUserInfo() {
                try {
                    // 这里应该调用API获取用户信息
                    // 暂时使用模拟数据
                    const userInfo = {
                        name: '测试商家',
                        avatar: ''
                    };
                    document.getElementById('userName').textContent = userInfo.name;
                } catch (error) {
                    console.error('加载用户信息失败:', error);
                }
            }

            async loadShopStatus() {
                try {
                    // 这里应该调用API获取店铺状态
                    // 暂时使用模拟数据
                    const shopStatus = {
                        isOpen: true
                    };
                    this.updateShopStatusDisplay(shopStatus.isOpen);
                } catch (error) {
                    console.error('加载店铺状态失败:', error);
                }
            }

            updateShopStatusDisplay(isOpen) {
                const statusEl = document.getElementById('shopStatus');
                if (isOpen) {
                    statusEl.className = 'status-indicator online';
                    statusEl.innerHTML = '<span class="status-dot"></span><span>营业中</span>';
                } else {
                    statusEl.className = 'status-indicator offline';
                    statusEl.innerHTML = '<span class="status-dot"></span><span>休息中</span>';
                }
            }

            async toggleShopStatus() {
                try {
                    // 这里应该调用API切换店铺状态
                    console.log('切换店铺状态');
                } catch (error) {
                    console.error('切换店铺状态失败:', error);
                }
            }

            showUserMenu() {
                // 显示用户菜单（退出登录等）
                console.log('显示用户菜单');
            }
        }

        // 初始化页面管理器
        document.addEventListener('DOMContentLoaded', () => {
            new PageManager();
        });
    </script>
</body>
</html>
