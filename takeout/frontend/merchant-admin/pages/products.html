<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>菜品管理 - 商家管理后台</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <style>
        .products-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .search-box {
            position: relative;
            width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
        }

        .search-btn {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .filter-select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            min-width: 120px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .product-card {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: var(--bg-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .product-info {
            padding: 16px;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px 0;
            line-height: 1.4;
        }

        .product-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 12px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .product-price {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .product-stock {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .product-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-active {
            background: var(--success-light);
            color: var(--success-color);
        }

        .status-inactive {
            background: var(--danger-light);
            color: var(--danger-color);
        }

        .status-out-of-stock {
            background: var(--warning-light);
            color: var(--warning-color);
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            flex: 1;
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--white);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-light);
        }

        .action-btn.primary {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .action-btn.primary:hover {
            background: var(--primary-dark);
        }

        .action-btn.danger {
            background: var(--danger-color);
            color: var(--white);
            border-color: var(--danger-color);
        }

        .action-btn.danger:hover {
            background: var(--danger-dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--white);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: var(--bg-light);
        }

        .page-btn.active {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 模态框样式 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 24px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 16px 0;
        }

        .modal-body {
            padding: 0 24px;
        }

        .modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .form-grid .form-group.full-width {
            grid-column: 1 / -1;
        }

        .image-upload {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .image-upload:hover {
            border-color: var(--primary-color);
        }

        .image-upload.has-image {
            padding: 0;
            border: none;
        }

        .upload-preview {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }

        .upload-placeholder {
            color: var(--text-secondary);
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .products-container {
                padding: 16px;
            }

            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }

            .header-actions {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .filters {
                flex-direction: column;
                gap: 12px;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="products-container">
        <div class="page-header">
            <h1 class="page-title">菜品管理</h1>
            <div class="header-actions">
                <div class="search-box">
                    <input type="text" class="search-input" id="searchInput" placeholder="搜索菜品名称...">
                    <button class="search-btn" id="searchBtn">🔍</button>
                </div>
                <button class="btn btn-primary" id="addProductBtn">+ 添加菜品</button>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <span class="filter-label">分类:</span>
                <select class="filter-select" id="categoryFilter">
                    <option value="">全部分类</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">状态:</span>
                <select class="filter-select" id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="ACTIVE">上架中</option>
                    <option value="INACTIVE">已下架</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">库存:</span>
                <select class="filter-select" id="stockFilter">
                    <option value="">全部</option>
                    <option value="in-stock">有库存</option>
                    <option value="out-of-stock">缺货</option>
                </select>
            </div>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- 菜品卡片将在这里动态生成 -->
        </div>

        <div class="pagination" id="pagination">
            <!-- 分页将在这里动态生成 -->
        </div>
    </div>

    <!-- 添加/编辑菜品模态框 -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="loading-overlay" id="modalLoading">
                <div class="spinner"></div>
            </div>
            
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">添加菜品</h2>
            </div>
            
            <div class="modal-body">
                <form id="productForm">
                    <div class="form-grid">
                        <div class="form-group">
                            <label class="form-label required">菜品名称</label>
                            <input type="text" class="form-input" id="productName" name="name" placeholder="请输入菜品名称" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">菜品分类</label>
                            <select class="form-input" id="productCategory" name="categoryId" required>
                                <option value="">请选择分类</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label required">价格 (元)</label>
                            <input type="number" class="form-input" id="productPrice" name="price" placeholder="0.00" min="0" step="0.01" required>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label">库存数量</label>
                            <input type="number" class="form-input" id="productStock" name="stock" placeholder="0" min="0">
                        </div>
                        
                        <div class="form-group full-width">
                            <label class="form-label">菜品描述</label>
                            <textarea class="form-input" id="productDescription" name="description" placeholder="请输入菜品描述" rows="3"></textarea>
                        </div>
                        
                        <div class="form-group full-width">
                            <label class="form-label">菜品图片</label>
                            <div class="image-upload" id="imageUpload">
                                <div class="upload-placeholder">
                                    <div style="font-size: 24px; margin-bottom: 8px;">📷</div>
                                    <div>点击上传菜品图片</div>
                                    <div style="font-size: 12px; margin-top: 4px; color: var(--text-secondary);">支持 JPG、PNG 格式，建议尺寸 400x300</div>
                                </div>
                            </div>
                            <input type="file" id="imageInput" accept="image/*" style="display: none;">
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="modal-footer">
                <button type="button" class="btn btn-outline" id="cancelBtn">取消</button>
                <button type="button" class="btn btn-primary" id="saveProductBtn">保存</button>
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script>
        class ProductManager {
            constructor() {
                this.products = [];
                this.categories = [];
                this.currentPage = 1;
                this.pageSize = 12;
                this.totalPages = 0;
                this.filters = {
                    search: '',
                    category: '',
                    status: '',
                    stock: ''
                };
                this.editingProduct = null;
                this.isLoading = false;
                
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadCategories();
                await this.loadProducts();
            }

            bindEvents() {
                // 搜索
                const searchInput = document.getElementById('searchInput');
                searchInput.addEventListener('input', Utils.debounce(() => {
                    this.filters.search = searchInput.value.trim();
                    this.currentPage = 1;
                    this.loadProducts();
                }, 300));

                document.getElementById('searchBtn').addEventListener('click', () => {
                    this.filters.search = searchInput.value.trim();
                    this.currentPage = 1;
                    this.loadProducts();
                });

                // 筛选器
                document.getElementById('categoryFilter').addEventListener('change', (e) => {
                    this.filters.category = e.target.value;
                    this.currentPage = 1;
                    this.loadProducts();
                });

                document.getElementById('statusFilter').addEventListener('change', (e) => {
                    this.filters.status = e.target.value;
                    this.currentPage = 1;
                    this.loadProducts();
                });

                document.getElementById('stockFilter').addEventListener('change', (e) => {
                    this.filters.stock = e.target.value;
                    this.currentPage = 1;
                    this.loadProducts();
                });

                // 添加菜品
                document.getElementById('addProductBtn').addEventListener('click', () => {
                    this.showProductModal();
                });

                // 模态框事件
                document.getElementById('cancelBtn').addEventListener('click', () => {
                    this.hideProductModal();
                });

                document.getElementById('saveProductBtn').addEventListener('click', () => {
                    this.saveProduct();
                });

                // 图片上传
                document.getElementById('imageUpload').addEventListener('click', () => {
                    document.getElementById('imageInput').click();
                });

                document.getElementById('imageInput').addEventListener('change', (e) => {
                    this.handleImageUpload(e.target.files[0]);
                });

                // 模态框外点击关闭
                document.getElementById('productModal').addEventListener('click', (e) => {
                    if (e.target.id === 'productModal') {
                        this.hideProductModal();
                    }
                });
            }

            async loadCategories() {
                try {
                    const response = await ApiService.category.getList();
                    if (response.success) {
                        this.categories = response.data;
                        this.populateCategoryOptions();
                    }
                } catch (error) {
                    console.error('加载分类失败:', error);
                }
            }

            populateCategoryOptions() {
                const categoryFilter = document.getElementById('categoryFilter');
                const productCategory = document.getElementById('productCategory');
                
                // 清空现有选项
                categoryFilter.innerHTML = '<option value="">全部分类</option>';
                productCategory.innerHTML = '<option value="">请选择分类</option>';
                
                // 添加分类选项
                this.categories.forEach(category => {
                    const option1 = new Option(category.name, category.id);
                    const option2 = new Option(category.name, category.id);
                    categoryFilter.appendChild(option1);
                    productCategory.appendChild(option2);
                });
            }

            async loadProducts() {
                if (this.isLoading) return;
                
                try {
                    this.setLoading(true);
                    
                    const params = {
                        page: this.currentPage,
                        size: this.pageSize,
                        ...this.filters
                    };
                    
                    // 移除空值
                    Object.keys(params).forEach(key => {
                        if (!params[key]) delete params[key];
                    });
                    
                    const response = await ApiService.product.getList(params);
                    
                    if (response.success) {
                        this.products = response.data.items || [];
                        this.totalPages = response.data.totalPages || 0;
                        this.renderProducts();
                        this.renderPagination();
                    } else {
                        Message.error(response.message || '加载菜品失败');
                    }
                } catch (error) {
                    console.error('加载菜品失败:', error);
                    Message.error('加载菜品失败，请刷新页面重试');
                } finally {
                    this.setLoading(false);
                }
            }

            renderProducts() {
                const grid = document.getElementById('productsGrid');
                
                if (this.products.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column: 1 / -1;">
                            <div class="empty-icon">🍽️</div>
                            <div>暂无菜品</div>
                            <div style="margin-top: 8px; font-size: 14px;">点击"添加菜品"开始添加您的第一道菜品</div>
                        </div>
                    `;
                    return;
                }
                
                grid.innerHTML = this.products.map(product => this.renderProductCard(product)).join('');
            }

            renderProductCard(product) {
                const statusClass = product.status === 'ACTIVE' ? 'status-active' : 'status-inactive';
                const statusText = product.status === 'ACTIVE' ? '上架中' : '已下架';
                const stockStatus = product.stock > 0 ? '' : 'status-out-of-stock';
                const stockText = product.stock > 0 ? `库存: ${product.stock}` : '缺货';
                
                return `
                    <div class="product-card">
                        <div class="product-image">
                            ${product.image ? 
                                `<img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover;">` : 
                                '暂无图片'
                            }
                        </div>
                        <div class="product-info">
                            <h3 class="product-name">${product.name}</h3>
                            <p class="product-desc">${product.description || '暂无描述'}</p>
                            <div class="product-meta">
                                <span class="product-price">${Utils.formatMoney(product.price)}</span>
                                <span class="product-stock ${stockStatus}">${stockText}</span>
                            </div>
                            <div style="margin-bottom: 12px;">
                                <span class="product-status ${statusClass}">${statusText}</span>
                            </div>
                            <div class="product-actions">
                                <button class="action-btn" onclick="productManager.editProduct(${product.id})">编辑</button>
                                <button class="action-btn ${product.status === 'ACTIVE' ? 'danger' : 'primary'}" 
                                        onclick="productManager.toggleProductStatus(${product.id}, '${product.status}')">
                                    ${product.status === 'ACTIVE' ? '下架' : '上架'}
                                </button>
                                <button class="action-btn" onclick="productManager.updateStock(${product.id})">库存</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            renderPagination() {
                const pagination = document.getElementById('pagination');
                
                if (this.totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }
                
                let html = '';
                
                // 上一页
                html += `<button class="page-btn" ${this.currentPage === 1 ? 'disabled' : ''} 
                                onclick="productManager.goToPage(${this.currentPage - 1})">上一页</button>`;
                
                // 页码
                const startPage = Math.max(1, this.currentPage - 2);
                const endPage = Math.min(this.totalPages, this.currentPage + 2);
                
                if (startPage > 1) {
                    html += `<button class="page-btn" onclick="productManager.goToPage(1)">1</button>`;
                    if (startPage > 2) {
                        html += `<span style="padding: 8px;">...</span>`;
                    }
                }
                
                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" 
                                    onclick="productManager.goToPage(${i})">${i}</button>`;
                }
                
                if (endPage < this.totalPages) {
                    if (endPage < this.totalPages - 1) {
                        html += `<span style="padding: 8px;">...</span>`;
                    }
                    html += `<button class="page-btn" onclick="productManager.goToPage(${this.totalPages})">${this.totalPages}</button>`;
                }
                
                // 下一页
                html += `<button class="page-btn" ${this.currentPage === this.totalPages ? 'disabled' : ''} 
                                onclick="productManager.goToPage(${this.currentPage + 1})">下一页</button>`;
                
                pagination.innerHTML = html;
            }

            goToPage(page) {
                if (page < 1 || page > this.totalPages || page === this.currentPage) return;
                this.currentPage = page;
                this.loadProducts();
            }

            showProductModal(product = null) {
                this.editingProduct = product;
                const modal = document.getElementById('productModal');
                const title = document.getElementById('modalTitle');
                const form = document.getElementById('productForm');
                
                title.textContent = product ? '编辑菜品' : '添加菜品';
                
                if (product) {
                    this.populateForm(product);
                } else {
                    form.reset();
                    this.resetImageUpload();
                }
                
                modal.classList.add('show');
            }

            hideProductModal() {
                const modal = document.getElementById('productModal');
                modal.classList.remove('show');
                this.editingProduct = null;
            }

            populateForm(product) {
                document.getElementById('productName').value = product.name || '';
                document.getElementById('productCategory').value = product.categoryId || '';
                document.getElementById('productPrice').value = product.price || '';
                document.getElementById('productStock').value = product.stock || '';
                document.getElementById('productDescription').value = product.description || '';
                
                if (product.image) {
                    this.setImagePreview(product.image);
                } else {
                    this.resetImageUpload();
                }
            }

            async saveProduct() {
                const form = document.getElementById('productForm');
                if (!this.validateForm()) return;
                
                try {
                    this.setModalLoading(true);
                    
                    const formData = new FormData(form);
                    const data = Object.fromEntries(formData.entries());
                    
                    // 转换数值类型
                    if (data.price) data.price = parseFloat(data.price);
                    if (data.stock) data.stock = parseInt(data.stock);
                    
                    let response;
                    if (this.editingProduct) {
                        response = await ApiService.product.update(this.editingProduct.id, data);
                    } else {
                        response = await ApiService.product.create(data);
                    }
                    
                    if (response.success) {
                        Message.success(this.editingProduct ? '菜品更新成功' : '菜品添加成功');
                        this.hideProductModal();
                        await this.loadProducts();
                    } else {
                        Message.error(response.message || '保存失败');
                    }
                } catch (error) {
                    console.error('保存菜品失败:', error);
                    Message.error('保存失败，请重试');
                } finally {
                    this.setModalLoading(false);
                }
            }

            async editProduct(productId) {
                try {
                    const response = await ApiService.product.getDetail(productId);
                    if (response.success) {
                        this.showProductModal(response.data);
                    } else {
                        Message.error('获取菜品信息失败');
                    }
                } catch (error) {
                    console.error('获取菜品信息失败:', error);
                    Message.error('获取菜品信息失败');
                }
            }

            async toggleProductStatus(productId, currentStatus) {
                const newStatus = currentStatus === 'ACTIVE' ? 'INACTIVE' : 'ACTIVE';
                const action = newStatus === 'ACTIVE' ? '上架' : '下架';
                
                const confirmed = await Confirm.show({
                    title: `确认${action}`,
                    message: `确定要${action}这个菜品吗？`,
                    confirmText: action,
                    type: newStatus === 'ACTIVE' ? 'success' : 'warning'
                });
                
                if (!confirmed) return;
                
                try {
                    const response = await ApiService.product.updateStatus(productId, newStatus);
                    if (response.success) {
                        Message.success(`菜品${action}成功`);
                        await this.loadProducts();
                    } else {
                        Message.error(response.message || `${action}失败`);
                    }
                } catch (error) {
                    console.error(`${action}菜品失败:`, error);
                    Message.error(`${action}失败，请重试`);
                }
            }

            async updateStock(productId) {
                const product = this.products.find(p => p.id === productId);
                if (!product) return;
                
                const newStock = prompt(`请输入新的库存数量（当前: ${product.stock}）:`, product.stock);
                if (newStock === null || newStock === '') return;
                
                const stock = parseInt(newStock);
                if (isNaN(stock) || stock < 0) {
                    Message.error('请输入有效的库存数量');
                    return;
                }
                
                try {
                    const response = await ApiService.product.updateStock(productId, stock);
                    if (response.success) {
                        Message.success('库存更新成功');
                        await this.loadProducts();
                    } else {
                        Message.error(response.message || '库存更新失败');
                    }
                } catch (error) {
                    console.error('更新库存失败:', error);
                    Message.error('库存更新失败，请重试');
                }
            }

            async handleImageUpload(file) {
                if (!file) return;
                
                if (!file.type.startsWith('image/')) {
                    Message.error('请选择图片文件');
                    return;
                }
                
                if (file.size > 2 * 1024 * 1024) {
                    Message.error('图片大小不能超过2MB');
                    return;
                }
                
                try {
                    const previewUrl = await Utils.getImagePreviewUrl(file);
                    this.setImagePreview(previewUrl);
                    
                    // 这里可以立即上传图片或者在保存时一起上传
                    // 为了简化，我们先显示预览，实际上传在保存时进行
                } catch (error) {
                    console.error('图片处理失败:', error);
                    Message.error('图片处理失败');
                }
            }

            setImagePreview(url) {
                const upload = document.getElementById('imageUpload');
                upload.innerHTML = `<img src="${url}" alt="菜品图片" class="upload-preview">`;
                upload.classList.add('has-image');
            }

            resetImageUpload() {
                const upload = document.getElementById('imageUpload');
                upload.innerHTML = `
                    <div class="upload-placeholder">
                        <div style="font-size: 24px; margin-bottom: 8px;">📷</div>
                        <div>点击上传菜品图片</div>
                        <div style="font-size: 12px; margin-top: 4px; color: var(--text-secondary);">支持 JPG、PNG 格式，建议尺寸 400x300</div>
                    </div>
                `;
                upload.classList.remove('has-image');
            }

            validateForm() {
                const requiredFields = ['productName', 'productCategory', 'productPrice'];
                let isValid = true;
                
                requiredFields.forEach(fieldId => {
                    const field = document.getElementById(fieldId);
                    const value = field.value.trim();
                    
                    if (!value) {
                        field.style.borderColor = 'var(--danger-color)';
                        isValid = false;
                    } else {
                        field.style.borderColor = 'var(--border-color)';
                    }
                });
                
                if (!isValid) {
                    Message.error('请填写所有必填字段');
                }
                
                return isValid;
            }

            setLoading(loading) {
                this.isLoading = loading;
                const grid = document.getElementById('productsGrid');
                
                if (loading && this.products.length === 0) {
                    grid.innerHTML = `
                        <div class="loading-overlay show" style="position: relative; height: 200px; grid-column: 1 / -1;">
                            <div class="spinner"></div>
                        </div>
                    `;
                }
            }

            setModalLoading(loading) {
                const overlay = document.getElementById('modalLoading');
                if (loading) {
                    overlay.classList.add('show');
                } else {
                    overlay.classList.remove('show');
                }
            }
        }

        // 初始化
        let productManager;
        document.addEventListener('DOMContentLoaded', () => {
            productManager = new ProductManager();
        });
    </script>
</body>
</html>
