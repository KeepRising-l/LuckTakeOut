<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据统计 - 商家管理后台</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <style>
        .statistics-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .date-selector {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .date-input {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            padding: 24px;
            text-align: center;
            transition: all 0.2s;
        }

        .stat-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 16px;
        }

        .stat-icon.revenue {
            background: var(--success-light);
            color: var(--success-color);
        }

        .stat-icon.orders {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .stat-icon.customers {
            background: var(--info-light);
            color: var(--info-color);
        }

        .stat-icon.products {
            background: var(--warning-light);
            color: var(--warning-color);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin: 0 0 8px 0;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0 0 8px 0;
        }

        .stat-change {
            font-size: 12px;
            font-weight: 500;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .stat-change.positive {
            background: var(--success-light);
            color: var(--success-color);
        }

        .stat-change.negative {
            background: var(--danger-light);
            color: var(--danger-color);
        }

        .stat-change.neutral {
            background: var(--bg-light);
            color: var(--text-secondary);
        }

        .charts-section {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }

        .chart-card {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            padding: 24px;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .chart-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .chart-filter {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            background: var(--white);
            color: var(--text-secondary);
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .chart-placeholder {
            height: 300px;
            background: var(--bg-light);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .top-products {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            padding: 24px;
            margin-bottom: 32px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 20px 0;
        }

        .product-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .product-item {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--bg-light);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .product-item:hover {
            background: var(--border-light);
        }

        .product-rank {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary-color);
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            margin-right: 16px;
        }

        .product-rank.gold {
            background: #FFD700;
        }

        .product-rank.silver {
            background: #C0C0C0;
        }

        .product-rank.bronze {
            background: #CD7F32;
        }

        .product-info {
            flex: 1;
        }

        .product-name {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 4px 0;
        }

        .product-category {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .product-stats {
            text-align: right;
        }

        .product-sales {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0 0 4px 0;
        }

        .product-count {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .recent-orders {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            padding: 24px;
        }

        .order-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--bg-light);
            border-radius: 6px;
        }

        .order-info {
            flex: 1;
        }

        .order-number {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0 0 4px 0;
        }

        .order-time {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
        }

        .order-amount {
            font-size: 16px;
            font-weight: 600;
            color: var(--primary-color);
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .charts-section {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .statistics-container {
                padding: 16px;
            }

            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }

            .date-selector {
                justify-content: stretch;
            }

            .stats-overview {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
                gap: 16px;
            }

            .stat-card {
                padding: 20px;
            }

            .stat-value {
                font-size: 24px;
            }

            .chart-card {
                padding: 20px;
            }

            .chart-placeholder {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="statistics-container">
        <div class="page-header">
            <h1 class="page-title">数据统计</h1>
            <div class="date-selector">
                <input type="date" class="date-input" id="startDate">
                <span>至</span>
                <input type="date" class="date-input" id="endDate">
                <button class="btn btn-primary btn-sm" id="refreshBtn">刷新</button>
            </div>
        </div>

        <!-- 统计概览 -->
        <div class="stats-overview">
            <div class="stat-card">
                <div class="stat-icon revenue">💰</div>
                <div class="stat-value" id="totalRevenue">¥0</div>
                <div class="stat-label">总营业额</div>
                <div class="stat-change neutral" id="revenueChange">-</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon orders">📋</div>
                <div class="stat-value" id="totalOrders">0</div>
                <div class="stat-label">总订单数</div>
                <div class="stat-change neutral" id="ordersChange">-</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon customers">👥</div>
                <div class="stat-value" id="totalCustomers">0</div>
                <div class="stat-label">客户数量</div>
                <div class="stat-change neutral" id="customersChange">-</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon products">🍔</div>
                <div class="stat-value" id="avgOrderValue">¥0</div>
                <div class="stat-label">平均客单价</div>
                <div class="stat-change neutral" id="avgOrderChange">-</div>
            </div>
        </div>

        <!-- 图表区域 -->
        <div class="charts-section">
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">营业额趋势</h3>
                    <div class="chart-filter">
                        <button class="filter-btn active" data-period="7d">7天</button>
                        <button class="filter-btn" data-period="30d">30天</button>
                        <button class="filter-btn" data-period="90d">90天</button>
                    </div>
                </div>
                <div class="chart-placeholder" id="revenueChart">
                    📈 营业额趋势图
                </div>
            </div>
            
            <div class="chart-card">
                <div class="chart-header">
                    <h3 class="chart-title">订单状态分布</h3>
                </div>
                <div class="chart-placeholder" id="orderStatusChart">
                    🥧 订单状态饼图
                </div>
            </div>
        </div>

        <!-- 热销商品 -->
        <div class="top-products">
            <h3 class="section-title">热销商品 TOP 10</h3>
            <div class="product-list" id="topProductsList">
                <!-- 热销商品列表将在这里动态生成 -->
            </div>
        </div>

        <!-- 最近订单 -->
        <div class="recent-orders">
            <h3 class="section-title">最近订单</h3>
            <div class="order-list" id="recentOrdersList">
                <!-- 最近订单列表将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script>
        class StatisticsManager {
            constructor() {
                this.dateRange = {
                    startDate: '',
                    endDate: ''
                };
                this.chartPeriod = '7d';
                this.isLoading = false;
                
                this.init();
            }

            async init() {
                this.initDateRange();
                this.bindEvents();
                await this.loadStatistics();
            }

            initDateRange() {
                const today = new Date();
                const lastWeek = new Date(today);
                lastWeek.setDate(lastWeek.getDate() - 7);
                
                const startDate = lastWeek.toISOString().split('T')[0];
                const endDate = today.toISOString().split('T')[0];
                
                document.getElementById('startDate').value = startDate;
                document.getElementById('endDate').value = endDate;
                
                this.dateRange.startDate = startDate;
                this.dateRange.endDate = endDate;
            }

            bindEvents() {
                // 日期选择器
                document.getElementById('startDate').addEventListener('change', (e) => {
                    this.dateRange.startDate = e.target.value;
                });

                document.getElementById('endDate').addEventListener('change', (e) => {
                    this.dateRange.endDate = e.target.value;
                });

                // 刷新按钮
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    this.loadStatistics();
                });

                // 图表筛选按钮
                document.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.chartPeriod = e.target.dataset.period;
                        this.loadChartData();
                    });
                });
            }

            async loadStatistics() {
                if (this.isLoading) return;
                
                try {
                    this.setLoading(true);
                    
                    const params = {
                        startDate: this.dateRange.startDate,
                        endDate: this.dateRange.endDate
                    };
                    
                    // 并行加载所有数据
                    const [overviewResponse, topProductsResponse, recentOrdersResponse] = await Promise.all([
                        ApiService.statistics.getOverview(params),
                        ApiService.statistics.getTopProducts(params),
                        ApiService.statistics.getRecentOrders({ limit: 10 })
                    ]);
                    
                    if (overviewResponse.success) {
                        this.renderOverview(overviewResponse.data);
                    }
                    
                    if (topProductsResponse.success) {
                        this.renderTopProducts(topProductsResponse.data);
                    }
                    
                    if (recentOrdersResponse.success) {
                        this.renderRecentOrders(recentOrdersResponse.data);
                    }
                    
                    await this.loadChartData();
                    
                } catch (error) {
                    console.error('加载统计数据失败:', error);
                    Message.error('加载统计数据失败，请刷新页面重试');
                } finally {
                    this.setLoading(false);
                }
            }

            renderOverview(data) {
                // 总营业额
                document.getElementById('totalRevenue').textContent = Utils.formatMoney(data.totalRevenue || 0);
                this.renderChange('revenueChange', data.revenueChange);
                
                // 总订单数
                document.getElementById('totalOrders').textContent = data.totalOrders || 0;
                this.renderChange('ordersChange', data.ordersChange);
                
                // 客户数量
                document.getElementById('totalCustomers').textContent = data.totalCustomers || 0;
                this.renderChange('customersChange', data.customersChange);
                
                // 平均客单价
                document.getElementById('avgOrderValue').textContent = Utils.formatMoney(data.avgOrderValue || 0);
                this.renderChange('avgOrderChange', data.avgOrderChange);
            }

            renderChange(elementId, change) {
                const element = document.getElementById(elementId);
                
                if (!change || change.percentage === 0) {
                    element.textContent = '-';
                    element.className = 'stat-change neutral';
                    return;
                }
                
                const isPositive = change.percentage > 0;
                const prefix = isPositive ? '+' : '';
                
                element.textContent = `${prefix}${change.percentage.toFixed(1)}%`;
                element.className = `stat-change ${isPositive ? 'positive' : 'negative'}`;
            }

            renderTopProducts(products) {
                const list = document.getElementById('topProductsList');
                
                if (!products || products.length === 0) {
                    list.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            暂无数据
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = products.map((product, index) => {
                    const rankClass = index === 0 ? 'gold' : index === 1 ? 'silver' : index === 2 ? 'bronze' : '';
                    
                    return `
                        <div class="product-item">
                            <div class="product-rank ${rankClass}">${index + 1}</div>
                            <div class="product-info">
                                <div class="product-name">${product.name}</div>
                                <div class="product-category">${product.categoryName || '未分类'}</div>
                            </div>
                            <div class="product-stats">
                                <div class="product-sales">${Utils.formatMoney(product.totalSales)}</div>
                                <div class="product-count">销量: ${product.salesCount}</div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            renderRecentOrders(orders) {
                const list = document.getElementById('recentOrdersList');
                
                if (!orders || orders.length === 0) {
                    list.innerHTML = `
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            暂无订单
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = orders.map(order => `
                    <div class="order-item">
                        <div class="order-info">
                            <div class="order-number">${order.orderNumber}</div>
                            <div class="order-time">${Utils.formatDate(order.createTime, 'MM-DD HH:mm')}</div>
                        </div>
                        <div class="order-amount">${Utils.formatMoney(order.totalAmount)}</div>
                    </div>
                `).join('');
            }

            async loadChartData() {
                try {
                    const params = {
                        period: this.chartPeriod
                    };
                    
                    const [revenueResponse, statusResponse] = await Promise.all([
                        ApiService.statistics.getRevenueTrend(params),
                        ApiService.statistics.getOrderStatusDistribution(params)
                    ]);
                    
                    if (revenueResponse.success) {
                        this.renderRevenueChart(revenueResponse.data);
                    }
                    
                    if (statusResponse.success) {
                        this.renderOrderStatusChart(statusResponse.data);
                    }
                    
                } catch (error) {
                    console.error('加载图表数据失败:', error);
                }
            }

            renderRevenueChart(data) {
                const chart = document.getElementById('revenueChart');
                
                if (!data || data.length === 0) {
                    chart.innerHTML = '📈 暂无营业额数据';
                    return;
                }
                
                // 这里可以集成真实的图表库，如 Chart.js 或 ECharts
                // 目前显示模拟的图表信息
                const totalRevenue = data.reduce((sum, item) => sum + item.revenue, 0);
                const avgRevenue = totalRevenue / data.length;
                
                chart.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px;">
                        <div style="font-size: 24px; font-weight: 600; color: var(--primary-color); margin-bottom: 16px;">
                            ${Utils.formatMoney(totalRevenue)}
                        </div>
                        <div style="color: var(--text-secondary); margin-bottom: 8px;">
                            ${this.chartPeriod === '7d' ? '近7天' : this.chartPeriod === '30d' ? '近30天' : '近90天'}总营业额
                        </div>
                        <div style="color: var(--text-secondary); font-size: 14px;">
                            日均: ${Utils.formatMoney(avgRevenue)}
                        </div>
                    </div>
                `;
            }

            renderOrderStatusChart(data) {
                const chart = document.getElementById('orderStatusChart');
                
                if (!data || data.length === 0) {
                    chart.innerHTML = '🥧 暂无订单状态数据';
                    return;
                }
                
                const total = data.reduce((sum, item) => sum + item.count, 0);
                
                chart.innerHTML = `
                    <div style="padding: 20px;">
                        ${data.map(item => {
                            const percentage = total > 0 ? ((item.count / total) * 100).toFixed(1) : 0;
                            const statusText = this.getStatusText(item.status);
                            
                            return `
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding: 8px 12px; background: var(--bg-light); border-radius: 4px;">
                                    <span style="font-size: 14px; color: var(--text-primary);">${statusText}</span>
                                    <div style="text-align: right;">
                                        <div style="font-weight: 600; color: var(--primary-color);">${item.count}</div>
                                        <div style="font-size: 12px; color: var(--text-secondary);">${percentage}%</div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            getStatusText(status) {
                const statusMap = {
                    'PENDING': '待确认',
                    'CONFIRMED': '已确认',
                    'PREPARING': '制作中',
                    'READY': '待配送',
                    'DELIVERING': '配送中',
                    'COMPLETED': '已完成',
                    'CANCELLED': '已取消'
                };
                return statusMap[status] || status;
            }

            setLoading(loading) {
                this.isLoading = loading;
                // 可以在这里添加全局加载状态的显示
            }
        }

        // 初始化
        let statisticsManager;
        document.addEventListener('DOMContentLoaded', () => {
            statisticsManager = new StatisticsManager();
        });
    </script>
</body>
</html>
