<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺信息管理 - 商家管理后台</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <style>
        .shop-info-container {
            padding: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 8px 0;
        }

        .page-subtitle {
            color: var(--text-secondary);
            margin: 0;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 24px;
            margin-bottom: 24px;
        }

        .info-card {
            background: var(--white);
            border-radius: 8px;
            padding: 24px;
            box-shadow: var(--shadow-sm);
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .form-label.required::after {
            content: '*';
            color: var(--danger-color);
            margin-left: 4px;
        }

        .form-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
        }

        .form-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .avatar-upload {
            text-align: center;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 8px;
            border: 2px dashed var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            cursor: pointer;
            transition: border-color 0.3s;
            overflow: hidden;
            position: relative;
        }

        .avatar-preview:hover {
            border-color: var(--primary-color);
        }

        .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-placeholder {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
        }

        .upload-btn {
            background: var(--primary-color);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }

        .upload-btn:hover {
            background: var(--primary-dark);
        }

        .status-card {
            text-align: center;
        }

        .status-indicator {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            color: var(--white);
        }

        .status-open {
            background: var(--success-color);
        }

        .status-closed {
            background: var(--danger-color);
        }

        .status-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .status-desc {
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .status-toggle {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
            margin-bottom: 20px;
        }

        .status-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--border-color);
            transition: 0.4s;
            border-radius: 34px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: var(--white);
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: var(--success-color);
        }

        input:checked + .toggle-slider:before {
            transform: translateX(26px);
        }

        .announcement-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .announcement-input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-bottom: 12px;
            min-height: 60px;
            resize: vertical;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--bg-light);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 8px;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            transition: width 0.3s;
            width: 0%;
        }

        @media (max-width: 768px) {
            .info-grid {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .shop-info-container {
                padding: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="shop-info-container">
        <div class="page-header">
            <h1 class="page-title">店铺信息管理</h1>
            <p class="page-subtitle">管理您的店铺基本信息和营业状态</p>
        </div>

        <div class="info-grid">
            <!-- 基本信息 -->
            <div class="info-card">
                <h2 class="card-title">基本信息</h2>
                <form id="shopInfoForm">
                    <div class="form-group">
                        <label class="form-label required">店铺名称</label>
                        <input type="text" class="form-input" id="shopName" name="shopName" placeholder="请输入店铺名称" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label required">联系电话</label>
                        <input type="tel" class="form-input" id="phone" name="phone" placeholder="请输入联系电话" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label required">店铺地址</label>
                        <input type="text" class="form-input" id="address" name="address" placeholder="请输入详细地址" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">起送金额 (元)</label>
                            <input type="number" class="form-input" id="minOrderAmount" name="minOrderAmount" placeholder="0" min="0" step="0.01">
                        </div>
                        <div class="form-group">
                            <label class="form-label">配送费 (元)</label>
                            <input type="number" class="form-input" id="deliveryFee" name="deliveryFee" placeholder="0" min="0" step="0.01">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label">营业开始时间</label>
                            <input type="time" class="form-input" id="openTime" name="openTime">
                        </div>
                        <div class="form-group">
                            <label class="form-label">营业结束时间</label>
                            <input type="time" class="form-input" id="closeTime" name="closeTime">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">配送范围 (公里)</label>
                        <input type="number" class="form-input" id="deliveryRange" name="deliveryRange" placeholder="3" min="0" step="0.1">
                    </div>

                    <div class="form-group">
                        <label class="form-label">店铺描述</label>
                        <textarea class="form-input form-textarea" id="description" name="description" placeholder="请输入店铺描述"></textarea>
                    </div>
                </form>
            </div>

            <!-- 店铺头像和状态 -->
            <div>
                <!-- 头像上传 -->
                <div class="info-card">
                    <h2 class="card-title">店铺头像</h2>
                    <div class="avatar-upload">
                        <div class="avatar-preview" id="avatarPreview">
                            <div class="avatar-placeholder">
                                <div>点击上传头像</div>
                                <div style="font-size: 12px; margin-top: 4px;">支持 JPG、PNG 格式</div>
                            </div>
                        </div>
                        <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                        <button type="button" class="upload-btn" onclick="document.getElementById('avatarInput').click()">选择图片</button>
                        <div class="progress-bar" id="uploadProgress">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                    </div>
                </div>

                <!-- 营业状态 -->
                <div class="info-card status-card">
                    <h2 class="card-title">营业状态</h2>
                    <div class="status-indicator" id="statusIndicator">
                        营业中
                    </div>
                    <div class="status-text" id="statusText">营业中</div>
                    <div class="status-desc" id="statusDesc">店铺正在正常营业</div>
                    
                    <label class="status-toggle">
                        <input type="checkbox" id="statusToggle" checked>
                        <span class="toggle-slider"></span>
                    </label>

                    <div class="announcement-section">
                        <label class="form-label">店铺公告</label>
                        <textarea class="announcement-input" id="announcement" placeholder="输入店铺公告，向顾客传达重要信息"></textarea>
                        <button type="button" class="btn btn-outline btn-sm" id="saveAnnouncementBtn">保存公告</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="btn-group">
            <button type="button" class="btn btn-outline" id="resetBtn">重置</button>
            <button type="button" class="btn btn-primary" id="saveBtn">保存信息</button>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script>
        class ShopInfoManager {
            constructor() {
                this.form = document.getElementById('shopInfoForm');
                this.statusToggle = document.getElementById('statusToggle');
                this.avatarInput = document.getElementById('avatarInput');
                this.avatarPreview = document.getElementById('avatarPreview');
                this.uploadProgress = document.getElementById('uploadProgress');
                this.progressFill = document.getElementById('progressFill');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.statusDesc = document.getElementById('statusDesc');
                this.announcement = document.getElementById('announcement');
                
                this.merchantInfo = null;
                this.isLoading = false;
                
                this.init();
            }

            async init() {
                this.bindEvents();
                await this.loadMerchantInfo();
            }

            bindEvents() {
                // 保存按钮
                document.getElementById('saveBtn').addEventListener('click', () => {
                    this.saveMerchantInfo();
                });

                // 重置按钮
                document.getElementById('resetBtn').addEventListener('click', () => {
                    this.resetForm();
                });

                // 营业状态切换
                this.statusToggle.addEventListener('change', () => {
                    this.toggleBusinessStatus();
                });

                // 头像上传
                this.avatarInput.addEventListener('change', (e) => {
                    this.handleAvatarUpload(e.target.files[0]);
                });

                // 头像预览点击
                this.avatarPreview.addEventListener('click', () => {
                    this.avatarInput.click();
                });

                // 保存公告
                document.getElementById('saveAnnouncementBtn').addEventListener('click', () => {
                    this.saveAnnouncement();
                });

                // 表单验证
                this.form.addEventListener('input', Utils.debounce(() => {
                    this.validateForm();
                }, 300));
            }

            async loadMerchantInfo() {
                try {
                    this.setLoading(true);
                    const response = await ApiService.merchant.getCurrentInfo();
                    
                    if (response.success) {
                        this.merchantInfo = response.data;
                        this.populateForm(this.merchantInfo);
                        this.updateStatusDisplay(this.merchantInfo.status);
                    } else {
                        Message.error(response.message || '获取店铺信息失败');
                    }
                } catch (error) {
                    console.error('加载店铺信息失败:', error);
                    Message.error('加载店铺信息失败，请刷新页面重试');
                } finally {
                    this.setLoading(false);
                }
            }

            populateForm(data) {
                // 填充表单数据
                document.getElementById('shopName').value = data.name || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('address').value = data.address || '';
                document.getElementById('minOrderAmount').value = data.minOrderAmount || '';
                document.getElementById('deliveryFee').value = data.deliveryFee || '';
                document.getElementById('openTime').value = data.openTime || '';
                document.getElementById('closeTime').value = data.closeTime || '';
                document.getElementById('deliveryRange').value = data.deliveryRange || '';
                document.getElementById('description').value = data.description || '';
                this.announcement.value = data.announcement || '';

                // 设置头像
                if (data.avatar) {
                    this.setAvatarPreview(data.avatar);
                }

                // 设置营业状态
                this.statusToggle.checked = data.status === 'OPEN';
            }

            async saveMerchantInfo() {
                if (!this.validateForm()) {
                    return;
                }

                try {
                    this.setLoading(true);
                    
                    const formData = new FormData(this.form);
                    const data = Object.fromEntries(formData.entries());
                    
                    // 转换数值类型
                    if (data.minOrderAmount) data.minOrderAmount = parseFloat(data.minOrderAmount);
                    if (data.deliveryFee) data.deliveryFee = parseFloat(data.deliveryFee);
                    if (data.deliveryRange) data.deliveryRange = parseFloat(data.deliveryRange);

                    const response = await ApiService.merchant.updateInfo(data);
                    
                    if (response.success) {
                        Message.success('店铺信息保存成功');
                        this.merchantInfo = { ...this.merchantInfo, ...data };
                    } else {
                        Message.error(response.message || '保存失败');
                    }
                } catch (error) {
                    console.error('保存店铺信息失败:', error);
                    Message.error('保存失败，请重试');
                } finally {
                    this.setLoading(false);
                }
            }

            async toggleBusinessStatus() {
                const newStatus = this.statusToggle.checked ? 'OPEN' : 'CLOSED';
                
                try {
                    const response = await ApiService.merchant.updateStatus(newStatus);
                    
                    if (response.success) {
                        this.updateStatusDisplay(newStatus);
                        Message.success(`店铺已${newStatus === 'OPEN' ? '开启' : '关闭'}营业`);
                    } else {
                        // 恢复开关状态
                        this.statusToggle.checked = !this.statusToggle.checked;
                        Message.error(response.message || '状态更新失败');
                    }
                } catch (error) {
                    console.error('更新营业状态失败:', error);
                    this.statusToggle.checked = !this.statusToggle.checked;
                    Message.error('状态更新失败，请重试');
                }
            }

            updateStatusDisplay(status) {
                const isOpen = status === 'OPEN';
                
                this.statusIndicator.className = `status-indicator ${isOpen ? 'status-open' : 'status-closed'}`;
                this.statusIndicator.textContent = isOpen ? '营业中' : '已打烊';
                this.statusText.textContent = isOpen ? '营业中' : '已打烊';
                this.statusDesc.textContent = isOpen ? '店铺正在正常营业' : '店铺暂停营业';
            }

            async handleAvatarUpload(file) {
                if (!file) return;

                // 验证文件类型
                if (!file.type.startsWith('image/')) {
                    Message.error('请选择图片文件');
                    return;
                }

                // 验证文件大小 (2MB)
                if (file.size > 2 * 1024 * 1024) {
                    Message.error('图片大小不能超过2MB');
                    return;
                }

                try {
                    // 显示预览
                    const previewUrl = await Utils.getImagePreviewUrl(file);
                    this.setAvatarPreview(previewUrl);

                    // 显示进度条
                    this.uploadProgress.style.display = 'block';
                    
                    // 上传文件
                    const response = await ApiService.merchant.uploadAvatar(file, (progress) => {
                        this.progressFill.style.width = `${progress}%`;
                    });

                    if (response.success) {
                        Message.success('头像上传成功');
                        this.merchantInfo.avatar = response.data.url;
                    } else {
                        Message.error(response.message || '头像上传失败');
                        this.resetAvatarPreview();
                    }
                } catch (error) {
                    console.error('头像上传失败:', error);
                    Message.error('头像上传失败，请重试');
                    this.resetAvatarPreview();
                } finally {
                    // 隐藏进度条
                    setTimeout(() => {
                        this.uploadProgress.style.display = 'none';
                        this.progressFill.style.width = '0%';
                    }, 1000);
                }
            }

            setAvatarPreview(url) {
                this.avatarPreview.innerHTML = `<img src="${url}" alt="店铺头像">`;
            }

            resetAvatarPreview() {
                this.avatarPreview.innerHTML = `
                    <div class="avatar-placeholder">
                        <div>点击上传头像</div>
                        <div style="font-size: 12px; margin-top: 4px;">支持 JPG、PNG 格式</div>
                    </div>
                `;
            }

            async saveAnnouncement() {
                const announcement = this.announcement.value.trim();
                
                try {
                    const response = await ApiService.merchant.updateInfo({ announcement });
                    
                    if (response.success) {
                        Message.success('公告保存成功');
                    } else {
                        Message.error(response.message || '公告保存失败');
                    }
                } catch (error) {
                    console.error('保存公告失败:', error);
                    Message.error('公告保存失败，请重试');
                }
            }

            validateForm() {
                const requiredFields = ['shopName', 'phone', 'address'];
                let isValid = true;

                requiredFields.forEach(fieldId => {
                    const field = document.getElementById(fieldId);
                    const value = field.value.trim();
                    
                    if (!value) {
                        field.style.borderColor = 'var(--danger-color)';
                        isValid = false;
                    } else {
                        field.style.borderColor = 'var(--border-color)';
                    }
                });

                // 验证手机号
                const phone = document.getElementById('phone').value.trim();
                if (phone && !Utils.validatePhone(phone)) {
                    document.getElementById('phone').style.borderColor = 'var(--danger-color)';
                    isValid = false;
                }

                return isValid;
            }

            resetForm() {
                if (this.merchantInfo) {
                    this.populateForm(this.merchantInfo);
                    Message.info('表单已重置');
                }
            }

            setLoading(loading) {
                this.isLoading = loading;
                const container = document.querySelector('.shop-info-container');
                
                if (loading) {
                    container.classList.add('loading');
                } else {
                    container.classList.remove('loading');
                }
            }
        }

        // 初始化页面
        document.addEventListener('DOMContentLoaded', () => {
            new ShopInfoManager();
        });
    </script>
</body>
</html>
