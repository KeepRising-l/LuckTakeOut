<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单管理 - 商家管理后台</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/layout.css">
    <style>
        .orders-container {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .header-stats {
            display: flex;
            gap: 24px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 4px 0 0 0;
        }

        .filters {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-label {
            font-size: 14px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .filter-select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            min-width: 120px;
        }

        .date-range {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-input {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
        }

        .orders-list {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .order-item {
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            transition: background-color 0.2s;
        }

        .order-item:hover {
            background: var(--bg-light);
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .order-info {
            flex: 1;
        }

        .order-number {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 4px 0;
        }

        .order-time {
            font-size: 14px;
            color: var(--text-secondary);
            margin: 0;
        }

        .order-status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
            text-align: center;
            min-width: 80px;
        }

        .status-pending {
            background: var(--warning-light);
            color: var(--warning-color);
        }

        .status-confirmed {
            background: var(--info-light);
            color: var(--info-color);
        }

        .status-preparing {
            background: var(--primary-light);
            color: var(--primary-color);
        }

        .status-ready {
            background: var(--success-light);
            color: var(--success-color);
        }

        .status-delivering {
            background: var(--info-light);
            color: var(--info-color);
        }

        .status-completed {
            background: var(--success-light);
            color: var(--success-color);
        }

        .status-cancelled {
            background: var(--danger-light);
            color: var(--danger-color);
        }

        .order-content {
            display: grid;
            grid-template-columns: 1fr 200px 150px;
            gap: 20px;
            align-items: start;
        }

        .order-items {
            flex: 1;
        }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-light);
        }

        .item-row:last-child {
            border-bottom: none;
        }

        .item-name {
            font-size: 14px;
            color: var(--text-primary);
        }

        .item-quantity {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .item-price {
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .order-customer {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .customer-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .order-total {
            text-align: right;
        }

        .total-amount {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin: 0 0 8px 0;
        }

        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
            justify-content: flex-end;
        }

        .action-btn {
            padding: 6px 16px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--white);
            color: var(--text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: var(--bg-light);
        }

        .action-btn.primary {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .action-btn.primary:hover {
            background: var(--primary-dark);
        }

        .action-btn.success {
            background: var(--success-color);
            color: var(--white);
            border-color: var(--success-color);
        }

        .action-btn.success:hover {
            background: var(--success-dark);
        }

        .action-btn.danger {
            background: var(--danger-color);
            color: var(--white);
            border-color: var(--danger-color);
        }

        .action-btn.danger:hover {
            background: var(--danger-dark);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: var(--white);
            color: var(--text-primary);
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover {
            background: var(--bg-light);
        }

        .page-btn.active {
            background: var(--primary-color);
            color: var(--white);
            border-color: var(--primary-color);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 订单详情模态框 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            max-width: 800px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-body {
            padding: 24px;
        }

        .detail-section {
            margin-bottom: 24px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0 0 12px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }

        .detail-label {
            color: var(--text-secondary);
            font-size: 14px;
        }

        .detail-value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .loading-overlay.show {
            display: flex;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .orders-container {
                padding: 16px;
            }

            .page-header {
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }

            .header-stats {
                justify-content: space-around;
            }

            .filters {
                flex-direction: column;
                gap: 12px;
            }

            .order-content {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .order-actions {
                justify-content: stretch;
            }

            .action-btn {
                flex: 1;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="orders-container">
        <div class="page-header">
            <h1 class="page-title">订单管理</h1>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-number" id="pendingCount">0</div>
                    <div class="stat-label">待处理</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="preparingCount">0</div>
                    <div class="stat-label">制作中</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="todayCount">0</div>
                    <div class="stat-label">今日订单</div>
                </div>
            </div>
        </div>

        <div class="filters">
            <div class="filter-group">
                <span class="filter-label">订单状态:</span>
                <select class="filter-select" id="statusFilter">
                    <option value="">全部状态</option>
                    <option value="PENDING">待确认</option>
                    <option value="CONFIRMED">已确认</option>
                    <option value="PREPARING">制作中</option>
                    <option value="READY">待配送</option>
                    <option value="DELIVERING">配送中</option>
                    <option value="COMPLETED">已完成</option>
                    <option value="CANCELLED">已取消</option>
                </select>
            </div>
            <div class="filter-group">
                <span class="filter-label">时间范围:</span>
                <div class="date-range">
                    <input type="date" class="date-input" id="startDate">
                    <span>至</span>
                    <input type="date" class="date-input" id="endDate">
                </div>
            </div>
            <div class="filter-group">
                <button class="btn btn-outline btn-sm" id="refreshBtn">刷新</button>
            </div>
        </div>

        <div class="orders-list" id="ordersList">
            <!-- 订单列表将在这里动态生成 -->
        </div>

        <div class="pagination" id="pagination">
            <!-- 分页将在这里动态生成 -->
        </div>
    </div>

    <!-- 订单详情模态框 -->
    <div class="modal" id="orderDetailModal">
        <div class="modal-content">
            <div class="loading-overlay" id="modalLoading">
                <div class="spinner"></div>
            </div>
            
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">订单详情</h2>
                <button class="close-btn" id="closeModalBtn">×</button>
            </div>
            
            <div class="modal-body" id="modalBody">
                <!-- 订单详情内容将在这里动态生成 -->
            </div>
        </div>
    </div>

    <script src="../js/utils.js"></script>
    <script>
        class OrderManager {
            constructor() {
                this.orders = [];
                this.currentPage = 1;
                this.pageSize = 10;
                this.totalPages = 0;
                this.filters = {
                    status: '',
                    startDate: '',
                    endDate: ''
                };
                this.stats = {
                    pending: 0,
                    preparing: 0,
                    today: 0
                };
                this.isLoading = false;
                this.autoRefreshInterval = null;
                
                this.init();
            }

            async init() {
                this.bindEvents();
                this.initDateFilters();
                await this.loadOrders();
                this.startAutoRefresh();
            }

            bindEvents() {
                // 筛选器
                document.getElementById('statusFilter').addEventListener('change', (e) => {
                    this.filters.status = e.target.value;
                    this.currentPage = 1;
                    this.loadOrders();
                });

                document.getElementById('startDate').addEventListener('change', (e) => {
                    this.filters.startDate = e.target.value;
                    this.currentPage = 1;
                    this.loadOrders();
                });

                document.getElementById('endDate').addEventListener('change', (e) => {
                    this.filters.endDate = e.target.value;
                    this.currentPage = 1;
                    this.loadOrders();
                });

                // 刷新按钮
                document.getElementById('refreshBtn').addEventListener('click', () => {
                    this.loadOrders();
                });

                // 模态框关闭
                document.getElementById('closeModalBtn').addEventListener('click', () => {
                    this.hideOrderDetail();
                });

                document.getElementById('orderDetailModal').addEventListener('click', (e) => {
                    if (e.target.id === 'orderDetailModal') {
                        this.hideOrderDetail();
                    }
                });

                // 页面可见性变化时的处理
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.stopAutoRefresh();
                    } else {
                        this.startAutoRefresh();
                        this.loadOrders(); // 页面重新可见时刷新数据
                    }
                });
            }

            initDateFilters() {
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                
                document.getElementById('startDate').value = yesterday.toISOString().split('T')[0];
                document.getElementById('endDate').value = today.toISOString().split('T')[0];
                
                this.filters.startDate = yesterday.toISOString().split('T')[0];
                this.filters.endDate = today.toISOString().split('T')[0];
            }

            async loadOrders() {
                if (this.isLoading) return;
                
                try {
                    this.setLoading(true);
                    
                    const params = {
                        page: this.currentPage,
                        size: this.pageSize,
                        ...this.filters
                    };
                    
                    // 移除空值
                    Object.keys(params).forEach(key => {
                        if (!params[key]) delete params[key];
                    });
                    
                    const response = await ApiService.order.getList(params);
                    
                    if (response.success) {
                        this.orders = response.data.items || [];
                        this.totalPages = response.data.totalPages || 0;
                        this.stats = response.data.stats || this.stats;
                        
                        this.renderOrders();
                        this.renderPagination();
                        this.updateStats();
                    } else {
                        Message.error(response.message || '加载订单失败');
                    }
                } catch (error) {
                    console.error('加载订单失败:', error);
                    Message.error('加载订单失败，请刷新页面重试');
                } finally {
                    this.setLoading(false);
                }
            }

            renderOrders() {
                const list = document.getElementById('ordersList');
                
                if (this.orders.length === 0) {
                    list.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">📋</div>
                            <div>暂无订单</div>
                            <div style="margin-top: 8px; font-size: 14px;">当前筛选条件下没有找到订单</div>
                        </div>
                    `;
                    return;
                }
                
                list.innerHTML = this.orders.map(order => this.renderOrderItem(order)).join('');
            }

            renderOrderItem(order) {
                const statusConfig = this.getStatusConfig(order.status);
                const orderTime = Utils.formatDate(order.createTime, 'MM-DD HH:mm');
                
                return `
                    <div class="order-item">
                        <div class="order-header">
                            <div class="order-info">
                                <h3 class="order-number">订单号: ${order.orderNumber}</h3>
                                <p class="order-time">${orderTime}</p>
                            </div>
                            <span class="order-status ${statusConfig.class}">${statusConfig.text}</span>
                        </div>
                        
                        <div class="order-content">
                            <div class="order-items">
                                ${order.items.map(item => `
                                    <div class="item-row">
                                        <span class="item-name">${item.productName}</span>
                                        <span class="item-quantity">×${item.quantity}</span>
                                        <span class="item-price">${Utils.formatMoney(item.price * item.quantity)}</span>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <div class="order-customer">
                                <div class="customer-name">${order.customerName}</div>
                                <div>${order.customerPhone}</div>
                                <div>${order.deliveryAddress}</div>
                            </div>
                            
                            <div class="order-total">
                                <div class="total-amount">${Utils.formatMoney(order.totalAmount)}</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">
                                    ${order.paymentMethod === 'ONLINE' ? '在线支付' : '货到付款'}
                                </div>
                            </div>
                        </div>
                        
                        <div class="order-actions">
                            <button class="action-btn" onclick="orderManager.showOrderDetail(${order.id})">详情</button>
                            ${this.renderOrderActions(order)}
                        </div>
                    </div>
                `;
            }

            renderOrderActions(order) {
                const actions = [];
                
                switch (order.status) {
                    case 'PENDING':
                        actions.push(`<button class="action-btn success" onclick="orderManager.confirmOrder(${order.id})">接单</button>`);
                        actions.push(`<button class="action-btn danger" onclick="orderManager.rejectOrder(${order.id})">拒单</button>`);
                        break;
                    case 'CONFIRMED':
                        actions.push(`<button class="action-btn primary" onclick="orderManager.startPreparing(${order.id})">开始制作</button>`);
                        break;
                    case 'PREPARING':
                        actions.push(`<button class="action-btn success" onclick="orderManager.markReady(${order.id})">制作完成</button>`);
                        break;
                    case 'READY':
                        actions.push(`<button class="action-btn primary" onclick="orderManager.startDelivery(${order.id})">开始配送</button>`);
                        break;
                    case 'DELIVERING':
                        actions.push(`<button class="action-btn success" onclick="orderManager.completeOrder(${order.id})">完成订单</button>`);
                        break;
                }
                
                return actions.join('');
            }

            getStatusConfig(status) {
                const configs = {
                    'PENDING': { class: 'status-pending', text: '待确认' },
                    'CONFIRMED': { class: 'status-confirmed', text: '已确认' },
                    'PREPARING': { class: 'status-preparing', text: '制作中' },
                    'READY': { class: 'status-ready', text: '待配送' },
                    'DELIVERING': { class: 'status-delivering', text: '配送中' },
                    'COMPLETED': { class: 'status-completed', text: '已完成' },
                    'CANCELLED': { class: 'status-cancelled', text: '已取消' }
                };
                return configs[status] || { class: 'status-pending', text: '未知' };
            }

            updateStats() {
                document.getElementById('pendingCount').textContent = this.stats.pending || 0;
                document.getElementById('preparingCount').textContent = this.stats.preparing || 0;
                document.getElementById('todayCount').textContent = this.stats.today || 0;
            }

            renderPagination() {
                const pagination = document.getElementById('pagination');
                
                if (this.totalPages <= 1) {
                    pagination.innerHTML = '';
                    return;
                }
                
                let html = '';
                
                // 上一页
                html += `<button class="page-btn" ${this.currentPage === 1 ? 'disabled' : ''} 
                                onclick="orderManager.goToPage(${this.currentPage - 1})">上一页</button>`;
                
                // 页码
                const startPage = Math.max(1, this.currentPage - 2);
                const endPage = Math.min(this.totalPages, this.currentPage + 2);
                
                if (startPage > 1) {
                    html += `<button class="page-btn" onclick="orderManager.goToPage(1)">1</button>`;
                    if (startPage > 2) {
                        html += `<span style="padding: 8px;">...</span>`;
                    }
                }
                
                for (let i = startPage; i <= endPage; i++) {
                    html += `<button class="page-btn ${i === this.currentPage ? 'active' : ''}" 
                                    onclick="orderManager.goToPage(${i})">${i}</button>`;
                }
                
                if (endPage < this.totalPages) {
                    if (endPage < this.totalPages - 1) {
                        html += `<span style="padding: 8px;">...</span>`;
                    }
                    html += `<button class="page-btn" onclick="orderManager.goToPage(${this.totalPages})">${this.totalPages}</button>`;
                }
                
                // 下一页
                html += `<button class="page-btn" ${this.currentPage === this.totalPages ? 'disabled' : ''} 
                                onclick="orderManager.goToPage(${this.currentPage + 1})">下一页</button>`;
                
                pagination.innerHTML = html;
            }

            goToPage(page) {
                if (page < 1 || page > this.totalPages || page === this.currentPage) return;
                this.currentPage = page;
                this.loadOrders();
            }

            async showOrderDetail(orderId) {
                try {
                    this.setModalLoading(true);
                    const modal = document.getElementById('orderDetailModal');
                    modal.classList.add('show');
                    
                    const response = await ApiService.order.getDetail(orderId);
                    
                    if (response.success) {
                        this.renderOrderDetail(response.data);
                    } else {
                        Message.error('获取订单详情失败');
                        this.hideOrderDetail();
                    }
                } catch (error) {
                    console.error('获取订单详情失败:', error);
                    Message.error('获取订单详情失败');
                    this.hideOrderDetail();
                } finally {
                    this.setModalLoading(false);
                }
            }

            renderOrderDetail(order) {
                const statusConfig = this.getStatusConfig(order.status);
                const modalBody = document.getElementById('modalBody');
                
                modalBody.innerHTML = `
                    <div class="detail-section">
                        <h3 class="section-title">订单信息</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <span class="detail-label">订单号:</span>
                                <span class="detail-value">${order.orderNumber}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">订单状态:</span>
                                <span class="detail-value">
                                    <span class="order-status ${statusConfig.class}">${statusConfig.text}</span>
                                </span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">下单时间:</span>
                                <span class="detail-value">${Utils.formatDate(order.createTime)}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">支付方式:</span>
                                <span class="detail-value">${order.paymentMethod === 'ONLINE' ? '在线支付' : '货到付款'}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h3 class="section-title">顾客信息</h3>
                        <div class="detail-grid">
                            <div class="detail-item">
                                <span class="detail-label">姓名:</span>
                                <span class="detail-value">${order.customerName}</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">电话:</span>
                                <span class="detail-value">${order.customerPhone}</span>
                            </div>
                            <div class="detail-item" style="grid-column: 1 / -1;">
                                <span class="detail-label">配送地址:</span>
                                <span class="detail-value">${order.deliveryAddress}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="detail-section">
                        <h3 class="section-title">订单商品</h3>
                        <div class="order-items">
                            ${order.items.map(item => `
                                <div class="item-row">
                                    <span class="item-name">${item.productName}</span>
                                    <span class="item-quantity">×${item.quantity}</span>
                                    <span class="item-price">${Utils.formatMoney(item.price * item.quantity)}</span>
                                </div>
                            `).join('')}
                            <div class="item-row" style="border-top: 2px solid var(--border-color); margin-top: 12px; padding-top: 12px; font-weight: 600;">
                                <span class="item-name">总计</span>
                                <span></span>
                                <span class="item-price" style="color: var(--primary-color); font-size: 16px;">${Utils.formatMoney(order.totalAmount)}</span>
                            </div>
                        </div>
                    </div>
                    
                    ${order.remark ? `
                        <div class="detail-section">
                            <h3 class="section-title">备注信息</h3>
                            <div class="detail-value">${order.remark}</div>
                        </div>
                    ` : ''}
                `;
            }

            hideOrderDetail() {
                const modal = document.getElementById('orderDetailModal');
                modal.classList.remove('show');
            }

            async confirmOrder(orderId) {
                const confirmed = await Confirm.show({
                    title: '确认接单',
                    message: '确定要接受这个订单吗？',
                    confirmText: '接单',
                    type: 'success'
                });
                
                if (!confirmed) return;
                
                await this.updateOrderStatus(orderId, 'CONFIRMED', '接单');
            }

            async rejectOrder(orderId) {
                const reason = prompt('请输入拒单原因:');
                if (!reason) return;
                
                try {
                    const response = await ApiService.order.cancel(orderId, reason);
                    if (response.success) {
                        Message.success('订单已拒绝');
                        await this.loadOrders();
                    } else {
                        Message.error(response.message || '拒单失败');
                    }
                } catch (error) {
                    console.error('拒单失败:', error);
                    Message.error('拒单失败，请重试');
                }
            }

            async startPreparing(orderId) {
                await this.updateOrderStatus(orderId, 'PREPARING', '开始制作');
            }

            async markReady(orderId) {
                await this.updateOrderStatus(orderId, 'READY', '制作完成');
            }

            async startDelivery(orderId) {
                await this.updateOrderStatus(orderId, 'DELIVERING', '开始配送');
            }

            async completeOrder(orderId) {
                await this.updateOrderStatus(orderId, 'COMPLETED', '完成订单');
            }

            async updateOrderStatus(orderId, status, action) {
                try {
                    const response = await ApiService.order.updateStatus(orderId, status);
                    if (response.success) {
                        Message.success(`${action}成功`);
                        await this.loadOrders();
                    } else {
                        Message.error(response.message || `${action}失败`);
                    }
                } catch (error) {
                    console.error(`${action}失败:`, error);
                    Message.error(`${action}失败，请重试`);
                }
            }

            startAutoRefresh() {
                this.stopAutoRefresh();
                // 每30秒自动刷新一次
                this.autoRefreshInterval = setInterval(() => {
                    if (!document.hidden) {
                        this.loadOrders();
                    }
                }, 30000);
            }

            stopAutoRefresh() {
                if (this.autoRefreshInterval) {
                    clearInterval(this.autoRefreshInterval);
                    this.autoRefreshInterval = null;
                }
            }

            setLoading(loading) {
                this.isLoading = loading;
                const list = document.getElementById('ordersList');
                
                if (loading && this.orders.length === 0) {
                    list.innerHTML = `
                        <div class="loading-overlay show" style="position: relative; height: 200px;">
                            <div class="spinner"></div>
                        </div>
                    `;
                }
            }

            setModalLoading(loading) {
                const overlay = document.getElementById('modalLoading');
                if (loading) {
                    overlay.classList.add('show');
                } else {
                    overlay.classList.remove('show');
                }
            }
        }

        // 初始化
        let orderManager;
        document.addEventListener('DOMContentLoaded', () => {
            orderManager = new OrderManager();
        });

        // 页面卸载时清理定时器
        window.addEventListener('beforeunload', () => {
            if (orderManager) {
                orderManager.stopAutoRefresh();
            }
        });
    </script>
</body>
</html>
