<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background-color: var(--canvas);
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 84px;
        }

        /* 顶部：居中标题 + 圆形图标按钮 */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--canvas);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 12px 16px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            display: grid;
            place-items: center;
            color: var(--ink);
            flex: none;
            border: none;
            transition: background-color var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:active { background: var(--surface-3); }

        .header-title {
            flex: 1;
            text-align: center;
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-spacer { width: 36px; height: 36px; flex: none; }

        /* 用户信息 */
        .profile-hero {
            padding: 26px 20px 22px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
            min-width: 0;
            cursor: pointer;
        }

        .user-avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            overflow: hidden;
            color: var(--muted);
            font-size: 24px;
            font-weight: 600;
        }

        .user-avatar svg { width: 30px; height: 30px; }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-details { flex: 1; min-width: 0; }

        .user-name {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.6px;
            line-height: 1.2;
            color: var(--ink);
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .user-phone {
            font-size: 13px;
            color: var(--muted);
        }

        .user-level {
            display: inline-block;
            margin-top: 9px;
            padding: 3px 11px;
            background: var(--meeting);
            color: var(--meeting-ink);
            border-radius: 999px;
            font-size: 13px;
            font-weight: 500;
        }

        /* 统计信息 */
        .stats-group {
            background: var(--surface);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            display: flex;
        }

        .stat-item {
            flex: 1;
            padding: 16px 6px;
            text-align: center;
            cursor: pointer;
            transition: background-color var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .stat-item:active { background: var(--surface-2); }

        .stat-item + .stat-item { border-left: 1px solid var(--line); }

        .stat-number {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            margin-bottom: 3px;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 13px;
            color: var(--muted);
        }

        /* 分组标签 */
        .group-label {
            padding: 20px 20px 8px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
        }

        /* 分组列表（整块白面 + 1px 分隔线） */
        .menu-section {
            background: var(--surface);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 20px;
            cursor: pointer;
            transition: background-color var(--transition-base);
            text-decoration: none;
            color: inherit;
            -webkit-tap-highlight-color: transparent;
        }

        .menu-item:active { background: var(--surface-2); }

        .menu-item + .menu-item { border-top: 1px solid var(--line); }

        .menu-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--ink);
        }

        .menu-icon svg {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .menu-content {
            flex: 1;
            min-width: 0;
        }

        .menu-name {
            font-size: 15px;
            font-weight: 550;
            color: var(--ink);
            margin-bottom: 2px;
        }

        .menu-desc {
            font-size: 13px;
            color: var(--muted);
        }

        .menu-badge {
            background: var(--deadline);
            color: #fff;
            border-radius: 999px;
            padding: 1px 7px;
            font-size: 11px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .menu-arrow {
            width: 16px;
            height: 16px;
            flex: none;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .menu-arrow svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 退出登录 */
        .logout-section {
            margin-top: 20px;
        }

        .logout-btn {
            width: 100%;
            padding: 16px;
            background: var(--surface);
            color: var(--deadline);
            border: none;
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            font-size: 15px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .logout-btn:active { background: var(--surface-2); }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            height: 72px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            cursor: pointer;
            padding: 7px 2px;
            border-radius: 22px;
            transition: all var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--ink);
            background: var(--surface-3);
            font-weight: 550;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-text {
            font-size: 11px;
            font-weight: 500;
        }

        .cart-badge {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--deadline);
            color: white;
            border-radius: 999px;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: 600;
            min-width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
        }

        /* 地址管理弹窗 */
        .address-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(42, 53, 60, 0.42);
            display: flex;
            align-items: flex-end;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-base), visibility var(--transition-base);
        }

        .address-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .address-content {
            background: var(--surface);
            border-radius: 18px 18px 0 0;
            padding: 20px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform var(--transition-slow);
        }

        .address-modal.show .address-content {
            transform: translateY(0);
        }

        .address-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--line);
        }

        .address-title {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--ink);
        }

        .address-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ink);
        }

        .address-close svg { width: 16px; height: 16px; }

        .address-list {
            margin-bottom: 20px;
        }

        .address-item {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: border-color var(--transition-base), background-color var(--transition-base);
        }

        .address-item:hover { border-color: var(--line-strong); }

        .address-item.default { border-color: var(--focus-ink); }

        .address-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .address-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .address-phone {
            font-size: 14px;
            color: var(--muted);
            margin-left: 12px;
        }

        .address-default {
            padding: 2px 8px;
            background: var(--focus);
            color: var(--focus-ink);
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
        }

        .address-detail {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .address-actions {
            display: flex;
            gap: 10px;
        }

        .address-action {
            padding: 5px 13px;
            border: 1px solid var(--line-strong);
            border-radius: 999px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color var(--transition-base), border-color var(--transition-base), color var(--transition-base);
            background: var(--surface);
            color: var(--muted);
        }

        .address-action:active { background: var(--surface-2); }

        .address-action.edit {
            color: var(--focus-ink);
            border-color: var(--focus);
        }

        .address-action.delete {
            color: var(--deadline);
            border-color: var(--deadline-soft);
        }

        .add-address-btn {
            width: 100%;
            padding: 13px;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-size: 15px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .add-address-btn:active { background: var(--ink-soft); }

        /* 统一提示条与设计令牌（旧提示色的文字对比度不达标） */
        .toast { background-color: var(--ink) !important; }

        @media (max-width: 480px) {
            .profile-hero {
                padding: 22px 16px 18px;
            }

            .user-name {
                font-size: 22px;
            }

            .menu-item {
                padding: 14px 16px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部：标题 + 编辑 -->
    <div class="app-header">
        <div class="header-spacer"></div>
        <div class="header-title">我的</div>
        <button class="icon-btn" id="editProfile" aria-label="编辑资料">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>
        </button>
    </div>

    <!-- 用户信息 -->
    <div class="profile-hero">
        <div class="user-info" id="userInfoSection">
            <div class="user-avatar" id="userAvatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
            </div>
            <div class="user-details">
                <div class="user-name" id="userName">未登录</div>
                <div class="user-phone" id="userPhone">请先登录</div>
                <div class="user-level">普通会员</div>
            </div>
        </div>
    </div>

    <!-- 统计信息 -->
    <div class="stats-group">
        <div class="stat-item" data-action="orders">
            <div class="stat-number" id="orderCount">0</div>
            <div class="stat-label">订单数</div>
        </div>
        <div class="stat-item" data-action="favorites">
            <div class="stat-number" id="favoriteCount">0</div>
            <div class="stat-label">收藏</div>
        </div>
        <div class="stat-item" data-action="coupons">
            <div class="stat-number" id="couponCount">0</div>
            <div class="stat-label">优惠券</div>
        </div>
        <div class="stat-item" data-action="points">
            <div class="stat-number" id="pointCount">0</div>
            <div class="stat-label">积分</div>
        </div>
    </div>

    <!-- 订单管理 -->
    <div class="group-label">订单管理</div>
    <div class="menu-section">
        <a href="orders.html" class="menu-item">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">我的订单</div>
                <div class="menu-desc">查看全部订单</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </a>
    </div>

    <!-- 个人服务 -->
    <div class="group-label">个人服务</div>
    <div class="menu-section">
        <div class="menu-item" data-action="address">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">收货地址</div>
                <div class="menu-desc">管理收货地址</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
        <div class="menu-item" data-action="coupons">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><path d="M4.5 7.5A1.5 1.5 0 0 0 6 6h12a1.5 1.5 0 0 0 1.5 1.5v3a2 2 0 0 0 0 3v3A1.5 1.5 0 0 0 18 18H6a1.5 1.5 0 0 0-1.5-1.5v-3a2 2 0 0 0 0-3z"/><path d="M12 7.5v9" stroke-dasharray="2 2.4"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">优惠券</div>
                <div class="menu-desc">查看可用优惠券</div>
            </div>
            <div class="menu-badge" id="couponBadge">3</div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
        <div class="menu-item" data-action="favorites">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.6 12 20 12 20z"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">我的收藏</div>
                <div class="menu-desc">收藏的商家和商品</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
        <div class="menu-item" data-action="wallet">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/><path d="M16.5 14.5h2"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">我的钱包</div>
                <div class="menu-desc">余额和积分管理</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
    </div>

    <!-- 客服与设置 -->
    <div class="group-label">客服与设置</div>
    <div class="menu-section">
        <div class="menu-item" data-action="service">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><path d="M5 13a7 7 0 0 1 14 0"/><rect x="3.5" y="13" width="4" height="5" rx="1.5"/><rect x="16.5" y="13" width="4" height="5" rx="1.5"/><path d="M19 18a3 3 0 0 1-3 3h-1.5"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">客服中心</div>
                <div class="menu-desc">在线客服，问题反馈</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
        <div class="menu-item" data-action="settings">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M17.7 6.3l-1.4 1.4M7.7 16.3l-1.4 1.4"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">设置</div>
                <div class="menu-desc">账号设置，隐私设置</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
        <div class="menu-item" data-action="help">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.6a2.4 2.4 0 1 1 3.3 2.2c-.8.4-1 .9-1 1.7"/><circle cx="12" cy="16.6" r="0.9" fill="currentColor" stroke="none"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">帮助中心</div>
                <div class="menu-desc">常见问题，使用指南</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
        <div class="menu-item" data-action="about">
            <div class="menu-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5"/><circle cx="12" cy="8.1" r="0.9" fill="currentColor" stroke="none"/></svg>
            </div>
            <div class="menu-content">
                <div class="menu-name">关于我们</div>
                <div class="menu-desc">版本信息，用户协议</div>
            </div>
            <div class="menu-arrow">
                <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
            </div>
        </div>
    </div>

    <!-- 退出登录 -->
    <div class="logout-section">
        <button class="logout-btn" id="logoutBtn">退出登录</button>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item" data-page="index">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5L20 11v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
        </div>
        <div class="nav-text">首页</div>
    </div>
    <div class="nav-item" data-page="search">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        </div>
        <div class="nav-text">搜索</div>
    </div>
    <div class="nav-item cart-badge" data-page="cart">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M3 4h2l2.3 10.6a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L19.5 8H6"/></svg>
            <div class="cart-count" id="cartCount" style="display: none;">0</div>
        </div>
        <div class="nav-text">购物车</div>
    </div>
    <div class="nav-item" data-page="orders">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
        </div>
        <div class="nav-text">订单</div>
    </div>
    <div class="nav-item active" data-page="profile">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
        </div>
        <div class="nav-text">我的</div>
    </div>
</div>

<!-- 地址管理弹窗 -->
<div class="address-modal" id="addressModal">
    <div class="address-content">
        <div class="address-header">
            <div class="address-title">收货地址</div>
            <div class="address-close" id="addressClose" aria-label="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </div>
        </div>
        <div class="address-list" id="addressList">
            <!-- 地址列表将通过JavaScript动态生成 -->
        </div>
        <button class="add-address-btn" id="addAddressBtn">新增收货地址</button>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/utils.js"></script>
<script>
    // 未登录 / 无头像时的线性占位图标
    const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>';

    $(document).ready(function() {
        let userInfo = null;
        let addresses = [];

        // 初始化页面
        init();

        function init() {
            // 更新时间显示
            updateTime();
            setInterval(updateTime, 1000);

            // 检查登录状态
            if (!AuthUtil.isLoggedIn()) {
                showLoginPrompt();
            } else {
                loadUserInfo();
            }

            // 绑定事件
            bindEvents();

            // 更新购物车数量
            updateCartBadge();

            // 加载地址列表
            loadAddresses();

            // 绑定底部导航事件
            bindNavigationEvents();
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            const timeEl = document.getElementById('currentTime');
            if (timeEl) {
                timeEl.textContent = timeString;
            }
        }

        function bindNavigationEvents() {
            // 底部导航点击事件
            $('.nav-item').on('click', function() {
                const page = $(this).data('page');
                if (page && page !== 'profile') {
                    window.location.href = `${page}.html`;
                }
            });
        }

        function bindEvents() {
            // 编辑个人资料
            $('#editProfile').on('click', function() {
                if (!AuthUtil.isLoggedIn()) {
                    RouterUtil.navigateTo('login');
                    return;
                }
                UIUtil.showToast('编辑资料功能开发中', 'info');
            });

            // 统计项点击
            $('.stat-item').on('click', function() {
                const action = $(this).data('action');
                handleStatAction(action);
            });

            // 菜单项点击
            $('.menu-item').on('click', function(e) {
                e.preventDefault();
                const action = $(this).data('action');
                if (action) {
                    handleMenuAction(action);
                }
            });

            // 退出登录
            $('#logoutBtn').on('click', function() {
                logout();
            });

            // 地址管理相关
            $('#addressClose').on('click', function() {
                hideAddressModal();
            });

            $('#addAddressBtn').on('click', function() {
                addAddress();
            });

            // 地址操作事件委托
            $('#addressList').on('click', '.address-action', function(e) {
                e.stopPropagation();
                const action = $(this).data('action');
                const addressId = $(this).closest('.address-item').data('address-id');
                handleAddressAction(action, addressId);
            });

            // 点击模态框背景关闭
            $('#addressModal').on('click', function(e) {
                if (e.target === this) {
                    hideAddressModal();
                }
            });
        }

        // 显示登录提示
        function showLoginPrompt() {
            $('#userName').text('未登录');
            $('#userPhone').text('点击登录');
            $('#userAvatar').html(PERSON_SVG);

            // 点击头像区域跳转登录
            $('#userInfoSection').on('click', function() {
                RouterUtil.navigateTo('login');
            });
        }

        // 加载用户信息
        async function loadUserInfo() {
            try {
                UIUtil.showLoading('加载用户信息...');

                // 通过API获取用户信息
                const response = await http.get('/users/profile');

                if (response && response.code === '00000' && response.data) {
                    userInfo = response.data;
                    // 同时保存到本地存储
                    AuthUtil.saveLoginInfo({ user: userInfo });
                    updateUserDisplay();
                    loadUserStats();
                } else {
                    // API返回错误，可能是未登录
                    throw new Error(response.info || '获取用户信息失败');
                }
            } catch (error) {
                console.error('加载用户信息失败:', error);

                // 如果是认证失败，直接显示登录提示
                if (error.message.includes('获取用户信息失败') || error.message.includes('B0001')) {
                    showLoginPrompt();
                    return;
                }

                UIUtil.showToast('获取用户信息失败: ' + error.message, 'error');

                // 如果API调用失败，尝试从本地存储获取
                userInfo = AuthUtil.getUserInfo();
                if (userInfo) {
                    updateUserDisplay();
                    loadUserStats();
                } else {
                    // 如果本地也没有，显示登录提示
                    showLoginPrompt();
                }
            } finally {
                UIUtil.hideLoading();
            }
        }

        // 更新用户显示
        function updateUserDisplay() {
            // 根据后端API返回的字段结构获取用户名
            const displayName = userInfo.nickname || userInfo.userName || userInfo.name || userInfo.realName || '用户';
            $('#userName').text(displayName);
            $('#userPhone').text(userInfo.phone || userInfo.mobile || '');

            if (userInfo.avatar || userInfo.avatarUrl) {
                $('#userAvatar').html(`<img src="${userInfo.avatar || userInfo.avatarUrl}" alt="头像">`);
            } else {
                $('#userAvatar').text(displayName.charAt(0));
            }

            // 移除登录提示的点击事件
            $('#userInfoSection').off('click');
        }

        // 加载用户统计
        function loadUserStats() {
            // 模拟统计数据
            const stats = {
                orderCount: Math.floor(Math.random() * 50) + 1,
                favoriteCount: Math.floor(Math.random() * 20) + 1,
                couponCount: Math.floor(Math.random() * 10) + 1,
                pointCount: Math.floor(Math.random() * 1000) + 100
            };

            $('#orderCount').text(stats.orderCount);
            $('#favoriteCount').text(stats.favoriteCount);
            $('#couponCount').text(stats.couponCount);
            $('#pointCount').text(stats.pointCount);

            // 更新优惠券徽章
            if (stats.couponCount > 0) {
                $('#couponBadge').text(stats.couponCount).show();
            } else {
                $('#couponBadge').hide();
            }
        }

        // 处理统计项操作
        function handleStatAction(action) {
            if (!AuthUtil.isLoggedIn()) {
                RouterUtil.navigateTo('login');
                return;
            }

            switch (action) {
                case 'orders':
                    RouterUtil.navigateTo('orders');
                    break;
                case 'favorites':
                    UIUtil.showToast('收藏功能开发中', 'info');
                    break;
                case 'coupons':
                    UIUtil.showToast('优惠券功能开发中', 'info');
                    break;
                case 'points':
                    UIUtil.showToast('积分功能开发中', 'info');
                    break;
            }
        }

        // 处理菜单操作
        function handleMenuAction(action) {
            if (!AuthUtil.isLoggedIn()) {
                RouterUtil.navigateTo('login');
                return;
            }

            switch (action) {
                case 'address':
                    showAddressModal();
                    break;
                case 'coupons':
                    UIUtil.showToast('优惠券功能开发中', 'info');
                    break;
                case 'favorites':
                    UIUtil.showToast('收藏功能开发中', 'info');
                    break;
                case 'wallet':
                    UIUtil.showToast('钱包功能开发中', 'info');
                    break;
                case 'service':
                    UIUtil.showToast('客服功能开发中', 'info');
                    break;
                case 'settings':
                    UIUtil.showToast('设置功能开发中', 'info');
                    break;
                case 'help':
                    UIUtil.showToast('帮助中心功能开发中', 'info');
                    break;
                case 'about':
                    UIUtil.showToast('关于我们功能开发中', 'info');
                    break;
            }
        }

        // 退出登录
        function logout() {
            if (!confirm('确定要退出登录吗？')) {
                return;
            }

            AuthUtil.logout();
            UIUtil.showToast('已退出登录', 'success');

            // 重新初始化页面
            setTimeout(() => {
                init();
            }, 1000);
        }

        // 显示地址管理弹窗
        function showAddressModal() {
            renderAddresses();
            $('#addressModal').addClass('show');
            $('body').css('overflow', 'hidden');
        }

        // 隐藏地址管理弹窗
        function hideAddressModal() {
            $('#addressModal').removeClass('show');
            $('body').css('overflow', 'auto');
        }

        // 加载地址列表
        function loadAddresses() {
            // 从本地存储获取地址
            const savedAddresses = StorageUtil.get('user_addresses');
            if (savedAddresses) {
                addresses = savedAddresses;
            } else {
                // 生成模拟地址数据
                addresses = [
                    {
                        id: 'addr_1',
                        name: '张三',
                        phone: '138****8888',
                        province: '北京市',
                        city: '北京市',
                        district: '朝阳区',
                        detail: '三里屯街道工体北路8号院',
                        isDefault: true
                    },
                    {
                        id: 'addr_2',
                        name: '李四',
                        phone: '139****9999',
                        province: '北京市',
                        city: '北京市',
                        district: '海淀区',
                        detail: '中关村大街1号院',
                        isDefault: false
                    }
                ];
                StorageUtil.set('user_addresses', addresses);
            }
        }

        // 渲染地址列表
        function renderAddresses() {
            const $addressList = $('#addressList');
            $addressList.empty();

            if (addresses.length === 0) {
                $addressList.html('<div style="text-align: center; padding: 40px; color: var(--muted); font-size: 13px;">暂无收货地址</div>');
                return;
            }

            addresses.forEach(address => {
                const addressHtml = `
                    <div class="address-item ${address.isDefault ? 'default' : ''}" data-address-id="${address.id}">
                        <div class="address-info">
                            <div>
                                <span class="address-name">${address.name}</span>
                                <span class="address-phone">${address.phone}</span>
                            </div>
                            ${address.isDefault ? '<div class="address-default">默认</div>' : ''}
                        </div>
                        <div class="address-detail">
                            ${address.province}${address.city}${address.district}${address.detail}
                        </div>
                        <div class="address-actions">
                            <button class="address-action edit" data-action="edit">编辑</button>
                            <button class="address-action delete" data-action="delete">删除</button>
                            ${!address.isDefault ? '<button class="address-action" data-action="setDefault">设为默认</button>' : ''}
                        </div>
                    </div>
                `;
                $addressList.append(addressHtml);
            });
        }

        // 处理地址操作
        function handleAddressAction(action, addressId) {
            switch (action) {
                case 'edit':
                    editAddress(addressId);
                    break;
                case 'delete':
                    deleteAddress(addressId);
                    break;
                case 'setDefault':
                    setDefaultAddress(addressId);
                    break;
            }
        }

        // 编辑地址
        function editAddress(addressId) {
            UIUtil.showToast('编辑地址功能开发中', 'info');
        }

        // 删除地址
        function deleteAddress(addressId) {
            if (!confirm('确定要删除这个地址吗？')) {
                return;
            }

            addresses = addresses.filter(addr => addr.id !== addressId);
            StorageUtil.set('user_addresses', addresses);
            renderAddresses();
            UIUtil.showToast('地址删除成功', 'success');
        }

        // 设为默认地址
        function setDefaultAddress(addressId) {
            addresses.forEach(addr => {
                addr.isDefault = addr.id === addressId;
            });
            StorageUtil.set('user_addresses', addresses);
            renderAddresses();
            UIUtil.showToast('已设为默认地址', 'success');
        }

        // 新增地址
        function addAddress() {
            UIUtil.showToast('新增地址功能开发中', 'info');
        }

        // 更新购物车徽章
        function updateCartBadge() {
            const count = localStorage.getItem('cartItemCount') || 0;
            const cartCountEl = $('#cartCount');

            if (count > 0) {
                cartCountEl.text(count > 99 ? '99+' : count);
                cartCountEl.show();
            } else {
                cartCountEl.hide();
            }
        }

        // 定期更新购物车数量
        setInterval(updateCartBadge, 1000);
    });
</script>
</body>
</html>
