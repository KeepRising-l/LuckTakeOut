<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--canvas);
            color: var(--ink);
        }

        .login-container {
            min-height: 100vh;
            background: var(--canvas);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
        }

        .login-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            padding: 34px 26px 26px;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo {
            width: 68px;
            height: 68px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            border-radius: 50%;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }

        .login-logo svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .login-title {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--ink);
            margin-bottom: 7px;
        }

        .login-subtitle {
            color: var(--muted);
            font-size: 14px;
        }

        .login-form {
            margin-bottom: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        .input-group {
            position: relative;
        }

        .form-input {
            width: 100%;
            height: 50px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: var(--surface);
            color: var(--ink);
            font-size: 16px;
            transition: border-color var(--transition-base);
        }

        .form-input::placeholder {
            color: var(--muted);
        }

        .form-input:focus {
            border-color: var(--focus-ink);
        }

        .form-input.error {
            border-color: var(--error-color);
        }

        .code-input-group {
            display: flex;
            gap: 12px;
        }

        .code-input {
            flex: 1;
        }

        .send-code-btn {
            width: 122px;
            height: 50px;
            background: var(--surface-2);
            color: var(--ink);
            border: none;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            transition: background-color var(--transition-base), color var(--transition-base);
            white-space: nowrap;
            flex: none;
        }

        .send-code-btn:active:not(:disabled) {
            background: var(--surface-3);
        }

        .send-code-btn:disabled {
            color: var(--muted);
            cursor: not-allowed;
        }

        .error-message {
            color: var(--error-color);
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-size: 16px;
            font-weight: 550;
            letter-spacing: 0.2px;
            transition: background-color var(--transition-base), transform var(--transition-fast);
        }

        .login-btn:active:not(:disabled) {
            background: var(--ink-soft);
            transform: scale(0.99);
        }

        .login-btn:disabled {
            background: var(--line-strong);
            color: var(--surface);
            cursor: not-allowed;
        }

        .login-footer {
            text-align: center;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .login-footer a {
            color: var(--ink);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:active {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--muted);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line);
        }

        .divider span {
            padding: 0 14px;
        }

        .oauth-login {
            display: flex;
            gap: 14px;
            justify-content: center;
        }

        .oauth-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: var(--surface-2);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .oauth-btn svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .oauth-btn:active {
            background: var(--surface-3);
        }

        .test-account-group {
            margin-top: 14px;
            text-align: center;
        }

        .test-account-btn {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line-strong);
            border-radius: var(--radius-full);
            padding: 11px 18px;
            font-size: 14px;
            transition: background-color var(--transition-base), border-color var(--transition-base);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .test-account-btn:active {
            background: var(--surface-2);
            border-color: var(--faint);
        }

        .test-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }

        .test-icon svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 已登录状态 */
        .user-info-section {
            text-align: center;
            margin: 6px 0 26px;
        }

        .user-avatar-large {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-serif);
            font-size: 34px;
            font-weight: 600;
            margin: 0 auto 18px;
            color: var(--ink);
            overflow: hidden;
        }

        .user-avatar-large svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .user-avatar-large img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-name-large {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .user-phone-large {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        .user-level-large {
            display: inline-block;
            padding: 5px 15px;
            background: var(--meeting);
            color: var(--meeting-ink);
            border-radius: var(--radius-full);
            font-size: 12px;
            font-weight: 600;
        }

        .logged-in-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 4px 0 24px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 20px;
            border: 1px solid transparent;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base), color var(--transition-base), border-color var(--transition-base);
            text-decoration: none;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .action-btn.primary {
            background: var(--ink);
            color: #fff;
        }

        .action-btn.primary:active {
            background: var(--ink-soft);
        }

        .action-btn.secondary {
            background: var(--surface);
            color: var(--ink);
            border-color: var(--line-strong);
        }

        .action-btn.secondary:active {
            background: var(--surface-2);
        }

        .action-btn.logout {
            background: var(--surface);
            color: var(--deadline);
            border-color: var(--line-strong);
        }

        .action-btn.logout:active {
            background: var(--deadline-soft);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 16px 14px;
            }

            .login-card {
                padding: 28px 20px 22px;
            }

            .code-input-group {
                flex-direction: column;
            }

            .send-code-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- 未登录状态 -->
        <div class="login-card" id="loginCard">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>
                </div>
                <h1 class="login-title">吉祥外卖</h1>
                <p class="login-subtitle">请登录您的账户继续使用</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="phone">手机号</label>
                    <div class="input-group">
                        <input type="tel" id="phone" class="form-input" placeholder="请输入手机号" maxlength="11">
                        <div class="error-message" id="phoneError"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="code">验证码</label>
                    <div class="code-input-group">
                        <div class="input-group code-input">
                            <input type="text" id="code" class="form-input" placeholder="请输入验证码" maxlength="6">
                            <div class="error-message" id="codeError"></div>
                        </div>
                        <button type="button" class="send-code-btn" id="sendCodeBtn">发送验证码</button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">登录</button>

                <div class="test-account-group">
                    <button type="button" class="test-account-btn" id="testAccountBtn">
                        <span class="test-icon">
                            <svg viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6l-4.5 8a2 2 0 0 0 1.8 3h9.4a2 2 0 0 0 1.8-3L14 9V3"/><path d="M7.5 15h9"/></svg>
                        </span>
                        <span>使用测试账号</span>
                    </button>
                </div>
            </form>

            <div class="divider">
                <span>或使用第三方登录</span>
            </div>

            <div class="oauth-login">
                <div class="oauth-btn wechat" data-type="wechat" title="微信登录">
                    <svg viewBox="0 0 24 24"><path d="M10 6.5C6.4 6.5 3.5 8.9 3.5 11.9c0 1.7 1 3.2 2.6 4.2l-.7 2.2 2.4-1.2c.7.2 1.4.3 2.2.3"/><path d="M14 10.4c3 0 5.5 1.9 5.5 4.3 0 1.4-.8 2.6-2 3.4l.5 1.8-1.9-1c-.6.2-1.3.2-2.1.2-3 0-5.5-1.9-5.5-4.3s2.5-4.4 5.5-4.4z"/></svg>
                </div>
                <div class="oauth-btn qq" data-type="qq" title="QQ登录">
                    <svg viewBox="0 0 24 24"><path d="M12 3.5c-3 0-5 2.3-5 5.3 0 1-.3 1.7-.9 2.6-.9 1.3-1.6 2.4-1.6 3.6 0 1 .6 1.7 1.7 1.7.6 0 1.1-.2 1.5-.6"/><path d="M12 3.5c3 0 5 2.3 5 5.3 0 1 .3 1.7.9 2.6.9 1.3 1.6 2.4 1.6 3.6 0 1-.6 1.7-1.7 1.7-.6 0-1.1-.2-1.5-.6"/><circle cx="12" cy="10" r="3.4"/></svg>
                </div>
                <div class="oauth-btn alipay" data-type="alipay" title="支付宝登录">
                    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M6.5 14c3.5 1.6 6.5 1 8.5-1.2"/><path d="M12 7v4.5"/></svg>
                </div>
            </div>

            <div class="login-footer">
                <p>登录即表示您同意我们的 <a href="#">服务条款</a> 和 <a href="#">隐私政策</a></p>
            </div>
        </div>

        <!-- 已登录状态 -->
        <div class="login-card" id="loggedInCard" style="display: none;">
            <div class="login-header">
                <div class="login-logo">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
                </div>
                <h1 class="login-title">您已登录</h1>
                <p class="login-subtitle">欢迎回来，继续您的美食之旅</p>
            </div>

            <div class="user-info-section">
                <div class="user-avatar-large" id="userAvatarLarge">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
                </div>
                <div class="user-details-large">
                    <div class="user-name-large" id="userNameLarge">用户名</div>
                    <div class="user-phone-large" id="userPhoneLarge">手机号</div>
                    <div class="user-level-large">普通会员</div>
                </div>
            </div>

            <div class="logged-in-actions">
                <button class="action-btn primary" id="goToHomeBtn">
                    <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5L20 11v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
                    <span>返回首页</span>
                </button>
                <button class="action-btn secondary" id="goToProfileBtn">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
                    <span>个人中心</span>
                </button>
                <button class="action-btn logout" id="logoutFromLoginBtn">
                    <svg viewBox="0 0 24 24"><path d="M9 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h3"/><path d="M15 12H9"/><path d="M13 9l3 3-3 3"/></svg>
                    <span>退出登录</span>
                </button>
            </div>

            <div class="login-footer">
                <p>感谢您使用我们的服务</p>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script>
        $(document).ready(function() {
            let countdown = 0;
            let countdownTimer = null;

            // 更新时间显示
            updateTime();
            setInterval(updateTime, 1000);

            function updateTime() {
                const now = new Date();
                const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                const timeEl = document.getElementById('currentTime');
                if (timeEl) {
                    timeEl.textContent = timeString;
                }
            }

            // 手机号输入格式化
            $('#phone').on('input', function() {
                let value = $(this).val().replace(/\D/g, '');
                if (value.length > 11) {
                    value = value.substring(0, 11);
                }
                $(this).val(value);

                // 清除错误状态
                $(this).removeClass('error');
                $('#phoneError').hide();
            });

            // 验证码输入格式化
            $('#code').on('input', function() {
                let value = $(this).val().replace(/\D/g, '');
                if (value.length > 6) {
                    value = value.substring(0, 6);
                }
                $(this).val(value);

                // 清除错误状态
                $(this).removeClass('error');
                $('#codeError').hide();
            });

            // 发送验证码
            $('#sendCodeBtn').on('click', function() {
                const phone = $('#phone').val().trim();

                // 验证手机号
                if (!ValidateUtil.validatePhone(phone)) {
                    showError('phone', '请输入正确的手机号');
                    return;
                }

                // 发送验证码
                sendVerificationCode(phone);
            });

            // 登录表单提交
            $('#loginForm').on('submit', function(e) {
                e.preventDefault();

                const phone = $('#phone').val().trim();
                const code = $('#code').val().trim();

                // 表单验证
                let isValid = true;

                if (!ValidateUtil.validatePhone(phone)) {
                    showError('phone', '请输入正确的手机号');
                    isValid = false;
                }

                if (!ValidateUtil.validateCode(code)) {
                    showError('code', '请输入6位验证码');
                    isValid = false;
                }

                if (!isValid) return;

                // 执行登录
                performLogin(phone, code);
            });

            // 第三方登录
            $('.oauth-btn').on('click', function() {
                const type = $(this).data('type');
                performOAuthLogin(type);
            });

            // 测试账号按钮点击事件
            $('#testAccountBtn').on('click', function() {
                $('#phone').val('13800138001');
                $('#code').val('123456');

                // 清除错误状态
                clearError('phone');
                clearError('code');

                UIUtil.showToast('已填入测试账号信息', 'success');
            });

            // 显示错误信息
            function showError(field, message) {
                $(`#${field}`).addClass('error');
                $(`#${field}Error`).text(message).show();
            }

            // 清除错误信息
            function clearError(field) {
                $(`#${field}`).removeClass('error');
                $(`#${field}Error`).hide();
            }

            // 发送验证码
            async function sendVerificationCode(phone) {
                try {
                    UIUtil.showLoading('发送中...');

                    const response = await http.post('/auth/code', {
                        phone: phone,
                        type: 'LOGIN'
                    });

                    UIUtil.hideLoading();
                    UIUtil.showToast('验证码发送成功', 'success');

                    // 开始倒计时
                    startCountdown();

                } catch (error) {
                    UIUtil.hideLoading();
                    UIUtil.showToast(error.message || '发送失败，请重试', 'error');
                }
            }

            // 开始倒计时
            function startCountdown() {
                countdown = 60;
                const $btn = $('#sendCodeBtn');
                $btn.prop('disabled', true);

                countdownTimer = setInterval(() => {
                    countdown--;
                    $btn.text(`${countdown}秒后重发`);

                    if (countdown <= 0) {
                        clearInterval(countdownTimer);
                        $btn.prop('disabled', false).text('发送验证码');
                    }
                }, 1000);
            }

            // 执行登录
            async function performLogin(phone, code) {
                try {
                    UIUtil.showLoading('登录中...');
                    $('#loginBtn').prop('disabled', true);

                    const response = await http.post('/auth/login', {
                        phone: phone,
                        code: code
                    });

                    UIUtil.hideLoading();

                    // 保存登录信息
                    AuthUtil.saveLoginInfo(response.data);

                    UIUtil.showToast('登录成功', 'success');

                    // 显示已登录状态
                    setTimeout(() => {
                        showLoggedInState();
                    }, 1000);

                } catch (error) {
                    UIUtil.hideLoading();
                    $('#loginBtn').prop('disabled', false);

                    if (error.message.includes('验证码')) {
                        showError('code', error.message);
                    } else if (error.message.includes('手机号')) {
                        showError('phone', error.message);
                    } else {
                        UIUtil.showToast(error.message || '登录失败，请重试', 'error');
                    }
                }
            }

            // 第三方登录
            async function performOAuthLogin(type) {
                try {
                    UIUtil.showLoading('跳转中...');

                    const response = await http.post('/auth/login', {
                        provider: type.toUpperCase()
                    });

                    UIUtil.hideLoading();

                    if (response.data && response.data.authUrl) {
                        // 跳转到第三方授权页面
                        window.location.href = response.data.authUrl;
                    } else {
                        UIUtil.showToast('暂不支持该登录方式', 'error');
                    }

                } catch (error) {
                    UIUtil.hideLoading();
                    UIUtil.showToast(error.message || '登录失败，请重试', 'error');
                }
            }

            // 检查是否已登录
            if (AuthUtil.isLoggedIn()) {
                showLoggedInState();
            } else {
                showLoginState();
            }

            // 绑定已登录状态的按钮事件
            bindLoggedInEvents();

            // 显示登录状态
            function showLoggedInState() {
                const userInfo = AuthUtil.getUserInfo();
                if (userInfo) {
                    // 更新用户信息显示
                    const displayName = userInfo.nickname || userInfo.name || '用户';
                    $('#userNameLarge').text(displayName);
                    $('#userPhoneLarge').text(userInfo.phone || '');

                    // 设置头像
                    if (userInfo.avatar) {
                        $('#userAvatarLarge').html(`<img src="${userInfo.avatar}" alt="头像">`);
                    } else {
                        $('#userAvatarLarge').text(displayName.charAt(0));
                    }
                }

                // 显示已登录卡片，隐藏登录卡片
                $('#loginCard').hide();
                $('#loggedInCard').show();
            }

            // 显示未登录状态
            function showLoginState() {
                $('#loggedInCard').hide();
                $('#loginCard').show();
            }

            // 绑定已登录状态的事件
            function bindLoggedInEvents() {
                // 返回首页
                $('#goToHomeBtn').on('click', function() {
                    RouterUtil.navigateTo('index');
                });

                // 个人中心
                $('#goToProfileBtn').on('click', function() {
                    RouterUtil.navigateTo('profile');
                });

                // 退出登录
                $('#logoutFromLoginBtn').on('click', function() {
                    if (confirm('确定要退出登录吗？')) {
                        AuthUtil.logout();
                        UIUtil.showToast('已退出登录', 'success');
                        showLoginState();
                    }
                });
            }

            // 处理第三方登录回调
            const urlParams = RouterUtil.getUrlParams();
            if (urlParams.code && urlParams.state) {
                handleOAuthCallback(urlParams);
            }

            // 处理第三方登录回调
            async function handleOAuthCallback(params) {
                try {
                    UIUtil.showLoading('登录中...');

                    const response = await http.post('/auth/callback', params);

                    UIUtil.hideLoading();

                    // 保存登录信息
                    AuthUtil.saveLoginInfo(response.data);

                    UIUtil.showToast('登录成功', 'success');

                    // 显示已登录状态
                    showLoggedInState();

                } catch (error) {
                    UIUtil.hideLoading();
                    UIUtil.showToast(error.message || '登录失败，请重试', 'error');
                }
            }
        });
    </script>
</body>
</html>
