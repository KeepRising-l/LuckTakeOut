<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background-color: var(--canvas);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 96px;
        }

        /* 顶部导航 */
        .header-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--canvas);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ink);
            transition: background-color var(--transition-base);
            border: none;
            flex: none;
            padding: 0;
        }

        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:active { background: var(--surface-3); }

        .header-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            text-align: center;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 内容区 */
        #cartContent { padding-top: 14px; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            margin: 0 16px 12px;
            overflow: hidden;
        }

        /* 商家信息 */
        .merchant-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px 16px;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .merchant-info:active { background: var(--surface-2); }

        .merchant-logo {
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            flex: none;
        }

        .merchant-logo svg { width: 24px; height: 24px; }

        .merchant-details { flex: 1; min-width: 0; }

        .merchant-name {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.6px;
            line-height: 1.25;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .merchant-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success-color);
            flex: none;
        }

        .merchant-arrow {
            width: 16px;
            height: 16px;
            color: var(--muted);
            flex: none;
        }

        /* 购物车商品列表 */
        .cart-items { padding: 0; }

        .cart-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cart-item:last-child { border-bottom: none; }

        .item-checkbox {
            width: 22px;
            height: 22px;
            border: 1.5px solid var(--line-strong);
            border-radius: 50%;
            background: var(--surface);
            color: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
            transition: background-color var(--transition-base), border-color var(--transition-base);
        }

        .item-checkbox svg { width: 13px; height: 13px; display: none; }

        .item-checkbox.checked {
            background: var(--ink);
            border-color: var(--ink);
        }

        .item-checkbox.checked svg { display: block; }

        .item-image {
            width: 64px;
            height: 64px;
            border-radius: 12px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            overflow: hidden;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--faint);
        }

        .item-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .item-image svg { width: 28px; height: 28px; }

        .item-info { flex: 1; min-width: 0; }

        .item-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
            margin-bottom: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-specs {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .item-price {
            font-size: 16px;
            font-weight: 600;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
            transition: background-color var(--transition-base);
        }

        .quantity-btn svg { width: 15px; height: 15px; }
        .quantity-btn:active { background: var(--surface-2); }

        .quantity-btn:disabled {
            border-color: var(--line);
            color: var(--faint);
            cursor: not-allowed;
        }

        .quantity-btn:disabled:active { background: var(--surface); }

        .quantity-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            min-width: 18px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* 优惠券 */
        .coupon-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .coupon-section:active { background: var(--surface-2); }

        .coupon-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .coupon-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 550;
            color: var(--ink);
        }

        .coupon-title svg { width: 17px; height: 17px; color: var(--deadline); }

        .coupon-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .coupon-discount {
            padding: 3px 9px;
            background: var(--meeting);
            color: var(--meeting-ink);
            font-size: 13px;
            font-weight: 550;
            border-radius: var(--radius-full);
        }

        .coupon-arrow {
            width: 15px;
            height: 15px;
            color: var(--muted);
            flex: none;
        }

        /* 配送信息 */
        .delivery-section { padding: 6px 16px; }

        .delivery-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
            border-bottom: 1px solid var(--line);
        }

        .delivery-item:last-child { border-bottom: none; }

        .delivery-label { font-size: 13px; color: var(--muted); }

        .delivery-value { font-size: 13px; color: var(--ink); }

        .delivery-time {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 550;
            color: var(--ink);
        }

        .delivery-time svg { width: 14px; height: 14px; color: var(--muted); flex: none; }

        /* 费用明细 */
        .cost-section { padding: 6px 16px; }

        .cost-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 0;
        }

        .cost-item:last-child {
            border-top: 1px solid var(--line);
            margin-top: 3px;
            padding-top: 12px;
        }

        .cost-label { font-size: 13px; color: var(--muted); }
        .cost-value { font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
        .cost-item:last-child .cost-label { color: var(--ink); font-weight: 550; }

        .total-cost {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--deadline);
        }

        /* 底部结算栏 */
        .checkout-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            background: var(--surface);
            border-top: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
        }

        .select-all {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            flex: none;
        }

        .select-all-checkbox {
            width: 22px;
            height: 22px;
            border: 1.5px solid var(--line-strong);
            border-radius: 50%;
            background: var(--surface);
            color: var(--surface);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-base), border-color var(--transition-base);
        }

        .select-all-checkbox svg { width: 13px; height: 13px; display: none; }

        .select-all-checkbox.checked {
            background: var(--ink);
            border-color: var(--ink);
        }

        .select-all-checkbox.checked svg { display: block; }

        .select-all-text { font-size: 13px; color: var(--ink); }

        .checkout-info { flex: 1; min-width: 0; }

        .checkout-total {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            line-height: 1.2;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        .checkout-count { font-size: 13px; color: var(--muted); }

        .checkout-btn {
            padding: 11px 24px;
            background: var(--ink);
            color: var(--surface);
            border: none;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            flex: none;
            transition: background-color var(--transition-base);
        }

        .checkout-btn:active { background: var(--ink-soft); }

        .checkout-btn:disabled {
            background: var(--surface-3);
            color: var(--muted);
            cursor: not-allowed;
        }

        /* 空状态 */
        .empty-cart {
            text-align: center;
            padding: 76px 24px;
            margin: 0 16px;
        }

        .empty-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 16px;
            color: var(--faint);
        }

        .empty-icon svg {
            width: 56px;
            height: 56px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-text {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--ink);
            margin-bottom: 22px;
        }

        .empty-btn {
            padding: 12px 30px;
            background: var(--ink);
            color: var(--surface);
            border: none;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .empty-btn:active { background: var(--ink-soft); }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            height: 72px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            cursor: pointer;
            padding: 7px 2px;
            border-radius: 22px;
            transition: all var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--ink);
            background: var(--surface-3);
            font-weight: 550;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-text {
            font-size: 11px;
            font-weight: 500;
        }

        .cart-badge { position: relative; }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--deadline);
            color: var(--surface);
            border-radius: 999px;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: 600;
            min-width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .cart-item { padding: 13px 14px; }

            .empty-cart { padding: 64px 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部导航 -->
    <div class="header-nav">
        <button class="icon-btn" id="backBtn" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="header-title">购物车</div>
        <button class="icon-btn" id="clearBtn" aria-label="清空购物车">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M7 7l1 12h8l1-12"/><path d="M10.5 11v5M13.5 11v5"/></svg>
        </button>
    </div>

    <!-- 购物车内容 -->
    <div id="cartContent">
        <!-- 商家信息 -->
        <div class="panel merchant-info" id="merchantInfo" style="display: none;">
            <!-- 商家信息将通过JavaScript动态加载 -->
        </div>

        <!-- 购物车商品列表 -->
        <div class="panel cart-items" id="cartItems">
            <!-- 商品将通过JavaScript动态加载 -->
        </div>

        <!-- 优惠券 -->
        <div class="panel coupon-section" id="couponSection" style="display: none;">
            <div class="coupon-header">
                <div class="coupon-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2.2a2 2 0 0 0 0 3.6V16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2.2a2 2 0 0 0 0-3.6z"/><path d="M14 6v12" stroke-dasharray="2 2.6"/></svg>
                    优惠券
                </div>
                <div class="coupon-info">
                    <span class="coupon-discount" id="couponDiscount">暂无可用</span>
                    <svg class="coupon-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
                </div>
            </div>
        </div>

        <!-- 配送信息 -->
        <div class="panel delivery-section" id="deliverySection" style="display: none;">
            <div class="delivery-item">
                <div class="delivery-label">配送时间</div>
                <div class="delivery-value delivery-time">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>
                    约30分钟
                </div>
            </div>
            <div class="delivery-item">
                <div class="delivery-label">配送地址</div>
                <div class="delivery-value" id="deliveryAddress">请选择配送地址</div>
            </div>
        </div>

        <!-- 费用明细 -->
        <div class="panel cost-section" id="costSection" style="display: none;">
            <div class="cost-item">
                <div class="cost-label">商品小计</div>
                <div class="cost-value" id="subtotal">¥0.00</div>
            </div>
            <div class="cost-item">
                <div class="cost-label">配送费</div>
                <div class="cost-value" id="deliveryFee">¥3.00</div>
            </div>
            <div class="cost-item">
                <div class="cost-label">优惠减免</div>
                <div class="cost-value" id="discount">-¥0.00</div>
            </div>
            <div class="cost-item">
                <div class="cost-label">实付金额</div>
                <div class="cost-value total-cost" id="totalAmount">¥0.00</div>
            </div>
        </div>
    </div>

    <!-- 空购物车 -->
    <div class="empty-cart" id="emptyCart" style="display: none;">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24"><path d="M6 8h12l-1.1 12.1a1 1 0 0 1-1 .9H8.1a1 1 0 0 1-1-.9z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>
        </div>
        <div class="empty-text">购物车空空如也</div>
        <button class="empty-btn" id="goShoppingBtn">去逛逛</button>
    </div>
</div>

<!-- 底部结算栏 -->
<div class="checkout-bar" id="checkoutBar" style="display: none;">
    <div class="select-all" id="selectAll">
        <div class="select-all-checkbox" id="selectAllCheckbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </div>
        <div class="select-all-text">全选</div>
    </div>
    <div class="checkout-info">
        <div class="checkout-total" id="checkoutTotal">¥0.00</div>
        <div class="checkout-count" id="checkoutCount">共0件商品</div>
    </div>
    <button class="checkout-btn" id="checkoutBtn" disabled>去结算</button>
</div>

<!-- 底部导航 -->
<div class="bottom-nav" id="bottomNav">
    <div class="nav-item" data-page="index">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5L20 11v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
        </div>
        <div class="nav-text">首页</div>
    </div>
    <div class="nav-item" data-page="search">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        </div>
        <div class="nav-text">搜索</div>
    </div>
    <div class="nav-item cart-badge active" data-page="cart">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M3 4h2l2.3 10.6a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L19.5 8H6"/></svg>
            <div class="cart-count" id="cartCount" style="display: none;">0</div>
        </div>
        <div class="nav-text">购物车</div>
    </div>
    <div class="nav-item" data-page="orders">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
        </div>
        <div class="nav-text">订单</div>
    </div>
    <div class="nav-item" data-page="profile">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
        </div>
        <div class="nav-text">我的</div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/utils.js"></script>
<script>
    $(document).ready(function() {
        let cartData = [];
        let selectedItems = new Set();
        let merchantInfo = null;

        // —— 内联 SVG 图标（线性） ——
        const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        const MINUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h12"/></svg>';
        const PLUS_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6v12M6 12h12"/></svg>';
        // 商品图为空时的占位图标（碗）
        const PLACEHOLDER_BOWL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';
        const STORE_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h16v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 9l1.3-4.2a1 1 0 0 1 1-.8h11.4a1 1 0 0 1 1 .8L20 9"/><path d="M9.5 20v-5h5v5"/></svg>';
        const ARROW_SVG = '<svg class="merchant-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

        // 初始化页面
        init();

        function init() {
            // 更新时间显示（状态栏已移除，保留空值保护）
            updateTime();
            setInterval(updateTime, 1000);

            // 检查登录状态
            if (!AuthUtil.isLoggedIn()) {
                RouterUtil.navigateTo('login');
                return;
            }

            // 加载购物车数据
            loadCartData();

            // 绑定事件
            bindEvents();
        }

        function updateTime() {
            const now = new Date();
            const timeString = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
            const timeEl = document.getElementById('currentTime');
            if (timeEl) {
                timeEl.textContent = timeString;
            }
        }

        function bindEvents() {
            // 返回按钮
            $('#backBtn').on('click', function() {
                RouterUtil.goBack();
            });

            // 清空购物车
            $('#clearBtn').on('click', function() {
                clearCart();
            });

            // 全选
            $('#selectAll').on('click', function() {
                toggleSelectAll();
            });

            // 商品选择
            $(document).on('click', '.item-checkbox', function() {
                const productId = $(this).closest('.cart-item').data('product-id');
                toggleItemSelection(productId);
            });

            // 数量控制
            $(document).on('click', '.quantity-btn', function() {
                const productId = $(this).closest('.cart-item').data('product-id');
                const action = $(this).data('action');

                if (action === 'increase') {
                    increaseQuantity(productId);
                } else if (action === 'decrease') {
                    decreaseQuantity(productId);
                }
            });

            // 商家信息点击
            $('#merchantInfo').on('click', function() {
                if (merchantInfo) {
                    RouterUtil.navigateTo('merchant', { id: merchantInfo.merchantId });
                }
            });

            // 优惠券选择
            $('#couponSection').on('click', function() {
                selectCoupon();
            });

            // 去结算
            $('#checkoutBtn').on('click', function() {
                if ($(this).prop('disabled')) return;
                checkout();
            });

            // 去逛逛
            $('#goShoppingBtn').on('click', function() {
                RouterUtil.navigateTo('index');
            });

            // 底部导航
            $('.nav-item').on('click', function() {
                const page = $(this).data('page');
                RouterUtil.navigateTo(page);
            });
        }

        // 加载购物车数据
        function loadCartData() {
            cartData = CartUtil.getCartData();

            if (cartData.length === 0) {
                showEmptyCart();
            } else {
                showCartContent();
                renderCartItems();
                loadMerchantInfo();
                updateCheckoutInfo();
            }
        }

        // 显示空购物车
        function showEmptyCart() {
            $('#cartContent').hide();
            $('#checkoutBar').hide();
            $('#bottomNav').show();
            $('#emptyCart').show();
        }

        // 显示购物车内容
        function showCartContent() {
            $('#emptyCart').hide();
            $('#bottomNav').hide();
            $('#cartContent').show();
            $('#checkoutBar').show();
            $('#merchantInfo').show();
            $('#couponSection').show();
            $('#deliverySection').show();
            $('#costSection').show();
        }

        // 渲染购物车商品
        function renderCartItems() {
            const $container = $('#cartItems');
            $container.empty();

            cartData.forEach(item => {
                const isSelected = selectedItems.has(item.productId);
                const specsText = item.selectedSpecs ?
                    Object.entries(item.selectedSpecs).map(([key, value]) => `${key}: ${value}`).join(', ') : '';

                const imgMarkup = item.productImage
                    ? `<img src="${item.productImage}" alt="${item.productName}" onerror="this.style.display='none';this.parentNode.innerHTML='${PLACEHOLDER_BOWL}';">`
                    : PLACEHOLDER_BOWL;

                $container.append(`
                    <div class="cart-item" data-product-id="${item.productId}">
                        <div class="item-checkbox ${isSelected ? 'checked' : ''}">
                            ${CHECK_SVG}
                        </div>
                        <div class="item-image">
                            ${imgMarkup}
                        </div>
                        <div class="item-info">
                            <div class="item-name">${item.productName}</div>
                            ${specsText ? `<div class="item-specs">${specsText}</div>` : ''}
                            <div class="item-footer">
                                <div class="item-price">¥${FormatUtil.formatMoney(item.finalPrice || item.productPrice)}</div>
                                <div class="quantity-control">
                                    <button class="quantity-btn" data-action="decrease" ${item.quantity <= 1 ? 'disabled' : ''}>${MINUS_SVG}</button>
                                    <span class="quantity-number">${item.quantity}</span>
                                    <button class="quantity-btn" data-action="increase" ${item.quantity >= 99 ? 'disabled' : ''}>${PLUS_SVG}</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `);
            });

            // 默认全选
            if (selectedItems.size === 0) {
                cartData.forEach(item => {
                    selectedItems.add(item.productId);
                });
                updateItemSelection();
            }
        }

        // 加载商家信息
        function loadMerchantInfo() {
            if (cartData.length > 0) {
                const firstItem = cartData[0];
                merchantInfo = {
                    merchantId: firstItem.merchantId,
                    merchantName: firstItem.merchantName || '商家'
                };

                $('#merchantInfo').html(`
                    <div class="merchant-logo">${STORE_SVG}</div>
                    <div class="merchant-details">
                        <div class="merchant-name">${merchantInfo.merchantName}</div>
                        <div class="merchant-status"><span class="status-dot"></span>营业中</div>
                    </div>
                    ${ARROW_SVG}
                `);
            }
        }

        // 切换商品选择
        function toggleItemSelection(productId) {
            if (selectedItems.has(productId)) {
                selectedItems.delete(productId);
            } else {
                selectedItems.add(productId);
            }

            updateItemSelection();
            updateCheckoutInfo();
        }

        // 更新商品选择状态
        function updateItemSelection() {
            cartData.forEach(item => {
                const $checkbox = $(`.cart-item[data-product-id="${item.productId}"] .item-checkbox`);
                const isSelected = selectedItems.has(item.productId);

                if (isSelected) {
                    $checkbox.addClass('checked');
                } else {
                    $checkbox.removeClass('checked');
                }
            });

            // 更新全选状态
            const $selectAllCheckbox = $('#selectAllCheckbox');
            const allSelected = cartData.length > 0 && selectedItems.size === cartData.length;

            if (allSelected) {
                $selectAllCheckbox.addClass('checked');
            } else {
                $selectAllCheckbox.removeClass('checked');
            }
        }

        // 切换全选
        function toggleSelectAll() {
            const allSelected = selectedItems.size === cartData.length;

            if (allSelected) {
                selectedItems.clear();
            } else {
                selectedItems.clear();
                cartData.forEach(item => {
                    selectedItems.add(item.productId);
                });
            }

            updateItemSelection();
            updateCheckoutInfo();
        }

        // 增加数量
        function increaseQuantity(productId) {
            const item = cartData.find(item => item.productId === productId);
            if (item && item.quantity < 99) {
                CartUtil.updateCartItem(productId, item.quantity + 1);
                loadCartData();
            }
        }

        // 减少数量
        function decreaseQuantity(productId) {
            const item = cartData.find(item => item.productId === productId);
            if (item) {
                if (item.quantity > 1) {
                    CartUtil.updateCartItem(productId, item.quantity - 1);
                } else {
                    CartUtil.removeFromCart(productId);
                    selectedItems.delete(productId);
                }
                loadCartData();
            }
        }

        // 更新结算信息
        function updateCheckoutInfo() {
            const selectedCartItems = cartData.filter(item => selectedItems.has(item.productId));
            const subtotal = selectedCartItems.reduce((sum, item) => {
                return sum + (item.finalPrice || item.productPrice) * item.quantity;
            }, 0);

            const deliveryFee = subtotal > 0 ? 3 : 0;
            const discount = 0; // 优惠金额
            const total = subtotal + deliveryFee - discount;
            const totalCount = selectedCartItems.reduce((sum, item) => sum + item.quantity, 0);

            // 更新费用明细
            $('#subtotal').text(`¥${FormatUtil.formatMoney(subtotal)}`);
            $('#deliveryFee').text(`¥${FormatUtil.formatMoney(deliveryFee)}`);
            $('#discount').text(`-¥${FormatUtil.formatMoney(discount)}`);
            $('#totalAmount').text(`¥${FormatUtil.formatMoney(total)}`);

            // 更新结算栏
            $('#checkoutTotal').text(`¥${FormatUtil.formatMoney(total)}`);
            $('#checkoutCount').text(`共${totalCount}件商品`);

            // 更新底部导航角标
            const navCount = cartData.reduce((sum, item) => sum + item.quantity, 0);
            const $cartCount = $('#cartCount');
            if (navCount > 0) {
                $cartCount.text(navCount > 99 ? '99+' : navCount).show();
            } else {
                $cartCount.hide();
            }

            // 更新结算按钮状态
            const $checkoutBtn = $('#checkoutBtn');
            if (selectedCartItems.length > 0 && total > 0) {
                $checkoutBtn.prop('disabled', false).text('去结算');
            } else {
                $checkoutBtn.prop('disabled', true).text('去结算');
            }
        }

        // 选择优惠券
        function selectCoupon() {
            UIUtil.showToast('优惠券功能开发中', 'info');
        }

        // 清空购物车
        function clearCart() {
            if (cartData.length === 0) {
                UIUtil.showToast('购物车已经是空的', 'info');
                return;
            }

            UIUtil.showConfirm('确认清空', '确定要清空购物车吗？', function() {
                CartUtil.clearCart();
                selectedItems.clear();
                loadCartData();
                UIUtil.showToast('购物车已清空', 'success');
            });
        }

        // 去结算
        function checkout() {
            const selectedCartItems = cartData.filter(item => selectedItems.has(item.productId));

            if (selectedCartItems.length === 0) {
                UIUtil.showToast('请选择要结算的商品', 'warning');
                return;
            }

            // 检查是否来自同一商家
            const merchantIds = [...new Set(selectedCartItems.map(item => item.merchantId))];
            if (merchantIds.length > 1) {
                UIUtil.showToast('只能选择同一商家的商品进行结算', 'warning');
                return;
            }

            // 更新购物车（只保留选中的商品）
            CartUtil.clearCart();
            selectedCartItems.forEach(item => {
                CartUtil.addToCart(item, item.quantity);
            });

            // 跳转到订单确认页
            RouterUtil.navigateTo('order-confirm');
        }

        // 定期更新购物车数据
        setInterval(function() {
            const newCartData = CartUtil.getCartData();
            if (newCartData.length !== cartData.length) {
                loadCartData();
            }
        }, 1000);
    });
</script>
</body>
</html>
