<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜索 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <script src="js/utils.js"></script>
    <style>
        body {
            background-color: var(--canvas);
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 84px;
        }

        /* 顶部导航 */
        .search-header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--canvas);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            border: none;
            flex: none;
            transition: background-color var(--transition-base);
        }

        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:active { background: var(--surface-3); }

        .search-title {
            flex: 1;
            text-align: center;
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--ink);
        }

        .header-spacer {
            width: 36px;
            flex: none;
        }

        /* 搜索框 */
        .search-row {
            padding: 14px 18px 6px;
        }

        .search-box {
            display: flex;
            align-items: center;
            gap: 9px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            transition: border-color var(--transition-base);
        }

        .search-box:focus-within {
            border-color: var(--focus-ink);
        }

        .search-box .s-icon {
            width: 18px;
            height: 18px;
            color: var(--muted);
            flex: none;
        }

        .search-input {
            flex: 1;
            min-width: 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 15px;
            color: var(--ink);
        }

        .search-input::placeholder {
            color: var(--muted);
        }

        .clear-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--surface-3);
            color: var(--ink);
            display: none;
            align-items: center;
            justify-content: center;
            flex: none;
            cursor: pointer;
        }

        .clear-btn svg {
            width: 11px;
            height: 11px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 卡片区块 */
        .section-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            margin: 14px 18px 0;
            padding: 16px 18px;
        }

        .section-card:last-of-type {
            margin-bottom: 14px;
        }

        .section-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 13px;
        }

        .section-title {
            font-family: var(--font-serif);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.4px;
            color: var(--ink);
        }

        .clear-history {
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            transition: color var(--transition-base);
        }

        .clear-history:active {
            color: var(--ink);
        }

        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .history-tag,
        .hot-tag {
            background: var(--surface-2);
            color: var(--ink-soft);
            padding: 7px 14px;
            border-radius: var(--radius-full);
            font-size: 13px;
            cursor: pointer;
            transition: background-color var(--transition-base), color var(--transition-base);
        }

        .history-tag:active,
        .hot-tag:active {
            background: var(--surface-3);
            color: var(--ink);
        }

        /* 搜索结果 */
        .search-results {
            display: none;
        }

        .result-header {
            padding: 16px 18px 12px;
            font-size: 13px;
            color: var(--muted);
        }

        .product-list {
            padding: 0 18px;
        }

        .product-item {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            gap: 13px;
            cursor: pointer;
            transition: background-color var(--transition-base), border-color var(--transition-base);
        }

        .product-item:active {
            background: var(--surface-2);
            border-color: var(--line-strong);
        }

        .product-image {
            width: 80px;
            height: 80px;
            border-radius: var(--radius-lg);
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
            color: var(--faint);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-desc {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 8px;
            line-height: 1.45;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 17px;
            font-weight: 600;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.2px;
        }

        .add-to-cart {
            width: 29px;
            height: 29px;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none;
            transition: transform var(--transition-fast), background-color var(--transition-base);
        }

        .add-to-cart svg {
            width: 16px;
            height: 16px;
        }

        .add-to-cart:active {
            transform: scale(0.92);
            background: var(--ink-soft);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--muted);
        }

        .empty-icon {
            width: 46px;
            height: 46px;
            margin: 0 auto 14px;
            color: var(--faint);
        }

        .empty-icon svg {
            width: 46px;
            height: 46px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-text {
            font-size: 14px;
        }

        /* 加载状态 */
        .loading-state {
            text-align: center;
            padding: 56px 20px;
            color: var(--muted);
            display: none;
        }

        .loading-icon {
            width: 26px;
            height: 26px;
            border: 2px solid var(--line);
            border-top-color: var(--ink);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin: 0 auto 14px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 13px;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            height: 72px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            cursor: pointer;
            padding: 7px 2px;
            border-radius: 22px;
            transition: all var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--ink);
            background: var(--surface-3);
            font-weight: 550;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-text {
            font-size: 11px;
            font-weight: 500;
        }

        .cart-badge {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--deadline);
            color: white;
            border-radius: 999px;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: 600;
            min-width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部导航 -->
    <div class="search-header">
        <button class="icon-btn" id="backBtn" onclick="goBack()" aria-label="返回">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <div class="search-title">搜索</div>
        <div class="header-spacer"></div>
    </div>

    <!-- 搜索框 -->
    <div class="search-row">
        <div class="search-box">
            <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索商品、商家">
            <div class="clear-btn" id="clearBtn" role="button" aria-label="清空">
                <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </div>
        </div>
    </div>

    <!-- 搜索历史 -->
    <div class="section-card" id="searchHistory">
        <div class="section-head">
            <h2 class="section-title">搜索历史</h2>
            <div class="clear-history" onclick="clearSearchHistory()">清空</div>
        </div>
        <div class="tag-list" id="historyTags">
            <!-- 历史搜索标签将通过JavaScript动态加载 -->
        </div>
    </div>

    <!-- 热门搜索 -->
    <div class="section-card" id="hotSearch">
        <div class="section-head">
            <h2 class="section-title">热门搜索</h2>
        </div>
        <div class="tag-list" id="hotTags">
            <div class="hot-tag" onclick="searchKeyword('汉堡')">汉堡</div>
            <div class="hot-tag" onclick="searchKeyword('炸鸡')">炸鸡</div>
            <div class="hot-tag" onclick="searchKeyword('奶茶')">奶茶</div>
            <div class="hot-tag" onclick="searchKeyword('披萨')">披萨</div>
            <div class="hot-tag" onclick="searchKeyword('寿司')">寿司</div>
            <div class="hot-tag" onclick="searchKeyword('火锅')">火锅</div>
            <div class="hot-tag" onclick="searchKeyword('烧烤')">烧烤</div>
            <div class="hot-tag" onclick="searchKeyword('麻辣烫')">麻辣烫</div>
        </div>
    </div>

    <!-- 搜索结果 -->
    <div class="search-results" id="searchResults">
        <div class="result-header" id="resultHeader">
            找到 0 个相关商品
        </div>
        <div class="product-list" id="productList">
            <!-- 商品列表将通过JavaScript动态加载 -->
        </div>
    </div>

    <!-- 加载状态 -->
    <div class="loading-state" id="loadingState">
        <div class="loading-icon"></div>
        <div class="loading-text">搜索中...</div>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        </div>
        <div class="empty-text">没有找到相关商品</div>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item" data-page="index">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5L20 11v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
        </div>
        <div class="nav-text">首页</div>
    </div>
    <div class="nav-item active" data-page="search">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        </div>
        <div class="nav-text">搜索</div>
    </div>
    <div class="nav-item cart-badge" data-page="cart">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M3 4h2l2.3 10.6a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L19.5 8H6"/></svg>
            <div class="cart-count" id="cartCount" style="display: none;">0</div>
        </div>
        <div class="nav-text">购物车</div>
    </div>
    <div class="nav-item" data-page="orders">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
        </div>
        <div class="nav-text">订单</div>
    </div>
    <div class="nav-item" data-page="profile">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
        </div>
        <div class="nav-text">我的</div>
    </div>
</div>

<script>
    // 无图时的占位线性图标（餐盘/碗）
    const FOOD_PLACEHOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="#8b99a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';
    // 加入购物车按钮（+）
    const PLUS_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';

    // 页面初始化
    document.addEventListener('DOMContentLoaded', function() {
        init();
    });

    function init() {
        // 加载搜索历史
        loadSearchHistory();

        // 更新购物车数量
        updateCartCount();

        // 绑定事件
        bindEvents();

        // 检查URL参数中是否有搜索关键词
        const keyword = RouterUtil.getUrlParam('keyword');
        if (keyword) {
            document.getElementById('searchInput').value = keyword;
            performSearch();
        }
    }

    function bindEvents() {
        const searchInput = document.getElementById('searchInput');
        const clearBtn = document.getElementById('clearBtn');

        // 搜索输入事件
        searchInput.addEventListener('input', function() {
            const value = this.value.trim();
            clearBtn.style.display = value ? 'flex' : 'none';
        });

        // 回车搜索
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // 清空输入
        clearBtn.addEventListener('click', function() {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            showDefaultContent();
        });

        // 底部导航点击
        document.addEventListener('click', function(e) {
            const navItem = e.target.closest('.nav-item');
            if (navItem) {
                const page = navItem.getAttribute('data-page');
                if (page && page !== 'search') {
                    RouterUtil.navigateTo(page);
                }
            }
        });
    }

    // 执行搜索
    async function performSearch() {
        const keyword = document.getElementById('searchInput').value.trim();
        if (!keyword) {
            UIUtil.showToast('请输入搜索关键词', 'warning');
            return;
        }

        // 保存搜索历史
        saveSearchHistory(keyword);

        // 显示加载状态
        showLoadingState();

        try {
            // 调用搜索API
            const response = await http.get(`/products/search?keyword=${encodeURIComponent(keyword)}`);

            if (response.code === '00000' && response.data) {
                showSearchResults(response.data || [], keyword);
            } else {
                showEmptyState();
            }
        } catch (error) {
            console.error('搜索失败:', error);
            UIUtil.showToast(error.message || '搜索失败，请重试', 'error');
            showEmptyState();
        }
    }

    // 搜索关键词
    function searchKeyword(keyword) {
        document.getElementById('searchInput').value = keyword;
        document.getElementById('clearBtn').style.display = 'flex';
        performSearch();
    }

    // 显示搜索结果
    function showSearchResults(products, keyword) {
        hideAllStates();

        const searchResults = document.getElementById('searchResults');
        const resultHeader = document.getElementById('resultHeader');
        const productList = document.getElementById('productList');

        resultHeader.textContent = `找到 ${products.length} 个相关商品`;

        if (products.length === 0) {
            showEmptyState();
            return;
        }

        // 渲染商品列表
        productList.innerHTML = '';
        products.forEach(product => {
            const productItem = createProductItem(product);
            productList.appendChild(productItem);
        });

        searchResults.style.display = 'block';
    }

    // 创建商品项
    function createProductItem(product) {
        const item = document.createElement('div');
        item.className = 'product-item';
        item.onclick = () => goToProduct(product.id);

        item.innerHTML = `
            <div class="product-image">
                ${product.mainImage ? `<img src="${product.mainImage}" alt="${product.name}" onerror="this.parentNode.innerHTML='${FOOD_PLACEHOLDER}'">` : FOOD_PLACEHOLDER}
            </div>
            <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="product-desc">${product.description || '美味可口，值得品尝'}</div>
                <div class="product-footer">
                    <div class="product-price">¥${(product.price || 0).toFixed(2)}</div>
                    <button class="add-to-cart" onclick="event.stopPropagation(); addToCart(${product.id}, '${product.name}', ${product.price})">${PLUS_ICON}</button>
                </div>
            </div>
        `;

        return item;
    }

    // 显示默认内容
    function showDefaultContent() {
        hideAllStates();
        document.getElementById('searchHistory').style.display = 'block';
        document.getElementById('hotSearch').style.display = 'block';
    }

    // 显示加载状态
    function showLoadingState() {
        hideAllStates();
        document.getElementById('loadingState').style.display = 'block';
    }

    // 显示空状态
    function showEmptyState() {
        hideAllStates();
        document.getElementById('emptyState').style.display = 'block';
    }

    // 隐藏所有状态
    function hideAllStates() {
        document.getElementById('searchHistory').style.display = 'none';
        document.getElementById('hotSearch').style.display = 'none';
        document.getElementById('searchResults').style.display = 'none';
        document.getElementById('loadingState').style.display = 'none';
        document.getElementById('emptyState').style.display = 'none';
    }

    // 加载搜索历史
    function loadSearchHistory() {
        const history = StorageUtil.get('search_history', []);
        const historyTags = document.getElementById('historyTags');

        if (history.length === 0) {
            document.getElementById('searchHistory').style.display = 'none';
            return;
        }

        historyTags.innerHTML = '';
        history.slice(0, 8).forEach(keyword => {
            const tag = document.createElement('div');
            tag.className = 'history-tag';
            tag.textContent = keyword;
            tag.onclick = () => searchKeyword(keyword);
            historyTags.appendChild(tag);
        });
    }

    // 保存搜索历史
    function saveSearchHistory(keyword) {
        let history = StorageUtil.get('search_history', []);

        // 移除已存在的关键词
        history = history.filter(item => item !== keyword);

        // 添加到开头
        history.unshift(keyword);

        // 限制历史记录数量
        if (history.length > 10) {
            history = history.slice(0, 10);
        }

        StorageUtil.set('search_history', history);
        loadSearchHistory();
    }

    // 清空搜索历史
    function clearSearchHistory() {
        UIUtil.showConfirm('确认清空', '确定要清空搜索历史吗？', function() {
            StorageUtil.remove('search_history');
            document.getElementById('searchHistory').style.display = 'none';
            UIUtil.showToast('已清空搜索历史', 'success');
        });
    }

    // 添加到购物车
    function addToCart(productId, productName, price) {
        const product = {
            id: productId,
            name: productName,
            price: price,
            image: null
        };

        CartUtil.addToCart(product, 1);
        UIUtil.showToast(`${productName} 已添加到购物车`, 'success');
        updateCartCount();
    }

    // 更新购物车数量
    function updateCartCount() {
        const count = CartUtil.getCartItemCount();
        const cartCountEl = document.getElementById('cartCount');

        if (count > 0) {
            cartCountEl.textContent = count > 99 ? '99+' : count;
            cartCountEl.style.display = 'flex';
        } else {
            cartCountEl.style.display = 'none';
        }
    }

    // 跳转到商品详情
    function goToProduct(productId) {
        RouterUtil.navigateTo('product', { id: productId });
    }

    // 返回上一页
    function goBack() {
        RouterUtil.goBack();
    }

    // 定期更新购物车数量
    setInterval(updateCartCount, 1000);
</script>
</body>
</html>
