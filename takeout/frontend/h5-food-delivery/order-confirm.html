<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认订单 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background-color: var(--canvas);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 96px; /* 为底部提交栏留出空间 */
        }

        /* 顶部导航 */
        .header-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--canvas);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex: none;
            transition: background-color var(--transition-base);
        }

        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:active { background: var(--surface-3); }

        .header-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions { width: 36px; height: 36px; flex: none; }

        /* 页面内容 */
        .page { padding: 12px; }

        /* 卡片 */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .card:last-child { margin-bottom: 0; }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            border-bottom: 1px solid var(--line);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
        }

        .link-btn {
            background: none;
            border: none;
            padding: 2px;
            font-size: 13px;
            font-weight: 600;
            color: var(--focus-ink);
            cursor: pointer;
        }

        /* 配送地址 */
        .address-list { padding: 6px 8px; }

        .address-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .address-item + .address-item { margin-top: 4px; }

        .address-item.selected { background: var(--surface-3); }

        .address-radio {
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--line-strong);
            border-radius: 50%;
            flex: none;
            margin-top: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-base);
        }

        .address-radio.selected {
            border-color: var(--ink);
            background: var(--ink);
        }

        .address-radio.selected::after {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--surface);
            border-radius: 50%;
        }

        .address-info { flex: 1; min-width: 0; }

        .address-user {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .address-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .address-phone {
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .address-detail {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.5;
            margin-top: 3px;
        }

        .address-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 7px;
        }

        .address-tag {
            padding: 2px 8px;
            background: var(--meeting);
            color: var(--meeting-ink);
            font-size: 12px;
            font-weight: 500;
            border-radius: var(--radius-sm);
        }

        .address-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-left: 8px;
            flex: none;
        }

        .address-action {
            padding: 2px 6px;
            font-size: 13px;
            color: var(--muted);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: color var(--transition-base), background-color var(--transition-base);
        }

        .address-action:hover {
            color: var(--ink);
            background: var(--surface-2);
        }

        /* 地址空状态 */
        .addr-empty {
            text-align: center;
            padding: 32px 20px;
            color: var(--muted);
        }

        .addr-empty-icon {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            color: var(--faint);
        }

        .addr-empty-icon svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .addr-empty-text { font-size: 14px; margin-bottom: 14px; }

        /* 商家信息 */
        .merchant-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 16px 0;
        }

        .merchant-logo {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: none;
            color: var(--faint);
        }

        .merchant-logo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .merchant-details { flex: 1; min-width: 0; }

        .merchant-name {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .merchant-status {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
        }

        .merchant-status .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--meeting);
            flex: none;
        }

        .delivery-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 12px 16px 16px;
            font-size: 13px;
            color: var(--muted);
        }

        .delivery-time { color: var(--ink); font-weight: 500; }

        /* 订单商品 */
        .product-item {
            display: flex;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
        }

        .product-item:last-child { border-bottom: none; }

        .product-image {
            position: relative;
            width: 56px;
            height: 56px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            border: 1px solid var(--line);
            overflow: hidden;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--faint);
        }

        .product-image img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info { flex: 1; min-width: 0; }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-specs {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 8px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 600;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        .product-quantity {
            font-size: 13px;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        /* 配送时间 */
        .time-options {
            display: flex;
            gap: 10px;
            padding: 12px 16px 16px;
        }

        .time-option {
            flex: 1;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 6px;
            padding: 9px 12px;
            border: 1px solid var(--line);
            border-radius: var(--radius-full);
            background: var(--surface);
            cursor: pointer;
            transition: all var(--transition-base);
        }

        .time-option.selected {
            background: var(--ink);
            border-color: var(--ink);
        }

        .time-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
        }

        .time-desc {
            font-size: 13px;
            color: var(--muted);
        }

        .time-option.selected .time-label { color: var(--surface); }
        .time-option.selected .time-desc { color: var(--surface-3); }

        /* 支付方式 */
        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .payment-option:last-child { border-bottom: none; }

        .payment-option.selected { background: var(--surface-3); }

        .payment-radio {
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--line-strong);
            border-radius: 50%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-base);
        }

        .payment-radio.selected {
            border-color: var(--ink);
            background: var(--ink);
        }

        .payment-radio.selected::after {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--surface);
            border-radius: 50%;
        }

        .payment-icon {
            width: 30px;
            height: 30px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }

        .payment-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .payment-info { flex: 1; min-width: 0; }

        .payment-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .payment-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }

        .payment-option.selected .payment-desc { color: var(--ink-soft); }

        /* 订单备注 */
        .remark-input {
            display: block;
            width: 100%;
            min-height: 76px;
            padding: 12px;
            margin: 12px 16px 16px;
            width: calc(100% - 32px);
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            font-size: 14px;
            color: var(--ink);
            background: var(--surface);
            resize: vertical;
            transition: border-color var(--transition-base);
        }

        .remark-input:focus { border-color: var(--focus-ink); }

        .remark-input::placeholder { color: var(--muted); }

        /* 费用明细 */
        .cost-list { padding: 14px 16px 16px; }

        .cost-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .cost-item + .cost-item { margin-top: 10px; }

        .cost-label { color: var(--muted); }

        .cost-value {
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        .cost-item:last-child {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--line);
        }

        .total-cost {
            font-size: 17px;
            font-weight: 600;
            color: var(--deadline);
        }

        /* 底部提交栏 */
        .submit-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1000;
        }

        .submit-info { flex: 1; min-width: 0; }

        .submit-total {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        .submit-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 1px;
        }

        .submit-btn {
            flex: none;
            padding: 13px 26px;
            background: var(--ink);
            color: var(--surface);
            border: none;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 550;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .submit-btn:active { background: var(--ink-soft); }

        .submit-btn:disabled {
            background: var(--line-strong);
            color: var(--surface);
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .product-item { padding: 12px 12px; }
            .product-image { width: 52px; height: 52px; }
        }

        /* 覆盖 utils.js 注入的全局 toast 内联色（白字对比度不足） */
        .toast.toast-error { background-color: var(--error-color) !important; }
        .toast.toast-success { background-color: var(--ink) !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <div class="header-nav">
            <button class="icon-btn" id="backBtn" aria-label="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="header-title">确认订单</div>
            <div class="header-actions"></div>
        </div>

        <div class="page">
            <!-- 配送地址 -->
            <div class="card" id="addressSection">
                <div class="card-head">
                    <div class="card-title">配送地址</div>
                    <button class="link-btn" id="addAddressBtn">新增地址</button>
                </div>
                <div class="address-list" id="addressList">
                    <!-- 地址列表将通过JavaScript动态加载 -->
                </div>
            </div>

            <!-- 商家信息 -->
            <div class="card" id="merchantSection">
                <!-- 商家信息将通过JavaScript动态加载 -->
            </div>

            <!-- 商品列表 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">订单商品</div>
                </div>
                <div id="productsList">
                    <!-- 商品列表将通过JavaScript动态加载 -->
                </div>
            </div>

            <!-- 配送时间 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">配送时间</div>
                </div>
                <div class="time-options" id="timeOptions">
                    <div class="time-option selected" data-type="asap">
                        <span class="time-label">立即配送</span>
                        <span class="time-desc">约30分钟</span>
                    </div>
                    <div class="time-option" data-type="scheduled">
                        <span class="time-label">预约配送</span>
                        <span class="time-desc">选时间</span>
                    </div>
                </div>
            </div>

            <!-- 支付方式 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">支付方式</div>
                </div>
                <div class="payment-options" id="paymentOptions">
                    <div class="payment-option selected" data-method="wechat">
                        <div class="payment-radio selected"></div>
                        <div class="payment-icon">
                            <svg viewBox="0 0 24 24"><path d="M20.5 11.5a7 7 0 0 1-10 6.4l-3.6 1 1-3.2a7 7 0 1 1 12.6-4.2z"/><path d="M9 11.2h.01M15 11.2h.01"/></svg>
                        </div>
                        <div class="payment-info">
                            <div class="payment-name">微信支付</div>
                            <div class="payment-desc">推荐使用微信支付</div>
                        </div>
                    </div>
                    <div class="payment-option" data-method="alipay">
                        <div class="payment-radio"></div>
                        <div class="payment-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M9 8.8l3 3.8 3-3.8"/><path d="M12 12.6V17"/><path d="M9.4 14.6h5.2"/></svg>
                        </div>
                        <div class="payment-info">
                            <div class="payment-name">支付宝</div>
                            <div class="payment-desc">安全便捷的支付方式</div>
                        </div>
                    </div>
                    <div class="payment-option" data-method="balance">
                        <div class="payment-radio"></div>
                        <div class="payment-icon">
                            <svg viewBox="0 0 24 24"><path d="M4 8.5h13.5A2.5 2.5 0 0 1 20 11v0"/><rect x="4" y="8.5" width="16" height="9.5" rx="2.5"/><path d="M20 11h-2.4a1.6 1.6 0 0 0 0 3.2H20"/></svg>
                        </div>
                        <div class="payment-info">
                            <div class="payment-name">余额支付</div>
                            <div class="payment-desc">当前余额：¥0.00</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 订单备注 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">订单备注</div>
                </div>
                <textarea class="remark-input" id="remarkInput" placeholder="请输入订单备注（选填）"></textarea>
            </div>

            <!-- 费用明细 -->
            <div class="card">
                <div class="card-head">
                    <div class="card-title">费用明细</div>
                </div>
                <div class="cost-list">
                    <div class="cost-item">
                        <div class="cost-label">商品小计</div>
                        <div class="cost-value" id="subtotal">¥0.00</div>
                    </div>
                    <div class="cost-item">
                        <div class="cost-label">配送费</div>
                        <div class="cost-value" id="deliveryFee">¥3.00</div>
                    </div>
                    <div class="cost-item">
                        <div class="cost-label">优惠减免</div>
                        <div class="cost-value" id="discount">-¥0.00</div>
                    </div>
                    <div class="cost-item">
                        <div class="cost-label">实付金额</div>
                        <div class="cost-value total-cost" id="totalAmount">¥0.00</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部提交栏 -->
    <div class="submit-bar">
        <div class="submit-info">
            <div class="submit-total" id="submitTotal">¥0.00</div>
            <div class="submit-desc">预计30分钟送达</div>
        </div>
        <button class="submit-btn" id="submitBtn">提交订单</button>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script>
        $(document).ready(function() {
            let cartData = [];
            let selectedAddress = null;
            let selectedDeliveryTime = 'asap';
            let selectedPaymentMethod = 'wechat';
            let merchantInfo = null;

            // 无图时的占位图标（碗）
            const PLACEHOLDER_BOWL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';

            // 初始化页面
            init();

            function init() {
                // 检查登录状态
                if (!AuthUtil.isLoggedIn()) {
                    RouterUtil.navigateTo('login');
                    return;
                }

                // 加载购物车数据
                loadCartData();

                // 加载地址列表
                loadAddressList();

                // 绑定事件
                bindEvents();

                // 计算费用
                calculateCost();
            }

            function bindEvents() {
                // 返回按钮
                $('#backBtn').on('click', function() {
                    RouterUtil.goBack();
                });

                // 新增地址
                $('#addAddressBtn').on('click', function() {
                    addNewAddress();
                });

                // 地址选择
                $(document).on('click', '.address-item', function() {
                    const addressId = $(this).data('address-id');
                    selectAddress(addressId);
                });

                // 地址操作
                $(document).on('click', '.address-action', function(e) {
                    e.stopPropagation();
                    const action = $(this).data('action');
                    const addressId = $(this).closest('.address-item').data('address-id');

                    if (action === 'edit') {
                        editAddress(addressId);
                    } else if (action === 'delete') {
                        deleteAddress(addressId);
                    }
                });

                // 配送时间选择
                $('.time-option').on('click', function() {
                    const timeType = $(this).data('type');
                    selectDeliveryTime(timeType);
                });

                // 支付方式选择
                $('.payment-option').on('click', function() {
                    const paymentMethod = $(this).data('method');
                    selectPaymentMethod(paymentMethod);
                });

                // 提交订单
                $('#submitBtn').on('click', function() {
                    if ($(this).prop('disabled')) return;
                    submitOrder();
                });
            }

            // 加载购物车数据
            function loadCartData() {
                cartData = CartUtil.getCartData();

                if (cartData.length === 0) {
                    UIUtil.showToast('购物车为空，请先添加商品', 'warning');
                    RouterUtil.navigateTo('index');
                    return;
                }

                renderProducts();
                loadMerchantInfo();
            }

            // 渲染商品列表
            function renderProducts() {
                const $container = $('#productsList');
                $container.empty();

                cartData.forEach(item => {
                    const specsText = item.selectedSpecs ?
                        Object.entries(item.selectedSpecs).map(([key, value]) => `${key}: ${value}`).join(', ') : '';

                    const thumb = `
                        <div class="product-image">
                            ${PLACEHOLDER_BOWL}
                            ${item.productImage ? `<img src="${item.productImage}" alt="${item.productName}" onerror="this.remove()">` : ''}
                        </div>`;

                    $container.append(`
                        <div class="product-item">
                            ${thumb}
                            <div class="product-info">
                                <div class="product-name">${item.productName}</div>
                                ${specsText ? `<div class="product-specs">${specsText}</div>` : ''}
                                <div class="product-footer">
                                    <div class="product-price">¥${FormatUtil.formatMoney(item.finalPrice || item.productPrice)}</div>
                                    <div class="product-quantity">x${item.quantity}</div>
                                </div>
                            </div>
                        </div>
                    `);
                });
            }

            // 加载商家信息
            function loadMerchantInfo() {
                if (cartData.length > 0) {
                    const firstItem = cartData[0];
                    merchantInfo = {
                        merchantId: firstItem.merchantId,
                        merchantName: firstItem.merchantName || '商家'
                    };

                    $('#merchantSection').html(`
                        <div class="merchant-info">
                            <div class="merchant-logo">
                                ${PLACEHOLDER_BOWL}
                                ${firstItem.merchantImage ? `<img src="${firstItem.merchantImage}" alt="${merchantInfo.merchantName}" onerror="this.remove()">` : ''}
                            </div>
                            <div class="merchant-details">
                                <div class="merchant-name">${merchantInfo.merchantName}</div>
                                <div class="merchant-status"><span class="dot"></span>营业中</div>
                            </div>
                        </div>
                        <div class="delivery-info">
                            <span>配送费 ¥3.00</span>
                            <span class="delivery-time">约30分钟送达</span>
                        </div>
                    `);
                }
            }

            // 加载地址列表
            async function loadAddressList() {
                try {
                     const response = await http.get('/addresses');

                    if (response.code === '00000' && response.data) {
                        const addresses = response.data.map(addr => ({
                            id: addr.id,
                            name: addr.name,
                            phone: addr.phone,
                            address: `${addr.province}${addr.city}${addr.district}`,
                            detail: addr.detail,
                            tags: [addr.tag || '其他'],
                            isDefault: addr.isDefault
                        }));

                        renderAddressList(addresses);

                        // 默认选择第一个地址
                        if (addresses.length > 0) {
                            const defaultAddress = addresses.find(addr => addr.isDefault) || addresses[0];
                            selectAddress(defaultAddress.id);
                        }
                    } else {
                        console.error('获取地址列表失败:', response.info);
                        renderAddressList([]);
                    }
                } catch (error) {
                    console.error('加载地址列表出错:', error);
                    renderAddressList([]);
                }
            }

            // 渲染地址列表
            function renderAddressList(addresses) {
                const $container = $('#addressList');
                $container.empty();

                if (addresses.length === 0) {
                    $container.append(`
                        <div class="addr-empty">
                            <div class="addr-empty-icon">
                                <svg viewBox="0 0 24 24"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
                            </div>
                            <div class="addr-empty-text">暂无配送地址</div>
                            <button class="btn btn-primary btn-small" id="addFirstAddress">添加地址</button>
                        </div>
                    `);
                    return;
                }

                addresses.forEach(address => {
                    const isSelected = selectedAddress && selectedAddress.id === address.id;

                    $container.append(`
                        <div class="address-item ${isSelected ? 'selected' : ''}" data-address-id="${address.id}">
                            <div class="address-radio ${isSelected ? 'selected' : ''}"></div>
                            <div class="address-info">
                                <div class="address-user">
                                    <div class="address-name">${address.name}</div>
                                    <div class="address-phone">${address.phone}</div>
                                </div>
                                <div class="address-detail">${address.address} ${address.detail}</div>
                                <div class="address-tags">
                                    ${address.tags.map(tag => `<span class="address-tag">${tag}</span>`).join('')}
                                    ${address.isDefault ? '<span class="address-tag">默认</span>' : ''}
                                </div>
                            </div>
                            <div class="address-actions">
                                <div class="address-action" data-action="edit">编辑</div>
                                <div class="address-action" data-action="delete">删除</div>
                            </div>
                        </div>
                    `);
                });
            }

            // 选择地址
            function selectAddress(addressId) {
                // 从当前渲染的地址列表中查找选中的地址
                const $selectedItem = $(`.address-item[data-address-id="${addressId}"]`);
                if ($selectedItem.length > 0) {
                    // 构建选中的地址对象
                    selectedAddress = {
                        id: Number(addressId), // 确保id是数字类型
                        name: $selectedItem.find('.address-name').text(),
                        phone: $selectedItem.find('.address-phone').text(),
                        address: $selectedItem.find('.address-detail').text().split(' ')[0] || '',
                        detail: $selectedItem.find('.address-detail').text().split(' ').slice(1).join(' ') || ''
                    };
                }

                // 更新UI
                $('.address-item').removeClass('selected');
                $('.address-radio').removeClass('selected');

                $(`.address-item[data-address-id="${addressId}"]`).addClass('selected');
                $(`.address-item[data-address-id="${addressId}"] .address-radio`).addClass('selected');
            }

            // 选择配送时间
            function selectDeliveryTime(timeType) {
                selectedDeliveryTime = timeType;

                $('.time-option').removeClass('selected');
                $(`.time-option[data-type="${timeType}"]`).addClass('selected');

                if (timeType === 'scheduled') {
                    // 这里可以弹出时间选择器
                    UIUtil.showToast('预约配送功能开发中', 'info');
                }
            }

            // 选择支付方式
            function selectPaymentMethod(paymentMethod) {
                selectedPaymentMethod = paymentMethod;

                $('.payment-option').removeClass('selected');
                $('.payment-radio').removeClass('selected');

                $(`.payment-option[data-method="${paymentMethod}"]`).addClass('selected');
                $(`.payment-option[data-method="${paymentMethod}"] .payment-radio`).addClass('selected');
            }

            // 计算费用
            function calculateCost() {
                const subtotal = cartData.reduce((sum, item) => {
                    return sum + (item.finalPrice || item.productPrice) * item.quantity;
                }, 0);

                const deliveryFee = 3; // 配送费
                const discount = 0; // 优惠金额
                const total = subtotal + deliveryFee - discount;

                // 更新费用显示
                $('#subtotal').text(`¥${FormatUtil.formatMoney(subtotal)}`);
                $('#deliveryFee').text(`¥${FormatUtil.formatMoney(deliveryFee)}`);
                $('#discount').text(`-¥${FormatUtil.formatMoney(discount)}`);
                $('#totalAmount').text(`¥${FormatUtil.formatMoney(total)}`);
                $('#submitTotal').text(`¥${FormatUtil.formatMoney(total)}`);
            }

            // 新增地址
            function addNewAddress() {
                RouterUtil.navigateTo('address-edit');
            }

            // 编辑地址
            function editAddress(addressId) {
                RouterUtil.navigateTo('address-edit', { id: addressId });
            }

            // 删除地址
            function deleteAddress(addressId) {
                UIUtil.showConfirm('确定要删除这个地址吗？', async function() {
                    try {
                        const response = await http.delete(`/addresses/${addressId}`);

                        if (response.code === '00000') {
                            UIUtil.showToast('地址删除成功', 'success');
                            // 重新加载地址列表
                            loadAddressList();
                        } else {
                            UIUtil.showToast(response.info || '删除失败', 'error');
                        }
                    } catch (error) {
                        console.error('删除地址失败:', error);
                        UIUtil.showToast('删除失败，请稍后重试', 'error');
                    }
                });
            }

            // 提交订单
            function submitOrder() {
                // 验证必填信息
                if (!selectedAddress) {
                    UIUtil.showToast('请选择配送地址', 'warning');
                    return;
                }

                if (!selectedPaymentMethod) {
                    UIUtil.showToast('请选择支付方式', 'warning');
                    return;
                }

                if (cartData.length === 0) {
                    UIUtil.showToast('购物车为空', 'warning');
                    return;
                }

                // 验证商家信息
                if (!merchantInfo || !merchantInfo.merchantId) {
                    UIUtil.showToast('商家信息异常，请重新选择商品', 'error');
                    return;
                }

                // 验证商品信息
                const invalidItems = cartData.filter(item =>
                    !item.productId || !item.quantity || item.quantity <= 0 ||
                    !item.productPrice || item.productPrice <= 0
                );

                if (invalidItems.length > 0) {
                    UIUtil.showToast('商品信息异常，请重新添加商品', 'error');
                    return;
                }

                // 检查用户登录状态
                if (!AuthUtil.isLoggedIn()) {
                    UIUtil.showToast('请先登录', 'warning');
                    RouterUtil.navigateTo('login');
                    return;
                }

                // 计算费用
                const subtotal = cartData.reduce((sum, item) => {
                    return sum + (item.finalPrice || item.productPrice) * item.quantity;
                }, 0);
                const deliveryFee = 3; // 配送费

                // 构建订单数据，符合CreateOrderRequestDTO格式
                const orderData = {
                    merchantId: Number(merchantInfo.merchantId),
                    addressId: Number(selectedAddress.id),
                    items: cartData.map(item => ({
                        productId: Number(item.productId),
                        skuId: item.skuId || item.productId,
                        skuName: item.skuName || item.productName,
                        quantity: Number(item.quantity),
                        price: Number(item.finalPrice || item.productPrice),
                        remark: item.remark || ''
                    })),
                    deliveryFee: Number(deliveryFee),
                    remark: $('#remarkInput').val().trim() || '',
                    deliveryType: selectedDeliveryTime === 'scheduled' ? 2 : 1,
                    expectedDeliveryTime: selectedDeliveryTime === 'scheduled' ? new Date(Date.now() + 60 * 60 * 1000).toISOString() : null,
                    tablewareCount: 1,
                    invoiceType: 0
                };

                console.log('提交订单数据:', orderData);

                // 显示加载状态
                const $submitBtn = $('#submitBtn');
                const originalText = $submitBtn.text();
                $submitBtn.prop('disabled', true).text('提交中...');

                // 调用后端API提交订单
                http.post('/orders', orderData)
                    .then(response => {
                        console.log('订单提交成功:', response);

                        if (response.code === '00000') {
                            // 清空购物车
                            CartUtil.clearCart();

                            // 跳转到支付页面
                            RouterUtil.navigateTo('payment', {
                                orderId: response.data.id,
                                orderNo: response.data.orderNo,
                                amount: response.data.actualAmount
                            });

                            UIUtil.showToast('订单提交成功', 'success');
                        } else {
                            UIUtil.showToast(response.info || '订单提交失败', 'error');
                            $submitBtn.prop('disabled', false).text(originalText);
                        }
                    })
                    .catch(error => {
                        console.error('订单提交失败:', error);

                        let errorMessage = '网络错误，请稍后重试';
                        let shouldNavigateToLogin = false;

                        if (error.message) {
                            const message = error.message.toLowerCase();

                            // 认证相关错误
                            if (message.includes('401') || message.includes('未登录') ||
                                message.includes('token') || message.includes('unauthorized')) {
                                errorMessage = '登录已过期，请重新登录';
                                shouldNavigateToLogin = true;
                            }
                            // 参数验证错误
                            else if (message.includes('400') || message.includes('参数') ||
                                     message.includes('validation') || message.includes('invalid')) {
                                errorMessage = '订单信息有误，请检查后重试';
                            }
                            // 服务器错误
                            else if (message.includes('500') || message.includes('服务器')) {
                                errorMessage = '服务器繁忙，请稍后重试';
                            }
                            // 网络连接错误
                            else if (message.includes('network') || message.includes('fetch') ||
                                     message.includes('timeout') || message.includes('连接')) {
                                errorMessage = '网络连接异常，请检查网络后重试';
                            }
                            // 其他业务错误
                            else {
                                errorMessage = error.message;
                            }
                        }

                        // 检查网络状态
                        if (!navigator.onLine) {
                            errorMessage = '网络连接已断开，请检查网络设置';
                        }

                        UIUtil.showToast(errorMessage, 'error');

                        if (shouldNavigateToLogin) {
                            setTimeout(() => {
                                AuthUtil.logout();
                                RouterUtil.navigateTo('login');
                            }, 2000);
                        } else {
                            $submitBtn.prop('disabled', false).text(originalText);
                        }
                    });
            }
        });
    </script>
</body>
</html>
