<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付订单 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background-color: var(--canvas);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 96px;
        }

        /* 顶部导航 */
        .header-nav {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: var(--canvas);
            border-bottom: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex: none;
            transition: background-color var(--transition-base);
        }

        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:active { background: var(--surface-3); }

        .header-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions { width: 36px; height: 36px; flex: none; }

        /* 页面内容 */
        .page { padding: 12px; }

        /* 卡片 */
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            overflow: hidden;
        }

        .card:last-child { margin-bottom: 0; }

        .card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 16px;
            border-bottom: 1px solid var(--line);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
        }

        .status-pill {
            padding: 3px 10px;
            background: var(--meeting);
            color: var(--meeting-ink);
            font-size: 12px;
            font-weight: 600;
            border-radius: var(--radius-full);
        }

        /* 订单信息 */
        .order-details { padding: 14px 16px 16px; }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 14px;
        }

        .order-item + .order-item { margin-top: 10px; }

        .order-label { color: var(--muted); }

        .order-value {
            color: var(--ink);
            font-weight: 500;
            text-align: right;
        }

        .order-amount {
            font-size: 17px;
            font-weight: 600;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        /* 商家信息 */
        .merchant-info {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px;
        }

        .merchant-logo {
            position: relative;
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            background: var(--surface-2);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: none;
            color: var(--faint);
        }

        .merchant-logo img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .merchant-details { flex: 1; min-width: 0; }

        .merchant-name {
            font-family: var(--font-serif);
            font-size: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: var(--ink);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .merchant-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 3px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 订单商品（动态渲染） */
        .sub-divider {
            margin-top: 14px;
            padding: 14px 16px 0;
            border-top: 1px solid var(--line);
        }

        .sub-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .item-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
        }

        .item-line + .item-line { margin-top: 6px; }

        .item-line .name { color: var(--muted); }
        .item-line .price {
            color: var(--deadline);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .addr-line {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
        }

        /* 支付方式 */
        .payment-option {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .payment-option:last-child { border-bottom: none; }

        .payment-option.selected { background: var(--surface-3); }

        .payment-radio {
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--line-strong);
            border-radius: 50%;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-base);
        }

        .payment-radio.selected {
            border-color: var(--ink);
            background: var(--ink);
        }

        .payment-radio.selected::after {
            content: '';
            width: 7px;
            height: 7px;
            background: var(--surface);
            border-radius: 50%;
        }

        .payment-icon {
            width: 30px;
            height: 30px;
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }

        .payment-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .payment-info { flex: 1; min-width: 0; }

        .payment-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--ink);
        }

        .payment-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 2px;
        }

        .payment-option.selected .payment-desc { color: var(--ink-soft); }

        .payment-balance { color: var(--deadline); font-weight: 600; }

        /* 优惠明细 */
        .link-btn {
            background: none;
            border: none;
            padding: 2px;
            font-size: 13px;
            font-weight: 600;
            color: var(--focus-ink);
            cursor: pointer;
        }

        .coupon-list { padding: 14px 16px 16px; }

        .coupon-item {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 14px;
        }

        .coupon-item + .coupon-item { margin-top: 10px; }

        .coupon-label { color: var(--muted); }

        .coupon-value {
            color: var(--ink);
            font-variant-numeric: tabular-nums;
        }

        /* 安全保障 */
        .security-tips { padding: 16px; }

        .security-title {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 10px;
        }

        .security-title svg {
            width: 17px;
            height: 17px;
            color: var(--ink);
            flex: none;
        }

        .security-list {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .security-item {
            position: relative;
            padding-left: 14px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.55;
        }

        .security-item::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 8px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--line-strong);
        }

        /* 底部支付栏 */
        .payment-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            z-index: 1000;
        }

        .bar-info { flex: 1; min-width: 0; }

        .bar-amount {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        .bar-desc {
            font-size: 13px;
            color: var(--muted);
            margin-top: 1px;
        }

        .pay-btn {
            flex: none;
            padding: 13px 26px;
            background: var(--ink);
            color: var(--surface);
            border: none;
            border-radius: var(--radius-full);
            font-size: 15px;
            font-weight: 550;
            letter-spacing: 0.2px;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .pay-btn:active { background: var(--ink-soft); }

        .pay-btn:disabled {
            background: var(--line-strong);
            color: var(--surface);
            cursor: not-allowed;
        }

        /* 支付密码弹窗 */
        .password-modal {
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: opacity var(--transition-slow), visibility var(--transition-slow);
            padding: 20px;
        }

        .password-modal.show {
            opacity: 1;
            visibility: visible;
        }

        .password-content {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 320px;
            transform: translateY(16px);
            transition: transform var(--transition-slow);
        }

        .password-modal.show .password-content { transform: translateY(0); }

        .password-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .password-title {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            margin-bottom: 6px;
        }

        .password-amount {
            font-family: var(--font-serif);
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
        }

        .password-dots {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 22px;
        }

        .password-dot {
            width: 12px;
            height: 12px;
            border: 1.5px solid var(--line-strong);
            border-radius: 50%;
            transition: background-color var(--transition-fast), border-color var(--transition-fast);
        }

        .password-dot.filled {
            background: var(--ink);
            border-color: var(--ink);
        }

        .password-keyboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .keyboard-btn {
            aspect-ratio: 1;
            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--surface);
            font-size: 19px;
            font-weight: 600;
            color: var(--ink);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color var(--transition-fast);
            font-variant-numeric: tabular-nums;
        }

        .keyboard-btn:hover { background: var(--surface-2); }
        .keyboard-btn:active { background: var(--surface-3); }

        .keyboard-btn.delete {
            background: var(--surface-2);
            color: var(--muted);
        }

        .password-actions {
            display: flex;
            gap: 12px;
        }

        .password-cancel {
            flex: 1;
            padding: 12px;
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .password-cancel:hover { background: var(--surface-3); }

        .password-confirm {
            flex: 1;
            padding: 12px;
            background: var(--ink);
            color: var(--surface);
            border: none;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .password-confirm:hover { background: var(--ink-soft); }

        .password-confirm:disabled {
            background: var(--line-strong);
            color: var(--surface);
            cursor: not-allowed;
        }

        /* 支付结果 */
        .payment-result {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--canvas);
            z-index: 1500;
        }

        .result-content {
            height: 100vh;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .result-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 22px;
            background: var(--surface);
            border: 1px solid var(--line);
        }

        .result-icon svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .result-icon.success { color: var(--success-color); }
        .result-icon.failed { color: var(--error-color); }

        .result-title {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--ink);
            margin-bottom: 8px;
        }

        .result-desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 36px;
        }

        .result-actions {
            display: flex;
            gap: 12px;
            width: 100%;
            max-width: 300px;
        }

        .result-btn {
            flex: 1;
            padding: 13px;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            border: none;
            transition: background-color var(--transition-base);
        }

        .result-btn.primary {
            background: var(--ink);
            color: var(--surface);
        }

        .result-btn.primary:hover { background: var(--ink-soft); }

        .result-btn.secondary {
            background: var(--surface-2);
            color: var(--ink);
            border: 1px solid var(--line);
        }

        .result-btn.secondary:hover { background: var(--surface-3); }

        @media (max-width: 480px) {
            .keyboard-btn { font-size: 17px; }
        }

        /* 覆盖 utils.js 注入的全局 toast 内联色（白字对比度不足） */
        .toast.toast-error { background-color: var(--error-color) !important; }
        .toast.toast-success { background-color: var(--ink) !important; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <div class="header-nav">
            <button class="icon-btn" id="backBtn" aria-label="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="header-title">支付订单</div>
            <div class="header-actions"></div>
        </div>

        <div class="page">
            <!-- 支付页面内容 -->
            <div id="paymentContent">
                <!-- 订单信息 -->
                <div class="card">
                    <div class="card-head">
                        <div class="card-title">订单信息</div>
                        <div class="status-pill">待支付</div>
                    </div>
                    <div class="order-details">
                        <div class="order-item">
                            <div class="order-label">订单编号</div>
                            <div class="order-value" id="orderNumber">-</div>
                        </div>
                        <div class="order-item">
                            <div class="order-label">下单时间</div>
                            <div class="order-value" id="orderTime">-</div>
                        </div>
                        <div class="order-item">
                            <div class="order-label">支付金额</div>
                            <div class="order-value order-amount" id="orderAmount">¥0.00</div>
                        </div>
                    </div>
                </div>

                <!-- 商家信息 -->
                <div class="card" id="merchantInfo">
                    <!-- 商家信息将通过JavaScript动态加载 -->
                </div>

                <!-- 支付方式 -->
                <div class="card">
                    <div class="card-head">
                        <div class="card-title">选择支付方式</div>
                    </div>
                    <div class="payment-option selected" data-method="wechat">
                        <div class="payment-radio selected"></div>
                        <div class="payment-icon">
                            <svg viewBox="0 0 24 24"><path d="M20.5 11.5a7 7 0 0 1-10 6.4l-3.6 1 1-3.2a7 7 0 1 1 12.6-4.2z"/><path d="M9 11.2h.01M15 11.2h.01"/></svg>
                        </div>
                        <div class="payment-info">
                            <div class="payment-name">微信支付</div>
                            <div class="payment-desc">推荐使用微信支付，安全便捷</div>
                        </div>
                    </div>
                    <div class="payment-option" data-method="alipay">
                        <div class="payment-radio"></div>
                        <div class="payment-icon">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/><path d="M9 8.8l3 3.8 3-3.8"/><path d="M12 12.6V17"/><path d="M9.4 14.6h5.2"/></svg>
                        </div>
                        <div class="payment-info">
                            <div class="payment-name">支付宝</div>
                            <div class="payment-desc">支持花呗、余额宝等多种方式</div>
                        </div>
                    </div>
                    <div class="payment-option" data-method="balance">
                        <div class="payment-radio"></div>
                        <div class="payment-icon">
                            <svg viewBox="0 0 24 24"><path d="M4 8.5h13.5A2.5 2.5 0 0 1 20 11v0"/><rect x="4" y="8.5" width="16" height="9.5" rx="2.5"/><path d="M20 11h-2.4a1.6 1.6 0 0 0 0 3.2H20"/></svg>
                        </div>
                        <div class="payment-info">
                            <div class="payment-name">余额支付</div>
                            <div class="payment-desc">当前余额：<span class="payment-balance">¥168.50</span></div>
                        </div>
                    </div>
                </div>

                <!-- 优惠信息 -->
                <div class="card">
                    <div class="card-head">
                        <div class="card-title">优惠明细</div>
                        <button class="link-btn" id="selectCoupon">选择优惠券</button>
                    </div>
                    <div class="coupon-list">
                        <div class="coupon-item">
                            <div class="coupon-label">商品小计</div>
                            <div class="coupon-value" id="subtotalAmount">¥0.00</div>
                        </div>
                        <div class="coupon-item">
                            <div class="coupon-label">配送费</div>
                            <div class="coupon-value" id="deliveryFeeAmount">¥3.00</div>
                        </div>
                        <div class="coupon-item">
                            <div class="coupon-label">优惠减免</div>
                            <div class="coupon-value" id="discountAmount">-¥0.00</div>
                        </div>
                    </div>
                </div>

                <!-- 安全提示 -->
                <div class="card">
                    <div class="security-tips">
                        <div class="security-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
                            安全保障
                        </div>
                        <div class="security-list">
                            <div class="security-item">支付过程采用 SSL 加密技术，保障您的资金安全</div>
                            <div class="security-item">支持 7 天无理由退款，让您购物无忧</div>
                            <div class="security-item">24 小时客服在线，随时为您解决问题</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 支付结果页面 -->
    <div class="payment-result" id="paymentResult">
        <div class="result-content">
            <div class="result-icon success" id="resultIcon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/></svg>
            </div>
            <div class="result-title" id="resultTitle">支付成功</div>
            <div class="result-desc" id="resultDesc">您的订单已提交，商家正在准备中</div>
            <div class="result-actions">
                <button class="result-btn primary" id="viewOrderBtn">查看订单</button>
                <button class="result-btn secondary" id="continueShoppingBtn">继续购物</button>
            </div>
        </div>
    </div>

    <!-- 底部支付栏 -->
    <div class="payment-bar" id="paymentBar">
        <div class="bar-info">
            <div class="bar-amount" id="paymentAmount">¥0.00</div>
            <div class="bar-desc">实付金额</div>
        </div>
        <button class="pay-btn" id="payBtn">立即支付</button>
    </div>

    <!-- 支付密码弹窗 -->
    <div class="password-modal" id="passwordModal">
        <div class="password-content">
            <div class="password-header">
                <div class="password-title">请输入支付密码</div>
                <div class="password-amount" id="passwordAmount">¥0.00</div>
            </div>
            <div class="password-input-area">
                <div class="password-dots" id="passwordDots">
                    <div class="password-dot"></div>
                    <div class="password-dot"></div>
                    <div class="password-dot"></div>
                    <div class="password-dot"></div>
                    <div class="password-dot"></div>
                    <div class="password-dot"></div>
                </div>
                <div class="password-keyboard" id="passwordKeyboard">
                    <div class="keyboard-btn" data-key="1">1</div>
                    <div class="keyboard-btn" data-key="2">2</div>
                    <div class="keyboard-btn" data-key="3">3</div>
                    <div class="keyboard-btn" data-key="4">4</div>
                    <div class="keyboard-btn" data-key="5">5</div>
                    <div class="keyboard-btn" data-key="6">6</div>
                    <div class="keyboard-btn" data-key="7">7</div>
                    <div class="keyboard-btn" data-key="8">8</div>
                    <div class="keyboard-btn" data-key="9">9</div>
                    <div class="keyboard-btn" data-key="0">0</div>
                    <div class="keyboard-btn delete" data-key="delete" aria-label="删除"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12.5 10l4.5 5M17 10l-4.5 5"/></svg></div>
                </div>
            </div>
            <div class="password-actions">
                <button class="password-cancel" id="passwordCancel">取消</button>
                <button class="password-confirm" id="passwordConfirm" disabled>确认支付</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script>
        $(document).ready(function() {
            let orderData = null;
            let selectedPaymentMethod = 'wechat';
            let paymentPassword = '';
            let orderAmount = 0;

            // 无图占位与结果图标
            const PLACEHOLDER_BOWL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:28px;height:28px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';
            const RESULT_SUCCESS_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.4l2.6 2.6L16 9.6"/></svg>';
            const RESULT_FAILED_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';

            // 初始化页面
            init();

            function init() {
                // 检查登录状态
                if (!AuthUtil.isLoggedIn()) {
                    RouterUtil.navigateTo('login');
                    return;
                }

                // 获取订单信息
                loadOrderInfo();

                // 绑定事件
                bindEvents();
            }

            function bindEvents() {
                // 返回按钮
                $('#backBtn').on('click', function() {
                    RouterUtil.goBack();
                });

                // 支付方式选择
                $('.payment-option').on('click', function() {
                    const paymentMethod = $(this).data('method');
                    selectPaymentMethod(paymentMethod);
                });

                // 选择优惠券
                $('#selectCoupon').on('click', function() {
                    selectCoupon();
                });

                // 立即支付
                $('#payBtn').on('click', function() {
                    if ($(this).prop('disabled')) return;
                    startPayment();
                });

                // 支付密码相关
                $('.keyboard-btn').on('click', function() {
                    const key = $(this).data('key');
                    handlePasswordInput(key);
                });

                $('#passwordCancel').on('click', function() {
                    hidePasswordModal();
                });

                $('#passwordConfirm').on('click', function() {
                    if ($(this).prop('disabled')) return;
                    confirmPayment();
                });

                // 支付结果页面
                $('#viewOrderBtn').on('click', function() {
                    RouterUtil.navigateTo('orders');
                });

                $('#continueShoppingBtn').on('click', function() {
                    RouterUtil.navigateTo('index');
                });

                // 点击模态框背景关闭
                $('#passwordModal').on('click', function(e) {
                    if (e.target === this) {
                        hidePasswordModal();
                    }
                });
            }

            // 加载订单信息
            function loadOrderInfo() {
                // 从URL参数获取订单信息
                const urlParams = new URLSearchParams(window.location.search);
                const orderId = urlParams.get('orderId');
                const orderNo = urlParams.get('orderNo');
                const amount = parseFloat(urlParams.get('amount')) || 0.00;

                if (!orderId) {
                    UIUtil.showToast('订单信息异常，请重新下单', 'error');
                    RouterUtil.navigateTo('index');
                    return;
                }

                // 显示加载状态
                UIUtil.showLoading('加载订单信息...');

                // 从后端API获取完整订单信息
                http.get(`/orders/${orderId}`)
                    .then(response => {
                        UIUtil.hideLoading();

                        if (response.code === '00000' && response.data) {
                            const order = response.data;

                            // 构建订单数据
                            orderData = {
                                orderId: order.id,
                                orderNumber: order.orderNo,
                                orderTime: FormatUtil.formatTime(new Date(order.createTime)),
                                merchantName: order.merchantName || '商家',
                                merchantId: order.merchantId,
                                items: order.items || [],
                                address: order.address,
                                subtotal: order.productAmount || 0.00,
                                deliveryFee: order.deliveryFee || 0.00,
                                discount: order.discountAmount || 0.00,
                                totalAmount: order.actualAmount || 0.00,
                                status: order.status
                            };

                            orderAmount = orderData.totalAmount;

                            // 更新页面显示
                            updateOrderDisplay();
                        } else {
                            UIUtil.showToast(response.info || '获取订单信息失败', 'error');
                            RouterUtil.goBack();
                        }
                    })
                    .catch(error => {
                        UIUtil.hideLoading();
                        console.error('获取订单信息失败:', error);

                        let errorMessage = '获取订单信息失败';
                        let shouldNavigateToLogin = false;

                        if (error && error.message) {
                            const message = error.message.toLowerCase();

                            // 认证相关错误
                            if (message.includes('401') || message.includes('未登录') ||
                                message.includes('token') || message.includes('unauthorized')) {
                                errorMessage = '登录已过期，请重新登录';
                                shouldNavigateToLogin = true;
                            }
                            // 参数验证错误
                            else if (message.includes('400') || message.includes('参数') ||
                                     message.includes('validation') || message.includes('invalid')) {
                                errorMessage = '订单信息有误，请检查后重试';
                            }
                            // 服务器错误
                            else if (message.includes('500') || message.includes('服务器')) {
                                errorMessage = '服务器繁忙，请稍后重试';
                            }
                            // 网络连接错误
                            else if (message.includes('network') || message.includes('fetch') ||
                                     message.includes('timeout') || message.includes('连接')) {
                                errorMessage = '网络连接异常，请检查网络后重试';
                            }
                            // 其他业务错误
                            else {
                                errorMessage = error.message;
                            }
                        }

                        // 检查网络状态
                        if (!navigator.onLine) {
                            errorMessage = '网络连接已断开，请检查网络设置';
                        }

                        UIUtil.showToast(errorMessage, 'error');

                        if (shouldNavigateToLogin) {
                            setTimeout(() => {
                                AuthUtil.logout();
                                RouterUtil.navigateTo('login');
                            }, 2000);
                        } else {
                            // 如果不是认证错误，使用URL参数的基本信息作为备用
                            orderData = {
                                orderId: orderId,
                                orderNumber: orderNo || `FD${orderId}`,
                                orderTime: FormatUtil.formatTime(new Date()),
                                merchantName: '商家',
                                subtotal: amount > 0 ? (amount - 3.00) : 0.00,
                                deliveryFee: 3.00,
                                discount: 0.00,
                                totalAmount: amount
                            };

                            orderAmount = orderData.totalAmount;
                            updateOrderDisplay();
                        }
                    });
            }

            // 更新订单显示
            function updateOrderDisplay() {
                $('#orderNumber').text(orderData.orderNumber);
                $('#orderTime').text(orderData.orderTime);
                $('#orderAmount').text(`¥${FormatUtil.formatMoney(orderData.totalAmount)}`);
                $('#paymentAmount').text(`¥${FormatUtil.formatMoney(orderData.totalAmount)}`);
                $('#passwordAmount').text(`¥${FormatUtil.formatMoney(orderData.totalAmount)}`);

                // 更新费用明细
                $('#subtotalAmount').text(`¥${FormatUtil.formatMoney(orderData.subtotal)}`);
                $('#deliveryFeeAmount').text(`¥${FormatUtil.formatMoney(orderData.deliveryFee)}`);
                $('#discountAmount').text(`-¥${FormatUtil.formatMoney(orderData.discount)}`);

                // 更新商家信息
                let merchantHtml = `
                    <div class="merchant-info">
                        <div class="merchant-logo">
                            ${PLACEHOLDER_BOWL}
                        </div>
                        <div class="merchant-details">
                            <div class="merchant-name">${orderData.merchantName}</div>
                            <div class="merchant-desc">订单号：${orderData.orderNumber}</div>
                        </div>
                    </div>
                `;

                // 如果有商品信息，显示商品详情
                if (orderData.items && orderData.items.length > 0) {
                    merchantHtml += `
                        <div class="sub-divider">
                            <div class="sub-title">订单商品</div>
                            ${orderData.items.map(item => `
                                <div class="item-line">
                                    <span class="name">${item.skuName || item.productName} x${item.quantity}</span>
                                    <span class="price">¥${FormatUtil.formatMoney(item.price * item.quantity)}</span>
                                </div>
                            `).join('')}
                        </div>
                    `;
                }

                // 如果有地址信息，显示配送地址
                if (orderData.address) {
                    const addr = orderData.address;
                    const addrText = typeof addr === 'string'
                        ? addr
                        : `${addr.receiverName || ''} ${addr.receiverPhone || ''}<br>${addr.address || ''}`;
                    merchantHtml += `
                        <div class="sub-divider">
                            <div class="sub-title">配送地址</div>
                            <div class="addr-line">${addrText}</div>
                        </div>
                    `;
                }

                $('#merchantInfo').html(merchantHtml);
            }

            // 选择支付方式
            function selectPaymentMethod(paymentMethod) {
                selectedPaymentMethod = paymentMethod;

                $('.payment-option').removeClass('selected');
                $('.payment-radio').removeClass('selected');

                $(`.payment-option[data-method="${paymentMethod}"]`).addClass('selected');
                $(`.payment-option[data-method="${paymentMethod}"] .payment-radio`).addClass('selected');
            }

            // 选择优惠券
            function selectCoupon() {
                UIUtil.showToast('优惠券功能开发中', 'info');
            }

            // 开始支付
            function startPayment() {
                if (orderAmount <= 0) {
                    UIUtil.showToast('支付金额有误', 'error');
                    return;
                }

                // 根据支付方式处理
                switch (selectedPaymentMethod) {
                    case 'wechat':
                        // 微信支付
                        processWechatPayment();
                        break;
                    case 'alipay':
                        // 支付宝支付
                        processAlipayPayment();
                        break;
                    case 'balance':
                        // 余额支付
                        showPasswordModal();
                        break;
                    default:
                        UIUtil.showToast('请选择支付方式', 'warning');
                }
            }

            // 微信支付
            function processWechatPayment() {
                UIUtil.showToast('正在跳转微信支付...', 'info');

                // 模拟支付过程
                setTimeout(() => {
                    // 模拟支付成功
                    showPaymentResult(true, '微信支付成功');
                }, 2000);
            }

            // 支付宝支付
            function processAlipayPayment() {
                UIUtil.showToast('正在跳转支付宝...', 'info');

                // 模拟支付过程
                setTimeout(() => {
                    // 模拟支付成功
                    showPaymentResult(true, '支付宝支付成功');
                }, 2000);
            }

            // 显示支付密码弹窗
            function showPasswordModal() {
                paymentPassword = '';
                updatePasswordDots();
                $('#passwordModal').addClass('show');
                $('body').css('overflow', 'hidden');
            }

            // 隐藏支付密码弹窗
            function hidePasswordModal() {
                $('#passwordModal').removeClass('show');
                $('body').css('overflow', 'auto');
                paymentPassword = '';
                updatePasswordDots();
            }

            // 处理密码输入
            function handlePasswordInput(key) {
                if (key === 'delete') {
                    if (paymentPassword.length > 0) {
                        paymentPassword = paymentPassword.slice(0, -1);
                    }
                } else {
                    if (paymentPassword.length < 6) {
                        paymentPassword += key;
                    }
                }

                updatePasswordDots();

                // 自动提交
                if (paymentPassword.length === 6) {
                    setTimeout(() => {
                        confirmPayment();
                    }, 300);
                }
            }

            // 更新密码点显示
            function updatePasswordDots() {
                const $dots = $('.password-dot');
                $dots.removeClass('filled');

                for (let i = 0; i < paymentPassword.length; i++) {
                    $dots.eq(i).addClass('filled');
                }

                // 更新确认按钮状态
                const $confirmBtn = $('#passwordConfirm');
                if (paymentPassword.length === 6) {
                    $confirmBtn.prop('disabled', false);
                } else {
                    $confirmBtn.prop('disabled', true);
                }
            }

            // 确认支付
            function confirmPayment() {
                if (paymentPassword.length !== 6) {
                    UIUtil.showToast('请输入6位支付密码', 'warning');
                    return;
                }

                // 显示支付中状态
                $('#passwordConfirm').prop('disabled', true).text('支付中...');

                // 模拟支付验证
                setTimeout(() => {
                    hidePasswordModal();

                    // 模拟支付结果（90%成功率）
                    const isSuccess = Math.random() > 0.1;

                    if (isSuccess) {
                        showPaymentResult(true, '余额支付成功');
                    } else {
                        showPaymentResult(false, '支付密码错误，请重试');
                    }

                    // 重置按钮状态
                    $('#passwordConfirm').prop('disabled', false).text('确认支付');
                }, 1500);
            }

            // 显示支付结果
            function showPaymentResult(isSuccess, message) {
                // 隐藏支付内容和支付栏
                $('#paymentContent').hide();
                $('#paymentBar').hide();

                // 显示结果页面
                const $resultPage = $('#paymentResult');
                const $resultIcon = $('#resultIcon');
                const $resultTitle = $('#resultTitle');
                const $resultDesc = $('#resultDesc');

                if (isSuccess) {
                    $resultIcon.removeClass('failed').addClass('success').html(RESULT_SUCCESS_SVG);
                    $resultTitle.text('支付成功');
                    $resultDesc.text('您的订单已提交，商家正在准备中');

                    // 通知后端把订单状态更新为"已支付"
                    if (orderData && orderData.orderId) {
                        http.post(`/orders/${orderData.orderId}/pay`, {}).catch(function (e) {
                            console.warn('同步支付状态失败:', e && e.message);
                        });
                    }
                } else {
                    $resultIcon.removeClass('success').addClass('failed').html(RESULT_FAILED_SVG);
                    $resultTitle.text('支付失败');
                    $resultDesc.text(message || '支付过程中出现问题，请重试');

                    // 支付失败时显示重试按钮
                    $('#viewOrderBtn').text('重新支付').off('click').on('click', function() {
                        // 重新显示支付页面
                        $resultPage.hide();
                        $('#paymentContent').show();
                        $('#paymentBar').show();
                    });
                }

                $resultPage.show();

                // 如果支付成功，3秒后自动跳转
                if (isSuccess) {
                    setTimeout(() => {
                        RouterUtil.navigateTo('orders');
                    }, 3000);
                }
            }
        });
    </script>
</body>
</html>
