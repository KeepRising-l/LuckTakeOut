<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <script src="js/utils.js"></script>
    <style>
        body {
            background-color: var(--canvas);
        }

        /* 入场：轻渐显，依次错开 */
        .home-top, .search-row, .category-section, .filter-bar, .list-heading, .merchant-list {
            animation: fadeIn 0.35s var(--ease) backwards;
        }

        .search-row { animation-delay: 0.05s; }
        .category-section { animation-delay: 0.1s; }
        .filter-bar { animation-delay: 0.15s; }
        .list-heading, .merchant-list { animation-delay: 0.2s; }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 84px;
        }

        /* 顶部：地址 + 搜索 */
        .home-top {
            padding: 16px 18px 0;
            background: var(--canvas);
        }

        .home-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .loc-pick {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            padding: 2px 0;
            min-width: 0;
        }

        .loc-pick .pin {
            width: 18px;
            height: 18px;
            flex: none;
            color: var(--deadline);
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .loc-txt {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 0;
        }

        .loc-kicker {
            font-size: 12px;
            color: var(--muted);
            line-height: 1.3;
            margin-bottom: 1px;
        }

        .loc-pick .loc-text {
            font-family: var(--font-serif);
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.6px;
            line-height: 1.2;
            color: var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 64vw;
        }

        .loc-pick .chev {
            width: 15px;
            height: 15px;
            flex: none;
            color: var(--muted);
            align-self: flex-end;
            margin-bottom: 6px;
        }

        .head-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--surface-2);
            display: grid;
            place-items: center;
            color: var(--ink);
            flex: none;
        }

        .head-btn svg { width: 19px; height: 19px; }
        .head-btn:active { background: var(--surface-3); }

        /* 搜索框 */
        .search-row {
            padding: 0 18px 16px;
            background: var(--canvas);
        }

        .search-box {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 13px 15px;
            display: flex;
            align-items: center;
            gap: 9px;
            transition: border-color var(--transition-base);
        }

        .search-box:focus-within {
            border-color: var(--focus-ink);
        }

        .search-box .s-icon {
            width: 18px;
            height: 18px;
            color: var(--muted);
            flex: none;
        }

        .search-input {
            border: none;
            outline: none;
            background: transparent;
            flex: 1;
            font-size: 15px;
            color: var(--ink);
        }

        .search-input::placeholder {
            color: var(--faint);
        }

        /* 分类网格 */
        .category-section {
            background: var(--canvas);
            padding: 4px 18px 18px;
        }

        .category-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px 12px;
        }

        .category-item {
            text-align: center;
            cursor: pointer;
            transition: transform var(--transition-fast);
            -webkit-tap-highlight-color: transparent;
        }

        .category-item:active {
            transform: scale(0.94);
        }

        .category-icon {
            width: 52px;
            height: 52px;
            margin: 0 auto 8px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
        }

        .category-icon svg {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .category-icon.fast-food { background: #f3ece0; }
        .category-icon.chinese { background: #eee9dd; }
        .category-icon.hotpot { background: #edded6; }
        .category-icon.dessert { background: #f0e6ea; }
        .category-icon.drink { background: #e2e9ee; }
        .category-icon.western { background: #f0ead9; }
        .category-icon.japanese { background: #e3ebe6; }
        .category-icon.more { background: #e9edf0; }

        .category-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--deadline);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: 600;
        }

        .category-name {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
        }

        /* 排序筛选 */
        .filter-bar {
            padding: 2px 18px 12px;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            scrollbar-width: none;
        }

        .filter-bar::-webkit-scrollbar { display: none; }

        .filter-item {
            padding: 6px 14px;
            border: 1px solid var(--line);
            border-radius: var(--radius-full);
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            transition: all var(--transition-base);
            flex-shrink: 0;
            background: var(--surface);
        }

        .filter-item.active {
            background: var(--ink);
            color: #fff;
            border-color: var(--ink);
            font-weight: 550;
        }

        /* 商家列表 */
        .list-heading {
            padding: 4px 18px 10px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        .list-heading h2 {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
        }

        .list-heading span {
            font-size: 12px;
            color: var(--muted);
        }

        .merchant-list {
            background: var(--surface);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .merchant-item {
            padding: 16px 18px;
            border-bottom: 1px solid var(--line);
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .merchant-item:active {
            background-color: var(--surface-2);
        }

        .merchant-item:last-child {
            border-bottom: none;
        }

        .merchant-header {
            display: flex;
            margin-bottom: 9px;
        }

        .merchant-logo {
            width: 62px;
            height: 62px;
            border-radius: 14px;
            margin-right: 13px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: var(--surface-2);
            border: 1px solid var(--line);
        }

        .merchant-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .merchant-info {
            flex: 1;
            min-width: 0;
        }

        .merchant-name {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .merchant-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 7px;
        }

        .rating-stars {
            width: 14px;
            height: 14px;
            color: var(--meeting);
            flex: none;
        }

        .rating-stars svg {
            width: 14px;
            height: 14px;
            fill: var(--meeting);
            stroke: none;
        }

        .rating-score {
            font-size: 12px;
            color: var(--ink);
            font-weight: 550;
            font-variant-numeric: tabular-nums;
        }

        .merchant-sales {
            font-size: 12px;
            color: var(--muted);
        }

        .merchant-tags {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }

        .merchant-tag {
            padding: 2px 8px;
            background: var(--deadline-soft);
            color: var(--deadline);
            font-size: 11px;
            border-radius: var(--radius-sm);
        }

        .merchant-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--muted);
            padding-left: 75px;
        }

        .delivery-info {
            display: flex;
            gap: 10px;
        }

        .delivery-fee {
            color: var(--ink);
        }

        .delivery-time {
            color: var(--muted);
        }

        .distance {
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            height: 72px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            cursor: pointer;
            padding: 7px 2px;
            border-radius: 22px;
            transition: all var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--ink);
            background: var(--surface-3);
            font-weight: 550;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-text {
            font-size: 11px;
            font-weight: 500;
        }

        .cart-badge {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -8px;
            background: var(--deadline);
            color: white;
            border-radius: 999px;
            padding: 1px 5px;
            font-size: 10px;
            font-weight: 600;
            min-width: 17px;
            height: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-variant-numeric: tabular-nums;
        }

        /* 加载更多 */
        .load-more {
            padding: 22px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .load-more.loading {
            color: var(--ink);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 64px 20px;
            color: var(--muted);
        }

        .empty-icon {
            width: 46px;
            height: 46px;
            margin: 0 auto 14px;
            color: var(--faint);
        }

        .empty-icon svg {
            width: 46px;
            height: 46px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-text {
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .category-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 12px 8px;
            }

            .category-icon {
                width: 48px;
                height: 48px;
            }

            .merchant-item {
                padding: 14px 15px;
            }

            .merchant-logo {
                width: 56px;
                height: 56px;
            }

            .merchant-footer {
                padding-left: 69px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 顶部：地址 + 搜索 -->
    <div class="home-top">
        <div class="home-head">
            <button class="loc-pick" id="locationBar">
                <svg class="pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
                <span class="loc-txt">
                    <span class="loc-kicker">送到</span>
                    <span class="loc-text" id="locationText">定位中...</span>
                </span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
            </button>
            <button class="head-btn" aria-label="消息">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v12H8l-4 3z"/></svg>
            </button>
        </div>
    </div>

    <!-- 搜索框 -->
    <div class="search-row">
        <div class="search-box">
            <svg class="s-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="搜索商家或商品">
        </div>
    </div>

    <!-- 分类导航 -->
    <div class="category-section">
        <div class="category-grid">
            <div class="category-item" data-category="fast-food">
                <div class="category-icon fast-food">
                    <svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 0 1 16 0z"/><path d="M3 12h18"/><path d="M4.5 16h15a1.5 1.5 0 0 1 0 3h-15a1.5 1.5 0 0 1 0-3z"/></svg>
                </div>
                <div class="category-name">快餐</div>
            </div>
            <div class="category-item" data-category="chinese">
                <div class="category-icon chinese">
                    <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 4v3M15 4v3M12 5v2"/><path d="M6 19h12"/></svg>
                </div>
                <div class="category-name">中餐</div>
            </div>
            <div class="category-item" data-category="hotpot">
                <div class="category-icon hotpot">
                    <svg viewBox="0 0 24 24"><path d="M5 12h14v3a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5z"/><path d="M3.5 12h17"/><path d="M9 8c0-1.5 1-1.5 1-3M13 8c0-1.5 1-1.5 1-3"/></svg>
                </div>
                <div class="category-name">火锅</div>
            </div>
            <div class="category-item" data-category="dessert">
                <div class="category-icon dessert">
                    <svg viewBox="0 0 24 24"><path d="M5 20h14l-1.5-7h-11z"/><path d="M6 10a3 3 0 0 1 3-3 3 3 0 0 1 6 0 3 3 0 0 1 3 3"/><path d="M12 4v1"/></svg>
                </div>
                <div class="category-name">甜品</div>
            </div>
            <div class="category-item" data-category="drink">
                <div class="category-icon drink">
                    <svg viewBox="0 0 24 24"><path d="M6 7h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8z"/><path d="M5 7h14"/><path d="M13 7l2-4"/></svg>
                </div>
                <div class="category-name">饮品</div>
            </div>
            <div class="category-item" data-category="western">
                <div class="category-icon western">
                    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-8 13.3L12 21l8-4.7A9 9 0 0 0 12 3z"/><path d="M9 10.5a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0M12 15a1.5 1.5 0 1 0 3 0 1.5 1.5 0 1 0-3 0"/></svg>
                </div>
                <div class="category-name">西餐</div>
            </div>
            <div class="category-item" data-category="japanese">
                <div class="category-icon japanese">
                    <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="8" rx="4"/><path d="M12 8v8"/><circle cx="12" cy="12" r="2.2"/></svg>
                </div>
                <div class="category-name">日料</div>
            </div>
            <div class="category-item" data-category="more">
                <div class="category-icon more">
                    <svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="18" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="18" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/><circle cx="18" cy="18" r="1.6"/></svg>
                </div>
                <div class="category-name">更多</div>
            </div>
        </div>
    </div>

    <!-- 排序筛选 -->
    <div class="filter-bar">
        <div class="filter-item active" data-filter="all">全部</div>
        <div class="filter-item" data-filter="rating">评分最高</div>
        <div class="filter-item" data-filter="sales">销量最高</div>
        <div class="filter-item" data-filter="distance">距离最近</div>
        <div class="filter-item" data-filter="delivery-fee">配送费最低</div>
        <div class="filter-item" data-filter="delivery-time">配送最快</div>
    </div>

    <!-- 商家列表 -->
    <div class="list-heading">
        <h2>附近商家</h2>
        <span id="merchantCount"></span>
    </div>
    <div class="merchant-list" id="merchantList">
        <!-- 商家项目将通过JavaScript动态加载 -->
    </div>

    <!-- 加载更多 -->
    <div class="load-more" id="loadMore" style="display: none;">
        <span class="loading-text">加载更多...</span>
    </div>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-icon">
            <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>
        </div>
        <div class="empty-text">附近暂无商家</div>
    </div>
</div>

<!-- 底部导航 -->
<div class="bottom-nav">
    <div class="nav-item active" data-page="index">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5L20 11v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
        </div>
        <div class="nav-text">首页</div>
    </div>
    <div class="nav-item" data-page="search">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
        </div>
        <div class="nav-text">搜索</div>
    </div>
    <div class="nav-item cart-badge" data-page="cart">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M3 4h2l2.3 10.6a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L19.5 8H6"/></svg>
            <div class="cart-count" id="cartCount" style="display: none;">0</div>
        </div>
        <div class="nav-text">购物车</div>
    </div>
    <div class="nav-item" data-page="orders">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
        </div>
        <div class="nav-text">订单</div>
    </div>
    <div class="nav-item" data-page="profile">
        <div class="nav-icon">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
        </div>
        <div class="nav-text">我的</div>
    </div>
</div>

<script>
    // UIUtil将从utils.js中加载
    document.addEventListener('DOMContentLoaded', function() {
        let currentPage = 1;
        let isLoading = false;
        let hasMore = true;
        let currentFilter = 'all';
        let currentCategory = '';
        let searchKeyword = '';
        let currentLocation = null;

        // 初始化页面
        init();

        function init() {
            // 获取位置信息（不阻塞页面加载）
            getCurrentLocation();

            // 直接加载商家列表，不依赖定位结果
            loadMerchants(true);

            // 更新购物车数量
            updateCartCount();

            // 绑定事件
            bindEvents();
        }

        function bindEvents() {
            // 搜索输入
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', UIUtil.debounce(function() {
                    searchKeyword = this.value.trim();
                    loadMerchants(true);
                }, 500));
            }

            // 分类点击
            document.addEventListener('click', function(e) {
                const categoryItem = e.target.closest('.category-item');
                if (categoryItem) {
                    const category = categoryItem.getAttribute('data-category');
                    if (category === 'more') {
                        // 显示更多分类
                        showMoreCategories();
                    } else {
                        currentCategory = category;
                        loadMerchants(true);
                    }
                }
            });

            // 筛选点击
            document.addEventListener('click', function(e) {
                const filterItem = e.target.closest('.filter-item');
                if (filterItem) {
                    document.querySelectorAll('.filter-item').forEach(item => item.classList.remove('active'));
                    filterItem.classList.add('active');
                    currentFilter = filterItem.getAttribute('data-filter');
                    loadMerchants(true);
                }
            });

            // 商家点击
            document.addEventListener('click', function(e) {
                const merchantItem = e.target.closest('.merchant-item');
                if (merchantItem) {
                    const merchantId = merchantItem.getAttribute('data-merchant-id');
                    window.location.href = `merchant.html?id=${merchantId}`;
                }
            });

            // 底部导航
            document.addEventListener('click', function(e) {
                const navItem = e.target.closest('.nav-item');
                if (navItem) {
                    const page = navItem.getAttribute('data-page');
                    if (page !== 'index') {
                        window.location.href = `${page}.html`;
                    }
                }
            });

            // 位置点击
            const locationBar = document.getElementById('locationBar');
            if (locationBar) {
                locationBar.addEventListener('click', function() {
                    // 重新获取位置或显示地址选择
                    getCurrentLocation();
                });
            }

            // 滚动加载更多
            window.addEventListener('scroll', UIUtil.throttle(function() {
                if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 100) {
                    if (!isLoading && hasMore) {
                        loadMerchants(false);
                    }
                }
            }, 200));
        }

        // 获取当前位置
        function getCurrentLocation() {
            if (navigator.geolocation) {
                const locationTextEl = document.getElementById('locationText');
                if (locationTextEl) {
                    locationTextEl.textContent = '定位中...';
                }

                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        currentLocation = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude
                        };

                        // 逆地理编码获取地址
                        reverseGeocode(currentLocation);
                    },
                    function(error) {
                        console.error('定位失败:', error);
                        const locationTextEl = document.getElementById('locationText');
                        if (locationTextEl) {
                            locationTextEl.textContent = '定位失败，点击重试';
                        }
                    },
                    {
                        timeout: 10000,
                        enableHighAccuracy: true
                    }
                );
            } else {
                const locationTextEl = document.getElementById('locationText');
                if (locationTextEl) {
                    locationTextEl.textContent = '不支持定位';
                }
            }
        }

        // 逆地理编码
        function reverseGeocode(location) {
            // 这里应该调用地图API进行逆地理编码
            // 暂时使用模拟数据
            const locationTextEl = document.getElementById('locationText');
            if (locationTextEl) {
                locationTextEl.textContent = '北京市朝阳区';
            }
        }

        // 加载商家列表
        async function loadMerchants(reset = false) {
            if (isLoading) return;

            isLoading = true;

            if (reset) {
                currentPage = 1;
                hasMore = true;
                document.getElementById('merchantList').innerHTML = '';
                document.getElementById('emptyState').style.display = 'none';
            }

            try {
                if (currentPage === 1) {
                    UIUtil.showLoading('加载中...');
                } else {
                    const loadMoreEl = document.getElementById('loadMore');
                    loadMoreEl.style.display = 'block';
                    loadMoreEl.querySelector('.loading-text').textContent = '加载更多...';
                }

                const params = {
                    page: currentPage,
                    size: 10
                };

                // 添加位置参数
                if (currentLocation) {
                    params.latitude = currentLocation.latitude;
                    params.longitude = currentLocation.longitude;
                }

                // 添加搜索关键词
                if (searchKeyword) {
                    params.keyword = searchKeyword;
                }

                // 添加分类筛选
                if (currentCategory) {
                    params.category = currentCategory;
                }

                // 添加排序参数
                if (currentFilter !== 'all') {
                    params.sortBy = currentFilter;
                }

                const queryParams = new URLSearchParams(params);
                const response = await fetch(`http://localhost:8091/api/v1/merchants/nearby?${queryParams}`, {
                    method: 'GET',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const responseData = await response.json();

                UIUtil.hideLoading();
                document.getElementById('loadMore').style.display = 'none';

                if (responseData.code === '00000' && responseData.data) {
                    const merchants = responseData.data;

                    if (merchants.length === 0) {
                        if (currentPage === 1) {
                            document.getElementById('emptyState').style.display = 'block';
                        } else {
                            hasMore = false;
                        }
                    } else {
                        renderMerchants(merchants, reset);
                        currentPage++;

                        // 检查是否还有更多数据
                        if (merchants.length < 10) {
                            hasMore = false;
                        }
                    }
                } else {
                    UIUtil.showToast('获取商家数据失败', 'error');
                    if (currentPage === 1) {
                        document.getElementById('emptyState').style.display = 'block';
                    }
                }

            } catch (error) {
                UIUtil.hideLoading();
                document.getElementById('loadMore').style.display = 'none';

                if (currentPage === 1) {
                    document.getElementById('emptyState').style.display = 'block';
                }

                UIUtil.showToast(error.message || '加载失败', 'error');
            } finally {
                isLoading = false;
            }
        }

        // 渲染商家列表
        function renderMerchants(merchants, reset = false) {
            const listEl = document.getElementById('merchantList');

            if (reset) {
                listEl.innerHTML = '';
            }

            const starSvg = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/></svg>';

            merchants.forEach(merchant => {
                const itemEl = document.createElement('div');
                itemEl.className = 'merchant-item';
                itemEl.setAttribute('data-merchant-id', merchant.id);

                // 创建商家头部
                const merchantHeader = document.createElement('div');
                merchantHeader.className = 'merchant-header';

                // 创建商家logo
                const merchantLogo = document.createElement('div');
                merchantLogo.className = 'merchant-logo';

                if (merchant.avatar) {
                    const logoImg = document.createElement('img');
                    logoImg.alt = merchant.name;
                    logoImg.src = merchant.avatar;
                    logoImg.onerror = function() {
                        this.parentNode.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#8b99a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';
                    };
                    merchantLogo.appendChild(logoImg);
                } else {
                    merchantLogo.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#8b99a3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="width:26px;height:26px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';
                }

                merchantHeader.appendChild(merchantLogo);

                // 创建商家信息部分
                const merchantInfo = document.createElement('div');
                merchantInfo.className = 'merchant-info';
                merchantInfo.innerHTML = `
                    <div class="merchant-name">${merchant.name}</div>
                    <div class="merchant-rating">
                        <span class="rating-stars">${starSvg}</span>
                        <span class="rating-score">${merchant.rating || '4.5'}</span>
                        <span class="merchant-sales">月售 ${merchant.monthlySales || 0} 单</span>
                    </div>
                    <div class="merchant-tags">
                        ${(merchant.tags && Array.isArray(merchant.tags) ? merchant.tags : ['快餐', '热销']).map(tag => `<span class="merchant-tag">${tag}</span>`).join('')}
                    </div>
                `;

                merchantHeader.appendChild(merchantInfo);
                itemEl.appendChild(merchantHeader);

                // 创建商家底部信息
                const merchantFooter = document.createElement('div');
                merchantFooter.className = 'merchant-footer';
                merchantFooter.innerHTML = `
                    <div class="delivery-info">
                        <span class="delivery-fee">配送 ¥${(merchant.deliveryFee || 3).toFixed(2)}</span>
                        <span class="delivery-time">${merchant.deliveryTime || 30} 分钟</span>
                    </div>
                    <div class="distance">${(merchant.distance || 1.2).toFixed(1)}km</div>
                `;

                itemEl.appendChild(merchantFooter);

                listEl.appendChild(itemEl);
            });
        }

        // 更新购物车数量
        function updateCartCount() {
            const count = localStorage.getItem('cartItemCount') || 0;
            const cartCountEl = document.getElementById('cartCount');

            if (count > 0) {
                cartCountEl.textContent = count > 99 ? '99+' : count;
                cartCountEl.style.display = 'flex';
            } else {
                cartCountEl.style.display = 'none';
            }
        }

        // 显示更多分类
        function showMoreCategories() {
            UIUtil.showToast('更多分类功能开发中', 'info');
        }

        // 定期更新购物车数量
        setInterval(updateCartCount, 1000);
    });
</script>
</body>
