<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商家详情 - 外卖点餐</title>
    <link rel="stylesheet" href="css/common.css">
    <style>
        body {
            background-color: var(--canvas);
            margin: 0;
            padding: 0;
        }

        /* 入场：轻渐显，依次错开 */
        .merchant-info, .category-nav, .product-list {
            animation: fadeIn 0.35s var(--ease) backwards;
        }

        .category-nav { animation-delay: 0.06s; }
        .product-list { animation-delay: 0.12s; }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--canvas);
            min-height: 100vh;
            position: relative;
            padding-bottom: 170px;
        }

        /* 头部导航 */
        .header-nav {
            background: var(--canvas);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid var(--line);
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--ink);
            transition: background-color var(--transition-base);
            border: none;
            flex: none;
        }

        .icon-btn svg { width: 19px; height: 19px; }
        .icon-btn:active { background: var(--surface-3); }

        .header-title {
            flex: 1;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            text-align: center;
            margin: 0 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        /* 商家信息 */
        .merchant-info {
            background: var(--surface);
            padding: 20px 18px;
            border-bottom: 1px solid var(--line);
        }

        .merchant-header {
            display: flex;
            margin-bottom: 14px;
        }

        .merchant-logo {
            width: 78px;
            height: 78px;
            border-radius: 16px;
            background: var(--surface-2);
            margin-right: 16px;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 1px solid var(--line);
        }

        .merchant-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .merchant-details {
            flex: 1;
            min-width: 0;
        }

        .merchant-name {
            font-family: var(--font-serif);
            font-size: 23px;
            font-weight: 600;
            letter-spacing: -0.6px;
            color: var(--ink);
            margin-bottom: 8px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .merchant-rating {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 9px;
        }

        .rating-stars {
            width: 15px;
            height: 15px;
            color: var(--meeting);
            flex: none;
        }

        .rating-stars svg { width: 15px; height: 15px; fill: var(--meeting); }

        .rating-score {
            font-size: 14px;
            color: var(--ink);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .merchant-sales {
            font-size: 12px;
            color: var(--muted);
        }

        .merchant-tags {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .merchant-tag {
            padding: 3px 9px;
            background: var(--deadline-soft);
            color: var(--deadline);
            font-size: 11px;
            border-radius: var(--radius-sm);
            font-weight: 500;
        }

        .delivery-info {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: var(--muted);
            margin-top: 14px;
        }

        .delivery-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .delivery-item svg {
            width: 14px;
            height: 14px;
            color: var(--muted);
            flex: none;
        }

        /* 商家公告 */
        .merchant-notice {
            background: #f2eddf;
            border-radius: var(--radius-md);
            padding: 12px 14px;
            margin-top: 14px;
            font-size: 12.5px;
            color: var(--meeting-ink);
            line-height: 1.55;
        }

        .notice-title {
            font-weight: 600;
            margin-bottom: 3px;
            color: var(--meeting-ink);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .notice-title svg { width: 14px; height: 14px; }

        /* 分类导航 */
        .category-nav {
            position: sticky;
            top: 61px;
            background: var(--canvas);
            border-bottom: 1px solid var(--line);
            z-index: 999;
        }

        .category-list {
            display: flex;
            overflow-x: auto;
            padding: 12px 16px;
            white-space: nowrap;
            gap: 8px;
            scrollbar-width: none;
        }

        .category-list::-webkit-scrollbar { display: none; }

        .category-item {
            padding: 7px 15px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            transition: all var(--transition-base);
            border-radius: var(--radius-full);
            flex-shrink: 0;
            font-weight: 500;
            background: var(--surface);
            border: 1px solid var(--line);
        }

        .category-item.active {
            color: #fff;
            background: var(--ink);
            border-color: var(--ink);
            font-weight: 550;
        }

        /* 商品列表 */
        .product-list {
            padding: 10px 0 0;
        }

        .category-section {
            margin-bottom: 16px;
        }

        .category-title {
            padding: 8px 18px 10px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
        }

        .category-title span {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400;
            margin-left: 6px;
        }

        .product-group {
            background: var(--surface);
            border-top: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
        }

        .product-item {
            padding: 15px 18px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: flex-start;
            transition: background-color var(--transition-base);
            cursor: pointer;
            position: relative;
        }

        .product-item:active {
            background: var(--surface-2);
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .product-image {
            width: 78px;
            height: 78px;
            border-radius: 14px;
            background: var(--surface-2);
            margin-right: 13px;
            overflow: hidden;
            flex-shrink: 0;
            border: 1px solid var(--line);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .product-name {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.2px;
            color: var(--ink);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .product-desc {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 7px;
            line-height: 1.45;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .product-tags {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .product-tag {
            padding: 2px 7px;
            background: var(--meeting);
            color: var(--meeting-ink);
            font-size: 10px;
            border-radius: var(--radius-sm);
            font-weight: 500;
        }

        .product-footer {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-top: auto;
        }

        .product-price {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }

        .current-price {
            font-size: 17px;
            font-weight: 600;
            color: var(--deadline);
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.2px;
        }

        .current-price small {
            font-size: 12px;
            font-weight: 500;
        }

        .original-price {
            font-size: 12px;
            color: var(--muted);
            text-decoration: line-through;
            font-variant-numeric: tabular-nums;
        }

        .product-sales {
            font-size: 11px;
            color: var(--muted);
            margin-left: auto;
        }

        .add-to-cart {
            align-self: flex-end;
            margin-left: 10px;
            flex: none;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .quantity-btn {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid var(--line-strong);
            background: var(--surface);
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            transition: all var(--transition-base);
            padding: 0;
        }

        .quantity-btn:active {
            background: var(--surface-2);
        }

        .quantity-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            min-width: 18px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .add-btn {
            width: 29px;
            height: 29px;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 18px;
            line-height: 1;
            transition: transform var(--transition-fast), background-color var(--transition-base);
            padding: 0;
        }

        .add-btn:active {
            transform: scale(0.92);
            background: var(--ink-soft);
        }

        /* 购物车栏 */
        .cart-bar {
            position: fixed;
            bottom: 88px;
            left: 16px;
            right: 16px;
            max-width: 718px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 11px 14px;
            display: none;
            align-items: center;
            z-index: 1000;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--line);
        }

        .cart-bar.show {
            display: flex;
        }

        .cart-icon-wrapper {
            position: relative;
            margin-right: 12px;
        }

        .cart-icon {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--ink);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color var(--transition-base);
        }

        .cart-icon svg { width: 22px; height: 22px; }

        .cart-icon.empty {
            background: var(--surface-3);
            color: var(--muted);
        }

        .cart-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background: var(--deadline);
            color: #FFF;
            border-radius: 999px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--surface);
            font-variant-numeric: tabular-nums;
        }

        .cart-info {
            flex: 1;
            margin-right: 12px;
            min-width: 0;
        }

        .cart-total {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--ink);
            margin-bottom: 1px;
            font-variant-numeric: tabular-nums;
        }

        .cart-delivery {
            font-size: 11px;
            color: var(--muted);
        }

        .checkout-btn {
            padding: 11px 22px;
            background: var(--ink);
            color: #fff;
            border: none;
            border-radius: var(--radius-full);
            font-size: 14px;
            font-weight: 550;
            cursor: pointer;
            transition: background-color var(--transition-base);
            flex: none;
        }

        .checkout-btn:active {
            background: var(--ink-soft);
        }

        .checkout-btn:disabled {
            background: var(--surface-3);
            color: var(--muted);
            cursor: not-allowed;
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            height: 72px;
            background: var(--canvas);
            border-top: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-around;
            padding: 8px 12px 12px;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            color: var(--muted);
            cursor: pointer;
            padding: 7px 2px;
            border-radius: 22px;
            transition: all var(--transition-base);
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item.active {
            color: var(--ink);
            background: var(--surface-3);
            font-weight: 550;
        }

        .nav-icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .nav-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-text {
            font-size: 11px;
            font-weight: 500;
        }

        .nav-item .cart-count {
            position: absolute;
            top: -5px;
            right: -8px;
            left: auto;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-icon {
            width: 46px;
            height: 46px;
            margin: 0 auto 14px;
            color: var(--faint);
        }

        .empty-icon svg {
            width: 46px;
            height: 46px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .empty-text {
            font-size: 14px;
        }

        .nav-item.cart-badge { position: relative; }

        @media (max-width: 480px) {
            .merchant-logo {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部导航 -->
        <div class="header-nav">
            <button class="icon-btn" id="backBtn" aria-label="返回">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <div class="header-title" id="headerTitle">商家详情</div>
            <div class="header-actions">
                <button class="icon-btn" id="shareBtn" aria-label="分享">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v6h14v-6"/></svg>
                </button>
                <button class="icon-btn" id="favoriteBtn" aria-label="收藏">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-9.5A4 4 0 0 1 12 8a4 4 0 0 1 7 2.5C19 15.6 12 20 12 20z"/></svg>
                </button>
            </div>
        </div>

        <!-- 商家信息 -->
        <div class="merchant-info" id="merchantInfo">
            <!-- 商家信息将通过JavaScript动态加载 -->
        </div>

        <!-- 分类导航 -->
        <div class="category-nav">
            <div class="category-list" id="categoryList">
                <!-- 分类将通过JavaScript动态加载 -->
            </div>
        </div>

        <!-- 商品列表 -->
        <div class="product-list" id="productList">
            <!-- 商品将通过JavaScript动态加载 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>
            </div>
            <div class="empty-text">暂无商品</div>
        </div>
    </div>

    <!-- 购物车栏 -->
    <div class="cart-bar" id="cartBar">
        <div class="cart-icon-wrapper">
            <div class="cart-icon empty" id="cartIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M3 4h2l2.3 10.6a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L19.5 8H6"/></svg>
            </div>
            <div class="cart-badge" id="cartBadge" style="display: none;">0</div>
        </div>
        <div class="cart-info">
            <div class="cart-total" id="cartTotal">¥0.00</div>
            <div class="cart-delivery">配送费另计</div>
        </div>
        <button class="checkout-btn" id="checkoutBtn" disabled>去结算</button>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item" data-page="index">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24"><path d="M4 11l8-6.5L20 11v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/></svg>
            </div>
            <div class="nav-text">首页</div>
        </div>
        <div class="nav-item" data-page="search">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-3.6-3.6"/></svg>
            </div>
            <div class="nav-text">搜索</div>
        </div>
        <div class="nav-item cart-badge" data-page="cart">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24"><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/><path d="M3 4h2l2.3 10.6a1 1 0 0 0 1 .8h8.4a1 1 0 0 0 1-.8L19.5 8H6"/></svg>
                <div class="cart-count" id="cartCountNav" style="display: none;">0</div>
            </div>
            <div class="nav-text">购物车</div>
        </div>
        <div class="nav-item" data-page="orders">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-1.8-3 1.8-3-1.8L6 21z"/><path d="M9 8h6M9 12h6"/></svg>
            </div>
            <div class="nav-text">订单</div>
        </div>
        <div class="nav-item" data-page="profile">
            <div class="nav-icon">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
            </div>
            <div class="nav-text">我的</div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/utils.js"></script>
    <script>
        $(document).ready(function() {
            let merchantId = null;
            let merchantData = null;
            let categories = [];
            let products = [];
            let currentCategory = null;

            const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.9-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.9z"/></svg>';

            // 无图时的占位图标（碗）
            const PLACEHOLDER_BOWL = '<svg viewBox="0 0 24 24" fill="none" stroke="#8b99a3" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:30px;height:30px"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 5v3M15 5v3"/><path d="M6 19h12"/></svg>';

            // 初始化页面
            init();

            function init() {
                // 检查登录状态
                if (!AuthUtil.isLoggedIn()) {
                    RouterUtil.navigateTo('login');
                    return;
                }

                // 获取商家ID
                merchantId = RouterUtil.getUrlParam('id');
                if (!merchantId) {
                    UIUtil.showToast('商家信息不存在', 'error');
                    RouterUtil.goBack();
                    return;
                }

                // 加载商家信息（会自动加载分类和商品）
                loadMerchantInfo();

                // 更新购物车
                updateCartDisplay();

                // 绑定事件
                bindEvents();
            }

            function bindEvents() {
                // 返回按钮
                $('#backBtn').on('click', function() {
                    RouterUtil.goBack();
                });

                // 分享按钮
                $('#shareBtn').on('click', function() {
                    sharemerchant();
                });

                // 收藏按钮
                $('#favoriteBtn').on('click', function() {
                    toggleFavorite();
                });

                // 分类点击
                $(document).on('click', '.category-item', function() {
                    const categoryId = $(this).data('category-id');
                    selectCategory(categoryId);
                });

                // 商品点击
                $(document).on('click', '.product-item', function(e) {
                    // 如果点击的是按钮，不触发商品详情
                    if ($(e.target).closest('.add-to-cart').length > 0) {
                        return;
                    }

                    const productId = $(this).data('product-id');
                    RouterUtil.navigateTo('product', { id: productId, merchantId: merchantId });
                });

                // 添加到购物车
                $(document).on('click', '.add-btn', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const productId = $(this).closest('.product-item').data('product-id');
                    addToCart(productId);
                });

                // 数量控制
                $(document).on('click', '.quantity-btn', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const productId = $(this).closest('.product-item').data('product-id');
                    const action = $(this).data('action');

                    if (action === 'increase') {
                        addToCart(productId);
                    } else if (action === 'decrease') {
                        decreaseFromCart(productId);
                    }
                });

                // 购物车图标点击
                $('#cartIcon').on('click', function() {
                    RouterUtil.navigateTo('cart');
                });

                // 去结算
                $('#checkoutBtn').on('click', function() {
                    if ($(this).prop('disabled')) return;
                    RouterUtil.navigateTo('cart');
                });

                // 底部导航
                $('.nav-item').on('click', function() {
                    const page = $(this).data('page');
                    RouterUtil.navigateTo(page);
                });
            }

            // 加载商家信息
            async function loadMerchantInfo() {
                try {
                    UIUtil.showLoading('加载商家信息中...');

                    // 首先尝试获取单个商家详情
                    try {
                        const response = await http.get(`/merchants/${merchantId}`);
                        merchantData = response.data;
                    } catch (error) {
                        // 如果单个商家接口失败，尝试从附近商家列表中获取
                        console.log('单个商家接口失败，尝试从列表获取:', error.message);
                        const nearbyResponse = await http.get('/merchants/nearby', {
                            page: 1,
                            size: 10
                        });

                        const merchants = nearbyResponse.data || [];
                        merchantData = merchants.find(m => m.id == merchantId);

                        if (!merchantData && merchants.length > 0) {
                            // 如果找不到指定商家，使用第一个附近商家
                            merchantData = merchants[0];
                            console.log('使用第一个附近商家:', merchantData.id);
                        }

                        if (!merchantData) {
                            throw new Error('附近暂无商家');
                        }

                        // 转换字段名以适配页面显示
                        merchantData.merchantName = merchantData.name;
                        merchantData.logo = merchantData.avatar;
                        merchantData.merchantDescription = merchantData.description;

                        // 更新URL中的商家ID
                        merchantId = merchantData.id;
                        const newUrl = new URL(window.location);
                        newUrl.searchParams.set('id', merchantId);
                        window.history.replaceState({}, '', newUrl);
                    }

                    renderMerchantInfo(merchantData);

                    // 更新页面标题
                    $('#headerTitle').text(merchantData.name || merchantData.merchantName);
                    document.title = `${merchantData.name || merchantData.merchantName} - 外卖点餐`;

                    // 重新加载分类和商品数据（使用更新后的merchantId）
                    await loadCategories();
                    await loadProducts();

                } catch (error) {
                    console.error('加载商家信息失败:', error);
                    UIUtil.showToast(error.message || '加载商家信息失败', 'error');
                    RouterUtil.goBack();
                } finally {
                    UIUtil.hideLoading();
                }
            }

            // 渲染商家信息
            function renderMerchantInfo(merchant) {
                $('#headerTitle').text(merchant.name || merchant.merchantName);

                const logo = merchant.logo || merchant.avatar || '';
                const logoMarkup = logo
                    ? `<img src="${logo}" alt="${merchant.name || merchant.merchantName}" onerror="this.style.display='none';this.parentNode.innerHTML='${PLACEHOLDER_BOWL}';">`
                    : PLACEHOLDER_BOWL;

                const $info = $('#merchantInfo');
                $info.html(`
                    <div class="merchant-header">
                        <div class="merchant-logo">${logoMarkup}</div>
                        <div class="merchant-details">
                            <div class="merchant-name">${merchant.name || merchant.merchantName}</div>
                            <div class="merchant-rating">
                                <span class="rating-stars">${STAR_SVG}</span>
                                <span class="rating-score">${merchant.rating || '4.5'}</span>
                                <span class="merchant-sales">月售 ${merchant.monthlySales || merchant.sales || 0} 单</span>
                            </div>
                            <div class="merchant-tags">
                                ${(merchant.tags || ['快餐', '热销']).map(tag => `<span class="merchant-tag">${tag}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="delivery-info">
                        <div class="delivery-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16V6h11v10"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg>
                            <span>配送 ¥${FormatUtil.formatMoney(merchant.deliveryFee || 3)}</span>
                        </div>
                        <div class="delivery-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/></svg>
                            <span>${merchant.deliveryTime || 30} 分钟送达</span>
                        </div>
                        <div class="delivery-item">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>
                            <span>${FormatUtil.formatMoney(merchant.distance || 1.2, 1)}km</span>
                        </div>
                    </div>
                    ${merchant.notice || merchant.announcement || merchant.merchantDescription ? `
                        <div class="merchant-notice">
                            <div class="notice-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l5 4V6l-5 4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>
                                商家公告
                            </div>
                            <div>${merchant.notice || merchant.announcement || merchant.merchantDescription}</div>
                        </div>
                    ` : ''}
                `);
            }

            // 加载商品分类
            async function loadCategories() {
                try {
                    const response = await http.get(`/merchants/${merchantId}/categories`);
                    categories = response.data || [];

                    // 如果API返回空数据，使用模拟分类数据
                    if (!categories || categories.length === 0) {
                        console.log('API返回空分类数据，使用模拟分类数据');
                        categories = generateMockCategories();
                    }

                    renderCategories();

                } catch (error) {
                    console.error('加载分类失败:', error);
                    console.log('API失败，使用模拟分类数据');
                    categories = generateMockCategories();
                    renderCategories();
                }
            }

            // 生成模拟分类数据
            function generateMockCategories() {
                if (merchantData && merchantData.name) {
                    if (merchantData.name.includes('星巴克')) {
                        return [
                            { categoryId: 1, categoryName: '饮品' },
                            { categoryId: 2, categoryName: '轻食' }
                        ];
                    } else if (merchantData.name.includes('麦当劳')) {
                        return [
                            { categoryId: 1, categoryName: '套餐' },
                            { categoryId: 2, categoryName: '单品' },
                            { categoryId: 3, categoryName: '饮品' }
                        ];
                    } else if (merchantData.name.includes('川菜')) {
                        return [
                            { categoryId: 1, categoryName: '热销套餐' },
                            { categoryId: 2, categoryName: '招牌菜' },
                            { categoryId: 3, categoryName: '汤品' }
                        ];
                    }
                }

                return [
                    { categoryId: 1, categoryName: '热销套餐' },
                    { categoryId: 2, categoryName: '招牌菜' },
                    { categoryId: 3, categoryName: '饮品' }
                ];
            }

            // 渲染分类
            function renderCategories() {
                const $list = $('#categoryList');
                $list.empty();

                // 添加全部分类
                $list.append(`
                    <div class="category-item active" data-category-id="">
                        全部
                    </div>
                `);

                categories.forEach(category => {
                    const cid = category.categoryId != null ? category.categoryId : category.id;
                    const cname = category.categoryName || category.name || '';
                    $list.append(`
                        <div class="category-item" data-category-id="${cid}">
                            ${cname}
                        </div>
                    `);
                });
            }

            // 选择分类
            function selectCategory(categoryId) {
                currentCategory = categoryId;

                // 更新分类样式
                $('.category-item').removeClass('active');
                $(`.category-item[data-category-id="${categoryId}"]`).addClass('active');

                // 重新加载商品
                loadProducts();
            }

            // 加载商品列表
            async function loadProducts() {
                try {
                    const params = {
                        page: 1,
                        size: 100
                    };

                    // 如果有选中的分类，添加分类参数
                    if (currentCategory) {
                        params.categoryId = currentCategory;
                    }

                    const response = await http.get(`/merchants/${merchantId}/products`, params);
                    products = response.data || [];

                    // 如果API返回的数据为空或失败，使用模拟数据
                    if (!products || products.length === 0) {
                        console.log('API返回空数据，使用模拟商品数据');
                        products = generateMockProducts();
                    } else {
                        // 统一API数据格式，确保字段一致性
                        products = products.map(product => ({
                            ...product,
                            productId: product.id || product.productId,
                            productName: product.name || product.productName,
                            productDescription: product.description || product.productDescription,
                            productPrice: product.price || product.productPrice,
                            productImage: product.mainImage || product.productImage,
                            monthlySales: product.sales || product.monthlySales || 0
                        }));
                    }

                    renderProducts();

                } catch (error) {
                    console.error('加载商品失败:', error);
                    console.log('API失败，使用模拟商品数据');
                    products = generateMockProducts();
                    renderProducts();
                }
            }

            // 生成模拟商品数据
            function generateMockProducts() {
                const mockProducts = [
                    {
                        productId: 1,
                        id: 1,
                        productName: '招牌川菜套餐',
                        name: '招牌川菜套餐',
                        productDescription: '麻婆豆腐+宫保鸡丁+米饭，正宗川味',
                        description: '麻婆豆腐+宫保鸡丁+米饭，正宗川味',
                        productPrice: 32.8,
                        price: 32.8,
                        originalPrice: 38.0,
                        productImage: '',
                        mainImage: '',
                        categoryName: '热销套餐',
                        monthlySales: 156,
                        sales: 156,
                        tags: ['热销', '川味']
                    },
                    {
                        productId: 2,
                        id: 2,
                        productName: '香辣水煮鱼',
                        name: '香辣水煮鱼',
                        productDescription: '新鲜草鱼片，麻辣鲜香，下饭神器',
                        description: '新鲜草鱼片，麻辣鲜香，下饭神器',
                        productPrice: 45.0,
                        price: 45.0,
                        productImage: '',
                        mainImage: '',
                        categoryName: '招牌菜',
                        monthlySales: 89,
                        sales: 89,
                        tags: ['招牌', '麻辣']
                    },
                    {
                        productId: 3,
                        id: 3,
                        productName: '经典咖啡拿铁',
                        name: '经典咖啡拿铁',
                        productDescription: '精选阿拉比卡咖啡豆，香醇顺滑',
                        description: '精选阿拉比卡咖啡豆，香醇顺滑',
                        productPrice: 28.0,
                        price: 28.0,
                        productImage: '',
                        mainImage: '',
                        categoryName: '饮品',
                        monthlySales: 234,
                        sales: 234,
                        tags: ['精品', '热饮']
                    },
                    {
                        productId: 4,
                        id: 4,
                        productName: '巨无霸汉堡套餐',
                        name: '巨无霸汉堡套餐',
                        productDescription: '双层牛肉饼+薯条+可乐，经典搭配',
                        description: '双层牛肉饼+薯条+可乐，经典搭配',
                        productPrice: 35.5,
                        price: 35.5,
                        originalPrice: 42.0,
                        productImage: '',
                        mainImage: '',
                        categoryName: '套餐',
                        monthlySales: 312,
                        sales: 312,
                        tags: ['热销', '套餐']
                    }
                ];

                // 根据商家类型调整商品
                if (merchantData && merchantData.name) {
                    if (merchantData.name.includes('星巴克')) {
                        return mockProducts.filter(p => p.categoryName === '饮品');
                    } else if (merchantData.name.includes('麦当劳')) {
                        return mockProducts.filter(p => p.categoryName === '套餐');
                    } else if (merchantData.name.includes('川菜')) {
                        return mockProducts.filter(p => ['热销套餐', '招牌菜'].includes(p.categoryName));
                    }
                }

                return mockProducts;
            }

            // 渲染商品列表
            function renderProducts() {
                const $list = $('#productList');
                $list.empty();

                if (!products || products.length === 0) {
                    $('#emptyState').show();
                    return;
                }

                $('#emptyState').hide();

                // 按分类分组
                const groupedProducts = groupProductsByCategory(products);

                Object.keys(groupedProducts).forEach(categoryName => {
                    const categoryProducts = groupedProducts[categoryName];

                    $list.append(`
                        <div class="category-section">
                            <div class="category-title">${categoryName}<span>${categoryProducts.length} 款</span></div>
                            <div class="product-group">
                                ${categoryProducts.map(product => renderProductItem(product)).join('')}
                            </div>
                        </div>
                    `);
                });
            }

            // 按分类分组商品
            function groupProductsByCategory(products) {
                const grouped = {};

                products.forEach(product => {
                    const categoryName = product.categoryName || '其他';
                    if (!grouped[categoryName]) {
                        grouped[categoryName] = [];
                    }
                    grouped[categoryName].push(product);
                });

                return grouped;
            }

            // 渲染商品项
            function renderProductItem(product) {
                const cartData = CartUtil.getCartData();
                const cartItem = cartData.find(item => item.productId === product.productId);
                const quantity = cartItem ? cartItem.quantity : 0;

                const imgFallback = `this.style.display='none';this.parentNode.innerHTML='${PLACEHOLDER_BOWL}';`;
                const imgMarkup = product.productImage
                    ? `<img src="${product.productImage}" alt="${product.productName}" onerror="${imgFallback}">`
                    : PLACEHOLDER_BOWL;

                return `
                    <div class="product-item" data-product-id="${product.productId}">
                        <div class="product-image">
                            ${imgMarkup}
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.productName}</div>
                            <div class="product-desc">${product.productDescription || '暂无描述'}</div>
                            <div class="product-tags">
                                ${(product.tags || ['热销']).map(tag => `<span class="product-tag">${tag}</span>`).join('')}
                            </div>
                            <div class="product-footer">
                                <div class="product-price">
                                    <span class="current-price"><small>¥</small>${FormatUtil.formatMoney(product.productPrice)}</span>
                                    ${product.originalPrice && product.originalPrice > product.productPrice ? `<span class="original-price">¥${FormatUtil.formatMoney(product.originalPrice)}</span>` : ''}
                                </div>
                                <div class="product-sales">月售 ${product.monthlySales || 0} 份</div>
                            </div>
                        </div>
                        <div class="add-to-cart">
                            ${quantity > 0 ? `
                                <div class="quantity-control">
                                    <button class="quantity-btn" data-action="decrease">−</button>
                                    <span class="quantity-number">${quantity}</span>
                                    <button class="quantity-btn" data-action="increase">+</button>
                                </div>
                            ` : `
                                <button class="add-btn">+</button>
                            `}
                        </div>
                    </div>
                `;
            }

            // 添加到购物车
            function addToCart(productId) {
                const product = products.find(p => p.productId === productId);
                if (!product) {
                    console.error('未找到商品，productId:', productId, '可用商品:', products);
                    UIUtil.showToast('商品不存在', 'error');
                    return;
                }

                // 创建购物车商品对象，确保字段完整
                const cartProduct = {
                    productId: product.productId,
                    productName: product.productName,
                    productPrice: product.productPrice,
                    productImage: product.productImage,
                    merchantId: merchantId,
                    merchantName: merchantData.name || merchantData.merchantName || '未知商家'
                };

                try {
                    CartUtil.addToCart(cartProduct, 1);
                    updateCartDisplay();
                    updateProductDisplay(productId);

                    UIUtil.showToast('已添加到购物车', 'success', 1000);
                } catch (error) {
                    console.error('添加到购物车失败:', error);
                    UIUtil.showToast('添加失败，请重试', 'error');
                }
            }

            // 从购物车减少
            function decreaseFromCart(productId) {
                const cartData = CartUtil.getCartData();
                const cartItem = cartData.find(item => item.productId === productId);

                if (cartItem) {
                    CartUtil.updateCartItem(productId, cartItem.quantity - 1);
                    updateCartDisplay();
                    updateProductDisplay(productId);
                }
            }

            // 更新商品显示
            function updateProductDisplay(productId) {
                const cartData = CartUtil.getCartData();
                const cartItem = cartData.find(item => item.productId === productId);
                const quantity = cartItem ? cartItem.quantity : 0;

                const $productItem = $(`.product-item[data-product-id="${productId}"]`);
                const $addToCart = $productItem.find('.add-to-cart');

                if (quantity > 0) {
                    $addToCart.html(`
                        <div class="quantity-control">
                            <button class="quantity-btn" data-action="decrease">−</button>
                            <span class="quantity-number">${quantity}</span>
                            <button class="quantity-btn" data-action="increase">+</button>
                        </div>
                    `);
                } else {
                    $addToCart.html(`
                        <button class="add-btn">+</button>
                    `);
                }
            }

            // 更新购物车显示
            function updateCartDisplay() {
                const cartData = CartUtil.getCartData();
                const totalCount = CartUtil.getCartItemCount();
                const totalAmount = CartUtil.getCartTotalAmount();

                // 更新购物车栏显示/隐藏
                const $cartBar = $('#cartBar');
                if (totalCount > 0) {
                    $cartBar.addClass('show');
                } else {
                    $cartBar.removeClass('show');
                }

                // 更新购物车图标
                const $cartIcon = $('#cartIcon');
                const $cartBadge = $('#cartBadge');

                if (totalCount > 0) {
                    $cartIcon.removeClass('empty');
                    $cartBadge.text(totalCount > 99 ? '99+' : totalCount).show();
                } else {
                    $cartIcon.addClass('empty');
                    $cartBadge.hide();
                }

                // 更新底部导航购物车数量
                const $cartCountNav = $('#cartCountNav');
                if (totalCount > 0) {
                    $cartCountNav.text(totalCount > 99 ? '99+' : totalCount).show();
                } else {
                    $cartCountNav.hide();
                }

                // 更新总金额
                $('#cartTotal').text(`¥${FormatUtil.formatMoney(totalAmount)}`);

                // 更新结算按钮
                const $checkoutBtn = $('#checkoutBtn');
                if (totalAmount > 0) {
                    $checkoutBtn.prop('disabled', false).text('去结算');
                } else {
                    $checkoutBtn.prop('disabled', true).text('去结算');
                }
            }

            // 分享商家
            function sharemerchant() {
                if (navigator.share) {
                    navigator.share({
                        title: merchantData.merchantName,
                        text: `推荐一家好店：${merchantData.merchantName}`,
                        url: window.location.href
                    });
                } else {
                    // 复制链接
                    navigator.clipboard.writeText(window.location.href).then(() => {
                        UIUtil.showToast('链接已复制到剪贴板', 'success');
                    }).catch(() => {
                        UIUtil.showToast('分享功能暂不可用', 'error');
                    });
                }
            }

            // 切换收藏
            function toggleFavorite() {
                const $btn = $('#favoriteBtn');
                const isFavorited = $btn.hasClass('favorited');

                if (isFavorited) {
                    $btn.removeClass('favorited').css('color', '');
                    UIUtil.showToast('已取消收藏', 'info');
                } else {
                    $btn.addClass('favorited').css('color', 'var(--deadline)');
                    UIUtil.showToast('已收藏', 'success');
                }
            }

            // 定期更新购物车显示
            setInterval(updateCartDisplay, 1000);
        });
    </script>
</body>
</html>
