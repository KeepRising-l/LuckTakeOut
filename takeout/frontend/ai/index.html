<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 客服 · 外卖平台</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f2f3f5; }
  .chat { max-width: 480px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; }
  header { background: #ff6600; color: #fff; padding: 14px 16px; font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; }
  .msg { display: flex; margin-bottom: 12px; }
  .msg .bubble { max-width: 78%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; }
  .msg.user { justify-content: flex-end; }
  .msg.user .bubble { background: #ff6600; color: #fff; border-bottom-right-radius: 2px; }
  .msg.ai .bubble { background: #f2f3f5; color: #222; border-bottom-left-radius: 2px; }
  .draft { border-top: 1px solid #eee; padding: 12px 16px; background: #fffdf5; display: none; }
  .draft h4 { margin: 0 0 8px; font-size: 14px; }
  .draft .row { display: flex; justify-content: space-between; font-size: 13px; color: #555; margin-bottom: 4px; }
  .draft .total { font-size: 15px; color: #ff6600; font-weight: 600; margin-top: 6px; }
  .draft button { margin-top: 10px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #ff6600; color: #fff; font-size: 15px; }
  .input-bar { display: flex; border-top: 1px solid #eee; padding: 10px; gap: 8px; }
  .input-bar input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 14px; }
  .input-bar button { padding: 0 18px; border: 0; border-radius: 20px; background: #ff6600; color: #fff; font-size: 14px; }
  .hint { padding: 8px 16px; font-size: 12px; color: #999; background: #fff; }
</style>
</head>
<body>
<div class="chat">
  <header>AI 客服助手 · 下单 / 催单 / 评价</header>
  <div class="messages" id="messages"></div>
  <div class="hint">试试：帮我点川香小馆的菜 ／ 我的单怎么还没到 ／ 我要评价</div>
  <div class="draft" id="draftBox"></div>
  <div class="input-bar">
    <input id="msgInput" placeholder="请输入内容…" autocomplete="off">
    <button id="sendBtn">发送</button>
  </div>
</div>
<script>
let sessionId = null;
const messagesEl = document.getElementById('messages');
const draftBox = document.getElementById('draftBox');

function addMsg(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  el.innerHTML = `<div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  messagesEl.appendChild(el);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function ensureSession() {
  if (sessionId) return;
  const res = await fetch('/api/v1/ai/session', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
  });
  const json = await res.json();
  if (json.code === '00000') sessionId = json.data.sessionId;
}

async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  addMsg(text, 'user');
  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  try {
    await ensureSession();
    const res = await fetch('/api/v1/ai/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sessionId: sessionId, message: text })
    });
    const json = await res.json();
    if (json.code === '00000') {
      addMsg(json.data.reply || '(无回复)', 'ai');
      if (json.data.draft) renderDraft(json.data.draft);
    } else {
      addMsg(json.info || '请求失败', 'ai');
    }
  } catch (e) {
    addMsg('网络错误：' + e.message, 'ai');
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

function renderDraft(d) {
  const rows = (d.items || []).map(it =>
    `<div class="row"><span>${it.name} ×${it.quantity}</span><span>¥${(it.price * it.quantity).toFixed(2)}</span></div>`
  ).join('');
  draftBox.innerHTML =
    `<h4>待确认订单草稿 · ${d.merchant}</h4>` + rows +
    `<div class="row"><span>收货地址</span><span>${d.address || '未选择'}</span></div>` +
    `<div class="total">合计 ¥${d.total.toFixed(2)}</div>` +
    `<button onclick="confirmDraft(${d.draftId})">确认下单</button>`;
  draftBox.style.display = 'block';
}

async function confirmDraft(id) {
  const res = await fetch(`/api/v1/ai/drafts/${id}/confirm`, { method: 'POST' });
  const json = await res.json();
  if (json.code === '00000') {
    addMsg(`下单成功！订单号 ${json.data.orderNo}，金额 ¥${json.data.actualAmount.toFixed(2)}`, 'ai');
    draftBox.style.display = 'none';
  } else {
    addMsg(json.info || '确认失败', 'ai');
  }
}

document.getElementById('sendBtn').addEventListener('click', send);
document.getElementById('msgInput').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') send();
});

addMsg('您好，我是外卖客服助手，可以帮您下单、催单或评价。请问需要什么？', 'ai');
</script>
</body>
</html>
