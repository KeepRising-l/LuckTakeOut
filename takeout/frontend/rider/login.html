<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骑手登录 - 外卖平台</title>
    <style>
        :root {
            --canvas: #f6f7f8;
            --surface: #ffffff;
            --surface-2: #eef1f3;
            --ink: #2a353c;
            --ink-soft: #40515c;
            --muted: #60717c;
            --faint: #8b99a3;
            --line: #dde3e7;
            --focus-ink: #183c59;
            --focus: #b9cddf;
            --deadline: #9c5429;
            --error: #b0523f;
            --font-serif: Georgia, 'Songti SC', 'STSong', 'Noto Serif SC', serif;
            --ease: cubic-bezier(.2, .8, .25, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--canvas);
            color: var(--ink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
            -webkit-font-smoothing: antialiased;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 34px 28px 28px;
            animation: fadeIn .35s var(--ease);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--surface-2);
            display: grid;
            place-items: center;
            color: var(--ink);
        }

        .brand-icon svg {
            width: 21px;
            height: 21px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand h1 {
            font-family: var(--font-serif);
            font-size: 24px;
            font-weight: 600;
            letter-spacing: -0.6px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--muted);
            margin: 10px 0 26px;
            line-height: 1.6;
        }

        .form-group { margin-bottom: 16px; }

        .form-label {
            display: block;
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 16px;
            color: var(--ink);
            background: var(--surface);
            transition: border-color .2s var(--ease);
        }

        .form-input:focus { border-color: var(--focus-ink); outline: none; }
        .form-input::placeholder { color: var(--faint); }

        .login-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 999px;
            background: var(--ink);
            color: #fff;
            font-size: 15px;
            font-weight: 550;
            letter-spacing: 0.3px;
            cursor: pointer;
            margin-top: 6px;
            transition: background-color .2s var(--ease), transform .15s var(--ease);
        }

        .login-btn:hover { background: var(--ink-soft); }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { background: var(--line); color: var(--faint); cursor: not-allowed; }

        .test-account {
            width: 100%;
            height: 40px;
            margin-top: 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: transparent;
            color: var(--muted);
            font-size: 13px;
            cursor: pointer;
            transition: background-color .2s var(--ease);
        }

        .test-account:hover { background: var(--surface-2); color: var(--ink); }

        .error-msg {
            display: none;
            font-size: 13px;
            color: var(--error);
            background: #f7e9e5;
            border-radius: 8px;
            padding: 9px 12px;
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .error-msg.show { display: block; }

        .tips {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--line);
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M3 16V6h11v10"/><path d="M14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17.5" cy="18" r="1.6"/></svg>
            </div>
            <h1>骑手工作台</h1>
        </div>
        <p class="subtitle">登录后即可上线接单，进行配送。</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="username">账号</label>
                <input class="form-input" type="text" id="username" placeholder="请输入骑手账号" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">密码</label>
                <input class="form-input" type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="login-btn" id="loginBtn">登 录</button>
            <button type="button" class="test-account" id="fillTest">一键填入测试账号（rider1）</button>
        </form>

        <div class="tips">
            演示账号：rider1 / rider123<br>
            没有账号？请联系平台运营开通骑手账号。
        </div>
    </div>

<script>
    // 已登录直接进工作台
    if (localStorage.getItem('riderToken')) {
        location.replace('index.html');
    }

    document.getElementById('fillTest').addEventListener('click', function () {
        document.getElementById('username').value = 'rider1';
        document.getElementById('password').value = 'rider123';
    });

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const btn = document.getElementById('loginBtn');
        const errBox = document.getElementById('errorMsg');
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        errBox.classList.remove('show');
        if (!username || !password) {
            errBox.textContent = '请输入账号和密码';
            errBox.classList.add('show');
            return;
        }

        btn.disabled = true;
        btn.textContent = '登录中...';

        try {
            const res = await fetch('/api/v1/delivery/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const json = await res.json();

            if (json.code === '00000' && json.data && json.data.token) {
                localStorage.setItem('riderToken', json.data.token);
                localStorage.setItem('riderInfo', JSON.stringify({
                    riderId: json.data.riderId,
                    name: json.data.name,
                    phone: json.data.phone
                }));
                location.href = 'index.html';
                return;
            }

            errBox.textContent = json.info || '登录失败，请重试';
            errBox.classList.add('show');
        } catch (err) {
            errBox.textContent = '网络异常，请稍后重试';
            errBox.classList.add('show');
        } finally {
            btn.disabled = false;
            btn.textContent = '登 录';
        }
    });
</script>
</body>
</html>
