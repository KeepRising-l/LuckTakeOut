<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>骑手端 - 外卖配送</title>
    <style>
        :root {
            --primary-color: #FFD100;
            --secondary-color: #FF6600;
            --success-color: #06C755;
            --danger-color: #FF1744;
            --warning-color: #FF9800;
            --info-color: #1976D2;
            --text-primary: #333333;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border-color: #E0E0E0;
            --bg-color: #F5F5F5;
            --white: #FFFFFF;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.5;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: var(--bg-color);
            min-height: 100vh;
            position: relative;
            padding-bottom: 80px;
        }

        /* 顶部状态栏 */
        .status-bar {
            background: var(--primary-color);
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            font-size: 14px;
            font-weight: 600;
        }

        .time {
            color: #000;
        }

        .status-icons {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #000;
        }

        /* 头部导航 */
        .header {
            background: var(--primary-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .rider-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-right: 12px;
        }

        .rider-info h3 {
            font-size: 16px;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .rider-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .work-status-btn {
            background: var(--success-color);
            color: var(--white);
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .work-status-btn.offline {
            background: var(--text-muted);
        }

        /* 统计卡片 */
        .stats-section {
            background: var(--white);
            margin: 8px 16px;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 订单列表 */
        .orders-section {
            margin: 8px 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .filter-tab {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--white);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-tab.active {
            background: var(--primary-color);
            color: var(--text-primary);
            border-color: var(--primary-color);
        }

        .order-card {
            background: var(--white);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .order-id {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .order-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .status-pending {
            background: #FFF3E0;
            color: var(--warning-color);
        }

        .status-accepted {
            background: #E8F5E8;
            color: var(--success-color);
        }

        .status-delivering {
            background: #E3F2FD;
            color: var(--info-color);
        }

        .status-completed {
            background: #F3E5F5;
            color: #9C27B0;
        }

        .order-info {
            margin-bottom: 12px;
        }

        .merchant-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .delivery-address {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .order-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: var(--text-muted);
        }

        .delivery-fee {
            font-size: 16px;
            font-weight: 600;
            color: var(--danger-color);
        }

        .order-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary-color);
            color: var(--text-primary);
            border-color: var(--primary-color);
        }

        .btn-secondary {
            background: var(--white);
            color: var(--text-secondary);
        }

        .btn-success {
            background: var(--success-color);
            color: var(--white);
            border-color: var(--success-color);
        }

        .btn-danger {
            background: var(--danger-color);
            color: var(--white);
            border-color: var(--danger-color);
        }

        /* 底部导航 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 750px;
            height: 70px;
            background: var(--white);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            padding: 8px 4px;
            transition: all 0.3s ease;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .nav-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .nav-text {
            font-size: 10px;
            font-weight: 500;
        }

        .nav-badge {
            position: relative;
        }

        .badge-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger-color);
            color: var(--white);
            border-radius: 10px;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: 600;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .empty-text {
            font-size: 14px;
        }

        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            border-radius: 12px;
            padding: 24px;
            margin: 20px;
            max-width: 400px;
            width: 100%;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            text-align: center;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        /* 响应式设计 */
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 12px;
            }

            .order-card {
                padding: 12px;
            }

            .modal-content {
                margin: 16px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 状态栏 -->
    <div class="status-bar">
        <div class="time" id="currentTime">09:10</div>
        <div class="status-icons">
            <span>📶</span>
            <span>🔋</span>
            <span>85%</span>
        </div>
    </div>

    <!-- 头部导航 -->
    <div class="header">
        <div class="header-left">
            <div class="rider-avatar">
                🚴
            </div>
            <div class="rider-info">
                <h3 id="riderName">张师傅</h3>
                <div class="rider-status" id="riderStatus">在线 · 今日已接单 8 单</div>
            </div>
        </div>
        <button class="work-status-btn" id="workStatusBtn" onclick="toggleWorkStatus()">上线接单</button>
    </div>

    <!-- 统计卡片 -->
    <div class="stats-section">
        <div class="stats-grid">
            <div class="stat-item">
                <div class="stat-value" id="todayOrders">8</div>
                <div class="stat-label">今日订单</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="todayEarnings">¥156</div>
                <div class="stat-label">今日收入</div>
            </div>
            <div class="stat-item">
                <div class="stat-value" id="riderRating">4.9</div>
                <div class="stat-label">评分</div>
            </div>
        </div>
    </div>

    <!-- 订单列表 -->
    <div class="orders-section">
        <div class="section-header">
            <h2 class="section-title">配送订单</h2>
        </div>

        <!-- 筛选标签 -->
        <div class="filter-tabs">
            <div class="filter-tab active" data-status="all" onclick="filterOrders('all')">全部</div>
            <div class="filter-tab" data-status="pending" onclick="filterOrders('pending')">待接单</div>
            <div class="filter-tab" data-status="accepted" onclick="filterOrders('accepted')">已接单</div>
            <div class="filter-tab" data-status="delivering" onclick="filterOrders('delivering')">配送中</div>
            <div class="filter-tab" data-status="completed" onclick="filterOrders('completed')">已完成</div>
        </div>

        <!-- 订单列表 -->
        <div id="ordersList">
            <!-- 订单卡片将通过JavaScript动态生成 -->
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('orders')">
            <div class="nav-icon nav-badge">
                📋
                <span class="badge-count" id="ordersBadge">3</span>
            </div>
            <div class="nav-text">订单</div>
        </div>
        <div class="nav-item" onclick="switchTab('map')">
            <div class="nav-icon">🗺️</div>
            <div class="nav-text">地图</div>
        </div>
        <div class="nav-item" onclick="switchTab('earnings')">
            <div class="nav-icon">💰</div>
            <div class="nav-text">收入</div>
        </div>
        <div class="nav-item" onclick="switchTab('profile')">
            <div class="nav-icon">👤</div>
            <div class="nav-text">我的</div>
        </div>
    </div>
</div>

<!-- 订单详情模态框 -->
<div class="modal" id="orderDetailModal">
    <div class="modal-content">
        <div class="modal-header">订单详情</div>
        <div class="modal-body" id="orderDetailContent">
            <!-- 订单详情内容将通过JavaScript动态生成 -->
        </div>
        <div class="modal-actions">
            <button class="modal-btn btn-secondary" onclick="closeModal()">关闭</button>
            <button class="modal-btn btn-primary" id="orderActionBtn" onclick="handleOrderAction()">接单</button>
        </div>
    </div>
</div>

<script>

let riderInfo = null;

// 生成模拟骑手信息
function generateMockRiderInfo() {
    return {
        id: 'delivery_001',
        name: '张师傅',
        phone: '138****1234',
        rating: 4.9,
        todayDeliveryCount: 8,
        todayEarnings: 156,
        workStatus: 1, // 1-在线, 3-离线
        location: {
            latitude: 39.9042,
            longitude: 116.4074,
            address: '北京市朝阳区'
        }
    };
}

// 初始化
document.addEventListener('DOMContentLoaded', function() {
    updateTime();
    setInterval(updateTime, 1000);
    loadRiderInfo();
    loadOrders();

    // 定期刷新配送任务
    setInterval(loadOrders, 15000);
});

// 更新时间
function updateTime() {
    const now = new Date();
    const timeString = now.toLocaleTimeString('zh-CN', { 
        hour: '2-digit', 
        minute: '2-digit',
        hour12: false 
    });
    document.getElementById('currentTime').textContent = timeString;
}

// 工具函数
function getCurrentRiderId() {
    // 从localStorage获取或使用默认值
    return localStorage.getItem('riderId') || 'delivery_001';
}

function getCurrentLocation() {
    // 模拟获取当前位置，实际应用中可以使用GPS
    return {
        latitude: 39.9042,
        longitude: 116.4074,
        address: '北京市朝阳区'
    };
}

function mapOrderStatus(status) {
    const statusMap = {
        1: 'pending',    // 待分配
        2: 'accepted',   // 已接单
        3: 'delivering', // 配送中
        4: 'completed',  // 已完成
        5: 'cancelled'   // 已取消
    };
    return statusMap[status] || 'pending';
}

// 添加随机订单（模拟新订单到达）
function addRandomOrder() {
    const newOrderTemplates = [
        {
            merchantName: '必胜客(望京店)',
            deliveryAddress: '北京市朝阳区望京街10号',

            contactPhone: '137****5555',
            distance: '1.5km',
            estimatedTime: '22分钟',
            deliveryFee: 7,
            items: [
                { name: '至尊披萨', quantity: 1, price: 89 },
                { name: '鸡翅', quantity: 6, price: 36 }
            ]
        },
        {
            merchantName: '喜茶(三里屯店)',
            deliveryAddress: '北京市朝阳区工体北路8号',
            contactName: '刘女士',
            contactPhone: '158****3333',
            distance: '2.1km',
            estimatedTime: '18分钟',
            deliveryFee: 5,
            items: [
                { name: '芝芝莓莓', quantity: 2, price: 62 },
                { name: '烤黑糖波波', quantity: 1, price: 28 }
            ]
        }
    ];
    
    const template = newOrderTemplates[Math.floor(Math.random() * newOrderTemplates.length)];
    const newOrder = {
        ...template,
        id: 'ORD' + Date.now().toString().slice(-6),
        status: 'pending',
        createTime: new Date().toLocaleString('zh-CN')
    };
    
    orders.unshift(newOrder);
    renderOrders();
    updateOrdersBadge();

}

// 显示消息提示
function showMessage(message, type = 'info') {
    // 创建消息元素
    const messageEl = document.createElement('div');
    messageEl.className = `message message-${type}`;
    messageEl.textContent = message;
    
    // 添加样式
    messageEl.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: ${type === 'success' ? '#4CAF50' : type === 'error' ? '#f44336' : '#2196F3'};
        color: white;
        padding: 12px 24px;
        border-radius: 4px;
        z-index: 10000;
        font-size: 14px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    `;
    
    document.body.appendChild(messageEl);
    
    // 3秒后自动移除
    setTimeout(() => {
        if (messageEl.parentNode) {
            messageEl.parentNode.removeChild(messageEl);
        }
    }, 3000);
}

// 切换工作状态
function toggleWorkStatus() {
    isOnline = !isOnline;
    const btn = document.getElementById('workStatusBtn');
    const status = document.getElementById('riderStatus');
    
    if (isOnline) {
        btn.textContent = '下线休息';
        btn.classList.remove('offline');
        status.textContent = `在线 · 今日已接单 ${riderInfo?.todayDeliveryCount || 0} 单`;
        showMessage('上线成功', 'success');
    } else {
        btn.textContent = '上线接单';
        btn.classList.add('offline');
        status.textContent = `离线 · 今日已接单 ${riderInfo?.todayDeliveryCount || 0} 单`;
        showMessage('下线成功', 'success');
    }
    
    // 更新骑手信息中的工作状态
    if (riderInfo) {
        riderInfo.workStatus = isOnline ? 1 : 3;
    }
}

// 切换底部导航
function switchTab(tab) {
    // 移除所有active类
    document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
    });
    
    // 添加active类到当前选中的tab
    event.target.closest('.nav-item').classList.add('active');
    
    // 根据tab显示不同内容
    switch(tab) {
        case 'orders':
            // 显示订单列表
            break;
        case 'map':
            // 显示地图
            alert('地图功能开发中...');
            break;
        case 'earnings':
            // 显示收入统计
            alert('收入统计功能开发中...');
            break;
        case 'profile':
            // 显示个人中心
            alert('个人中心功能开发中...');
            break;
    }
}

// 筛选订单
function filterOrders(status) {
    currentFilter = status;
    
    // 更新筛选标签样式
    document.querySelectorAll('.filter-tab').forEach(tab => {
        tab.classList.remove('active');
    });
    document.querySelector(`[data-status="${status}"]`).classList.add('active');
    
    // 重新渲染订单列表
    renderOrders();
}

// 当前骑手ID（对应种子数据中的骑手）
const RIDER_ID = 1;

// 加载订单数据（从后端接口获取）
async function loadOrders() {
    try {
        const res = await fetch(`/api/v1/delivery/riders/${RIDER_ID}/tasks`);
        const json = await res.json();
        orders = (json.code === '00000' && json.data) ? (json.data.list || []) : [];
    } catch (e) {
        console.error('加载配送任务失败', e);
        orders = [];
    }
    renderOrders();
    updateOrdersBadge();
    updateStats();
}

// 渲染订单列表
function renderOrders() {
    const ordersList = document.getElementById('ordersList');
    let filteredOrders = orders;
    
    if (currentFilter !== 'all') {
        filteredOrders = orders.filter(order => order.status === currentFilter);
    }
    
    if (filteredOrders.length === 0) {
        ordersList.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📦</div>
                <div class="empty-text">暂无订单</div>
            </div>
        `;
        return;
    }
    
    ordersList.innerHTML = filteredOrders.map(order => `
        <div class="order-card" onclick="showOrderDetail('${order.id}')">
            <div class="order-header">
                <div class="order-id">#${order.id}</div>
                <div class="order-status ${getStatusClass(order.status)}">${getStatusText(order.status)}</div>
            </div>
            <div class="order-info">
                <div class="merchant-name">${order.merchantName}</div>
                <div class="delivery-address">📍 ${order.deliveryAddress}</div>
            </div>
            <div class="order-details">
                <span>${order.distance} · ${order.estimatedTime}</span>
                <span class="delivery-fee">+¥${order.deliveryFee}</span>
            </div>
            ${getOrderActions(order)}
        </div>
    `).join('');
}

// 获取状态样式类
function getStatusClass(status) {
    const statusMap = {
        'pending': 'status-pending',
        'accepted': 'status-accepted',
        'delivering': 'status-delivering',
        'completed': 'status-completed'
    };
    return statusMap[status] || 'status-pending';
}

// 获取状态文本
function getStatusText(status) {
    const statusMap = {
        'pending': '待接单',
        'accepted': '已接单',
        'delivering': '配送中',
        'completed': '已完成'
    };
    return statusMap[status] || '未知状态';
}

// 获取订单操作按钮
function getOrderActions(order) {
    switch(order.status) {
        case 'pending':
            return `
                <div class="order-actions">
                    <button class="action-btn btn-secondary" onclick="event.stopPropagation(); rejectOrder('${order.id}')">拒单</button>
                    <button class="action-btn btn-primary" onclick="event.stopPropagation(); acceptOrder('${order.id}')">接单</button>
                </div>
            `;
        case 'accepted':
            return `
                <div class="order-actions">
                    <button class="action-btn btn-secondary" onclick="event.stopPropagation(); callCustomer('${order.contactPhone}')">联系客户</button>
                    <button class="action-btn btn-success" onclick="event.stopPropagation(); startDelivery('${order.id}')">开始配送</button>
                </div>
            `;
        case 'delivering':
            return `
                <div class="order-actions">
                    <button class="action-btn btn-secondary" onclick="event.stopPropagation(); callCustomer('${order.contactPhone}')">联系客户</button>
                    <button class="action-btn btn-success" onclick="event.stopPropagation(); completeDelivery('${order.id}')">确认送达</button>
                </div>
            `;
        default:
            return '';
    }
}

// 显示订单详情
function showOrderDetail(orderId) {
    const order = orders.find(o => String(o.id) === String(orderId));
    if (!order) return;
    
    currentOrderId = orderId;
    
    const content = `
        <div style="margin-bottom: 16px;">
            <h4>订单信息</h4>
            <p><strong>订单号:</strong> ${order.id}</p>
            <p><strong>商家:</strong> ${order.merchantName}</p>
            <p><strong>状态:</strong> ${getStatusText(order.status)}</p>
            <p><strong>下单时间:</strong> ${order.createTime}</p>
        </div>
        
        <div style="margin-bottom: 16px;">
            <h4>配送信息</h4>
            <p><strong>收货地址:</strong> ${order.deliveryAddress}</p>
            <p><strong>联系人:</strong> ${order.contactName}</p>
            <p><strong>联系电话:</strong> ${order.contactPhone}</p>
            <p><strong>配送距离:</strong> ${order.distance}</p>
            <p><strong>预计时间:</strong> ${order.estimatedTime}</p>
            <p><strong>配送费:</strong> ¥${order.deliveryFee}</p>
        </div>
        
        <div>
            <h4>商品清单</h4>
            ${order.items.map(item => `
                <p>${item.name} x${item.quantity} - ¥${item.price}</p>
            `).join('')}
        </div>
    `;
    
    document.getElementById('orderDetailContent').innerHTML = content;
    
    // 更新操作按钮
    const actionBtn = document.getElementById('orderActionBtn');
    switch(order.status) {
        case 'pending':
            actionBtn.textContent = '接单';
            actionBtn.className = 'modal-btn btn-primary';
            break;
        case 'accepted':
            actionBtn.textContent = '开始配送';
            actionBtn.className = 'modal-btn btn-success';
            break;
        case 'delivering':
            actionBtn.textContent = '确认送达';
            actionBtn.className = 'modal-btn btn-success';
            break;
        default:
            actionBtn.style.display = 'none';
    }
    
    document.getElementById('orderDetailModal').classList.add('show');
}

// 关闭模态框
function closeModal() {
    document.getElementById('orderDetailModal').classList.remove('show');
    currentOrderId = null;
}

// 处理订单操作
function handleOrderAction() {
    if (!currentOrderId) return;
    
    const order = orders.find(o => o.id === currentOrderId);
    if (!order) return;
    
    switch(order.status) {
        case 'pending':
            acceptOrder(currentOrderId);
            break;
        case 'accepted':
            startDelivery(currentOrderId);
            break;
        case 'delivering':
            completeDelivery(currentOrderId);
            break;
    }
    
    closeModal();
}

// 接单
async function acceptOrder(orderId) {
    try {
        const res = await fetch(`/api/v1/delivery/tasks/${orderId}/accept?riderId=${RIDER_ID}`, { method: 'POST' });
        const json = await res.json();
        if (json.code === '00000') {
            showMessage('接单成功', 'success');
            await loadOrders();
        } else {
            showMessage(json.info || '接单失败', 'error');
        }
    } catch (e) {
        showMessage('接单失败', 'error');
    }
}

// 拒单
async function rejectOrder(orderId) {
    if (!confirm('确定要拒绝这个订单吗？')) return;
    try {
        await fetch(`/api/v1/delivery/tasks/${orderId}/reject?riderId=${RIDER_ID}`, { method: 'POST' });
        showMessage('已拒绝订单', 'info');
        await loadOrders();
    } catch (e) {
        showMessage('操作失败', 'error');
    }
}

// 开始配送
async function startDelivery(orderId) {
    try {
        const res = await fetch(`/api/v1/delivery/tasks/${orderId}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 5 })
        });
        const json = await res.json();
        if (json.code === '00000') {
            showMessage('开始配送', 'success');
            await loadOrders();
        } else {
            showMessage(json.info || '操作失败', 'error');
        }
    } catch (e) {
        showMessage('操作失败', 'error');
    }
}

// 完成配送
async function completeDelivery(orderId) {
    if (!confirm('确认已送达？')) return;
    try {
        const res = await fetch(`/api/v1/delivery/tasks/${orderId}/status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: 6 })
        });
        const json = await res.json();
        if (json.code === '00000') {
            showMessage('配送完成', 'success');
            await loadRiderInfo();
            await loadOrders();
        } else {
            showMessage(json.info || '操作失败', 'error');
        }
    } catch (e) {
        showMessage('操作失败', 'error');
    }
}

// 联系客户
function callCustomer(phone) {
    alert(`拨打电话: ${phone}`);
}

// 更新订单徽章
function updateOrdersBadge() {
    const pendingCount = orders.filter(o => o.status === 'pending' || o.status === 'accepted' || o.status === 'delivering').length;
    const badge = document.getElementById('ordersBadge');
    if (pendingCount > 0) {
        badge.textContent = pendingCount;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}

// 更新统计数据
function updateStats() {
    const completedToday = orders.filter(o => o.status === 'completed').length;
    const earningsToday = orders.filter(o => o.status === 'completed')
        .reduce((sum, order) => sum + order.deliveryFee, 0);
    
    document.getElementById('todayOrders').textContent = completedToday;
    document.getElementById('todayEarnings').textContent = `¥${earningsToday.toFixed(0)}`;
}

// 加载骑手信息（从后端接口获取）
async function loadRiderInfo() {
    try {
        const res = await fetch(`/api/v1/delivery/riders/${RIDER_ID}`);
        const json = await res.json();
        riderInfo = (json.code === '00000' && json.data) ? json.data : generateMockRiderInfo();
    } catch (e) {
        riderInfo = generateMockRiderInfo();
    }
    document.getElementById('riderName').textContent = riderInfo.name;
    document.getElementById('riderRating').textContent = riderInfo.rating;
    document.getElementById('todayOrders').textContent = riderInfo.todayDeliveryCount;
    document.getElementById('todayEarnings').textContent = `¥${riderInfo.todayEarnings}`;
    
    // 更新工作状态
    isOnline = riderInfo.workStatus === 1;
    const btn = document.getElementById('workStatusBtn');
    const status = document.getElementById('riderStatus');
    
    if (isOnline) {
        btn.textContent = '下线休息';
        btn.classList.remove('offline');
        status.textContent = `在线 · 今日已接单 ${riderInfo.todayDeliveryCount} 单`;
    } else {
        btn.textContent = '上线接单';
        btn.classList.add('offline');
        status.textContent = `离线 · 今日已接单 ${riderInfo.todayDeliveryCount} 单`;
    }
}
</script>
